}
function renderCategoryReview(tabKey){
  // Score Matrix — dense model×category heatmap. One row per model (top
  // N), one column per dimension. Each cell is a color-banded score pill
  // so the user sees every dimension at a glance instead of scrolling a
  // card-per-category list with stacked mini-bars.
  const summary=reviewSummary(tabKey);
  if(!summary.rollups.length)return'';
  const categoryKeys=new Set();
  for(const rollup of summary.rollups){
    for(const key of Object.keys(rollup.categories||{}))categoryKeys.add(key);
  }
  const dims=laneDimensionObjects(tabKey,summary.rollups).filter((d)=>d.key!=='overall'&&d.key!=='speed'&&categoryKeys.has(d.key));
  if(!dims.length)return'';
  const models=summary.rollups.slice(0,8);
  const cellCls=(score)=>score>=80?'pass':score>=55?'warn':score>0?'fail':'none';
  const headerCells=dims.map((d)=>`<div class="mx-col-head" title="${esc(d.label)}">${esc(d.label.split(' ')[0])}</div>`).join('');
  const rows=models.map((m,rowIndex)=>{
    const cells=dims.map((d)=>{
      const raw=Number(m.dimensions[d.key]||m.categories?.[d.key]?.total&&(m.categories[d.key].total/m.categories[d.key].count)||0);
      const score=Math.round(raw||0);
      const cls=cellCls(score);
      return`<div class="mx-cell ${cls}" title="${esc(m.model)} · ${esc(d.label)} · ${score}%"><div class="mx-cell-fill" style="height:${score}%"></div><div class="mx-cell-num">${score||'—'}</div></div>`;
    }).join('');
    const badge=rowIndex===0&&m.sampleAdequate?'<span class="tag teal">BEST</span>':(rowIndex===0?'<span class="tag dim">TOP · NOT VERIFIED</span>':'');
    return`<div class="mx-row"><div class="mx-row-label"><span class="mx-model">${esc(m.model)}</span>${badge}<span class="mx-runs">${m.runs}R · ${m.passRate}% pass</span></div><div class="mx-cells" style="grid-template-columns:repeat(${dims.length},minmax(0,1fr))">${cells}</div></div>`;
  }).join('');
  const laneLabel=TAB_CONFIG[tabKey]?.label||'Lane';
  return`<section class="panel" style="padding:14px">
    <div class="section-head"><div><div class="mini-label">CATEGORY GRAPH</div><h3>${esc(laneLabel)} Category Matrix</h3></div><span class="chip dim">${models.length}×${dims.length}</span></div>
    <div class="matrix-head" style="grid-template-columns:minmax(140px,1.4fr) minmax(0,3fr)">
      <div class="mx-corner">MODEL</div>
      <div class="mx-cells mx-col-heads" style="grid-template-columns:repeat(${dims.length},minmax(0,1fr))">${headerCells}</div>
    </div>
    <div class="matrix-body">${rows}</div>
    <div class="matrix-legend">
      <span class="mx-key"><span class="mx-dot pass"></span>≥80%</span>
      <span class="mx-key"><span class="mx-dot warn"></span>55-79%</span>
      <span class="mx-key"><span class="mx-dot fail"></span>&lt;55%</span>
      <span class="mx-key"><span class="mx-dot none"></span>no data</span>
    </div>
  </section>`;
}
function aggregateLeaderboard(tabKey='dashboard',limit=6){
  // Prefer the authoritative backend leaderboard (reliability-weighted, sample-
  // penalty aware) that ships with the active lane. Fall back to a
  // client-side mean only when the backend hasn't returned data yet — the
  // client path has no stability weighting and is only safe as a placeholder.
  const backend=state.tabData?.[tabKey]?.leaderboard;
  if(Array.isArray(backend)&&backend.length){
    return backend.slice(0,limit).map((entry)=>({
      model:entry.model||entry.modelId,
      runs:Number(entry.totalRuns||0),
      score:scorePct(entry.composite),
      provider:entry.source||'',
      last:entry.lastRun||'',
      sampleAdequate:entry.sample_adequate===true&&entry.ranking_eligible!==false
    }));
  }
  const grouped=new Map();
  for(const run of scopeRuns(tabKey)){
    const normalized=normalizeRunForDisplay(run);
    const key=normalizeId(normalized.model);
    const existing=grouped.get(key)||{model:normalized.model,total:0,runs:0,provider:normalized.provider,last:normalized.timestamp};
    existing.total+=normalized.overall;
    existing.runs+=1;
    if(new Date(normalized.timestamp||0).getTime()>new Date(existing.last||0).getTime())existing.last=normalized.timestamp;
    grouped.set(key,existing);
  }
  return Array.from(grouped.values()).map((entry)=>({...entry,score:entry.runs?Math.round(entry.total/entry.runs):0})).sort((a,b)=>b.score-a.score||b.runs-a.runs).slice(0,limit);
}
function statsForTab(tabKey){
  if(tabKey==='dashboard')return dashboardStats();
  const stats=state.tabData[tabKey]?.stats||{};
  return{
    totalRuns:Number(stats.total_runs||0),
    passRate:Number(stats.pass_rate||0),
    avgScore:Number(stats.avg_score||0),
    avgTime:Number(stats.avg_time_ms||stats.avg_duration_ms||0)
  };
}
function laneBreakdown(){
  return Object.values(TAB_CONFIG).filter((tab)=>tab.key!=='dashboard').map((tab)=>{
    const runs=state.tabData[tab.key]?.runs||[];
    const passCount=runs.filter((run)=>pick(run,'pass')===true).length;
    const avg=runs.length?Math.round(runs.reduce((sum,run)=>sum+scorePct(pick(run,'score','overall_score','composite')),0)/runs.length):0;
    return{label:tab.label,total:runs.length,passRate:runs.length?Math.round((passCount/runs.length)*100):0,avg};
  }).filter((entry)=>entry.total>0).sort((a,b)=>b.avg-a.avg).slice(0,4);
}
function activeHeroStatus(){
  const run=currentRunState();
  if(run?.status)return run.status;
  const total=allRuns().length;
  return total?'complete':'idle';
}
function heroMetrics(){
  const stats=statsForTab(state.activeTab);
  const best=aggregateLeaderboard(state.activeTab,1)[0];
  const scopeLabel=state.activeTab==='dashboard'?'all indexed lanes':'this lane';
  return[
    {label:'Lab score',value:String(Math.round(stats.avgScore||0)),hint:'Average score across completed runs.',glow:true},
    {label:'Pass rate',value:fmtPct(stats.passRate),hint:'Share of completed runs that passed.'},
    {label:'Finished runs',value:String(stats.totalRuns),hint:`Completed runs in ${scopeLabel}.`},
    {label:'Top model',value:best?best.model:'none',hint:best?`${best.score}% average over ${best.runs} runs.`:'Leaderboard fills as evidence arrives.'}
  ];
}
// ── System status bar + offline banner ───────────────────────────────────
// Persistent strip at the very top of the app shell. Visible in every state;
// its color encodes the single summary verdict. A failing click handler kicks
// an immediate re-check so the user can force a refresh without waiting for
// the 20s poll.
function renderSystemStatusBar(){
  const h=state.health||{};
  const summary=h.summary||'unknown';
  const netOk=h.net&&h.net.ok===true;
  const netUnknown=h.net&&h.net.ok===null;
  const netLabel=netUnknown?'Checking…':(netOk?'Network OK':(h.net?.error||'Network down'));
  const providers=Object.values(h.providers||{});
  const cloud=providers.filter((p)=>p.kind==='cloud');
  const cloudOk=cloud.filter((p)=>p.status==='ok').length;
  const cloudDown=cloud.filter((p)=>p.status==='down').length;
  const cloudUnconfigured=cloud.filter((p)=>p.status==='unconfigured').length;
  const cloudUnknown=cloud.filter((p)=>p.status==='unknown').length;
  const local=providers.filter((p)=>p.kind==='local');
  const localDown=local.filter((p)=>p.status==='down').length;
  const localOk=local.filter((p)=>p.status==='ok').length;
  const cloudTotal=cloud.length;
  const providerLabel=cloudTotal?`${cloudOk}/${cloudTotal} cloud providers reachable`:'No cloud providers configured';
  const statusWord=summary==='online'?'Online':summary==='degraded'?'Degraded':summary==='offline'?'Offline':'Checking';
  const lastLabel=h.lastSummaryAt?`checked ${esc(fmtRelativeTime(h.lastSummaryAt))}`:'checking…';
  const spinning=h.checking?'spinning':'';
  const localChipCls=localOk?'ok':localDown?'down':'unknown';
  const cloudChipCls=cloudDown>0?'down':(cloudUnknown>0||cloudUnconfigured>0)?'warn':cloudOk>0?'ok':'unknown';
  return`<div class="sys-status sys-${summary}" role="status" aria-live="polite">
    <div class="sys-left">
      <span class="sys-dot" aria-hidden="true"></span>
      <span class="sys-word">${esc(statusWord)}</span>
    </div>
    <div class="sys-mid">

function renderHero(){
  // Abyss banner — full-width instrument callsign. Left: system
  // designation. Middle: giant teal lab score with fill bar. Right:
  // chip-stack telemetry (status, runs, pass, top model, cost).
  // No paragraph copy, no nested cards, no "hero-side" — this IS
  // the hero, as one single strip.
  const status=activeHeroStatus();
  const stats=statsForTab(state.activeTab);
  const best=aggregateLeaderboard(state.activeTab,1)[0];
  const meta=state.tabData?.[state.activeTab]?.leaderboardMeta||{};
  const hasRanking=!!best;
  const hasPublicRanking=Number(meta.eligible_count||0)>0&&!!best;
  const score=hasRanking?Math.round(best.score||stats.avgScore||0):'—';
  const passRate=Math.round(stats.passRate||0);
  const totalRuns=stats.totalRuns||0;
  const statusCls=status==='complete'?'teal':status==='error'?'red':status==='idle'?'dim':'orange';
  const topModel=hasRanking?best.model:'NO RANK YET';
  const topScore=hasRanking?best.score:null;
  const scope=laneScopeDescriptor(state.activeTab);
  const activeLaneLabel=scope.tabLabel;
  // Scope chip: explicit, authoritative answer to "what am I looking at?".
  // kind drives color — teal for lane (trusted, scoped), cyan for global
  // (everything), dim for settings. Tooltip spells out the included task
  // families so the operator can verify the scope without opening code.
  const scopeKindCls=scope.kind==='global'?'cyan':scope.kind==='settings'?'dim':'teal';
  const scopeTooltip=scope.kind==='lane'
    ? `Scoped to: ${scope.familiesLabel}. ${scope.sampleSize} run${scope.sampleSize===1?'':'s'} in scope.`
    : scope.kind==='global'
      ? `Global view — aggregates every configured lane. ${scope.sampleSize} runs total.`
      : 'Provider/model registry. Not a benchmark view.';
  const scopeChip=`<div class="chip ${scopeKindCls} hot scope-chip" title="${esc(scopeTooltip)}" data-scope-kind="${scope.kind}" data-scope-tab="${esc(scope.tabKey)}">SCOPE · ${esc(scope.scopeLabel)}</div>`;
  const provisionalChip=scope.kind==='lane'&&scope.provisional
    ? `<div class="chip amber hot" title="Fewer than ${LEADERBOARD_MIN_N_UI} runs meet the sample threshold in this lane — treat rankings as provisional.">PROVISIONAL · n=${scope.sampleSize}</div>`
    : '';
  const scoreWidth=typeof score==='number'?score:0;
  const scoreLabel=hasPublicRanking?'PUBLIC TRUST SCORE':'OVERALL TRUST SCORE';
  const topChip=hasRanking
    ? `<div class="chip orange">TOP ${esc(String(topModel).slice(0,16).toUpperCase())}${topScore!=null?' · '+topScore+'%':''}</div>`
    : `<div class="chip orange">NO RANK YET</div>`;
  return`<section class="abyss-banner"><div class="ab-callsign"><div class="ab-mark">${esc(activeLaneLabel)}</div><div class="ab-title">Luak</div><div class="ab-sub">Evaluation Lattice</div><div class="ab-score-inline"><div class="ab-score-row"><span class="ab-score-label">${scoreLabel}</span><span class="ab-score-inline-num">${score}</span><span class="ab-score-runs">${totalRuns} run${totalRuns===1?'':'s'} indexed</span></div><div class="ab-score-bar"><div class="ab-score-fill" style="width:${scoreWidth}%"></div></div></div><div class="view-toggle"><button class="${state.viewMode==='simple'?'active':''}" onclick="setViewMode('simple')">Simple</button><button class="${isAdvancedView()?'active':''}" onclick="setViewMode('advanced')">Advanced Lab</button></div></div><div class="ab-telemetry">${scopeChip}${provisionalChip}<div class="chip ${statusCls}">● ${esc(status.toUpperCase())}</div><div class="chip teal">PASS ${passRate}%</div>${topChip}<div class="chip dim">${totalRuns} RUNS</div></div></section>`;
}
function evidenceValue(label,value){
  if(value===undefined||value===null||value==='')return'';
  return`<div class="evidence-block"><div class="evidence-label">${esc(label)}</div><pre class="evidence-value">${esc(typeof value==='string'?value:JSON.stringify(value,null,2))}</pre></div>`;
}
function renderSkipCards(result){
  // Detect SKIPPED_* outcomes from the focused result. A skipped run
  // means the runner did NOT exercise the model — it bailed during
  // preflight (missing fixture, hash drift, model lacks capability,
  // adapter has no transport, etc.). Render these as their own
  // clearly-distinct cards so the operator sees "Skipped, not
  // failed" up front, never confused with a model fail.
  const v = result?.verdict || {};
  const reason = String(v.failureReasonCode || '').toUpperCase();
  const skipCodes = new Set([
    'SKIPPED_FIXTURE_MISSING',
    'SKIPPED_FIXTURE_HASH_MISMATCH',
    'SKIPPED_UNSUPPORTED_MULTIMODAL',
    'SKIPPED_IMAGE_TRANSPORT_UNSUPPORTED',
    'SKIPPED_UNSUPPORTED_ROLEPLAY_PROFILE',
    'SKIPPED_EXPERIMENTAL_FAMILY'
  ]);
  const isSkip = v.completionState === 'SKIPPED' || skipCodes.has(reason);
  if(!isSkip)return'';
  const ev=v.evidence||{};
  const skipCode=ev.skip_classification||reason||'SKIPPED';
  const skipReason=ev.skip_reason||v.failureReasonSummary||'Run was skipped by preflight; no provider was called.';
  const family=ev.family||result.family||'unknown';
  const fixturePath=ev.fixture_path||result.fixturePath||null;
  const capability=ev.capability_required||null;
  return`<div class="subpanel skip-section">
    <div class="section-head"><div><div class="mini-label">SKIPPED · NOT FAILED</div><h3>Run did not exercise the model</h3></div><span class="chip dim">${esc(skipCode)}</span></div>
    <article class="skip-card" role="group" aria-label="Skipped run details">
      <header class="skip-head">
        <span class="badge skip">SKIPPED</span>
        <span class="skip-code-pill">${esc(skipCode)}</span>
        <span class="skip-family">family · ${esc(family)}</span>
      </header>
      <p class="skip-reason"><strong>Skipped, not failed.</strong> ${esc(skipReason)}</p>
      <dl class="skip-grid">
        <dt>Provider called</dt><dd><span class="badge skip">NO</span></dd>
        <dt>Tokens spent</dt><dd>0 in · 0 out</dd>
        <dt>Cost</dt><dd>$0.0000</dd>
        <dt>Affects leaderboard</dt><dd><span class="badge skip">NO</span></dd>
        <dt>Affects certification</dt><dd><span class="badge skip">NO</span></dd>
        <dt>Provider</dt><dd>${esc(result.provider||ev.provider||'—')}</dd>
        <dt>Model</dt><dd>${esc(result.model||'—')}</dd>
        ${fixturePath?`<dt>Fixture path</dt><dd><code class="subq-code">${esc(fixturePath)}</code></dd>`:''}
        ${ev.expected_sha256||ev.expectedSha256?`<dt>Expected sha256</dt><dd><code class="subq-code">${esc(ev.expected_sha256||ev.expectedSha256)}</code></dd>`:''}
        ${ev.actual_sha256||ev.actualSha256?`<dt>Actual sha256</dt><dd><code class="subq-code subq-got">${esc(ev.actual_sha256||ev.actualSha256)}</code></dd>`:''}
        ${capability?`<dt>Required capability</dt><dd>${esc(Array.isArray(capability)?capability.join(', '):String(capability))}</dd>`:''}
      </dl>
    </article>
  </div>`;
}

function renderSubQuestionFailures(result){
  // Per-sub-question failure cards. Built from the structured
  // .subQuestion field populated by normalizeRunForDisplay when the
  // bundle's timeline carries one error event per failed Q.
  //
  // The visual contract: each Q is a separately bordered card with a
  // prominent QID badge so a reader can NEVER cross-read field names
  // between adjacent failures (the 425-vs-6 confusion the operator
  // hit on 2026-05-25).
  const rows=(result.details||[])
    .filter((d)=>d&&d.subQuestion&&(d.subQuestion.qid||d.subQuestion.expectedPattern||d.subQuestion.modelAnswer));
  if(!rows.length)return'';
  const cards=rows.map((d,i)=>{
    const sq=d.subQuestion;
    const qid=sq.qid||`Q${i+1}`;
    const expected=sq.expectedPattern||'(not in bundle)';
    const got=sq.modelAnswer||'(empty)';
    const reason=sq.reason||'(none)';
    return`<article class="subq-card fail" role="group" aria-labelledby="subq-${esc(qid)}-title">
      <header class="subq-head">
        <span class="subq-badge">${esc(qid)}</span>
        <span class="subq-title" id="subq-${esc(qid)}-title">SUB-QUESTION FAIL</span>
        <span class="badge fail">${esc(d.status||'FAIL')}</span>
      </header>
      <dl class="subq-grid">
        <dt>Expected pattern</dt>
        <dd><code class="subq-code">${esc(expected)}</code></dd>
        <dt>Model answered</dt>
        <dd><code class="subq-code subq-got">${esc(got)}</code></dd>
        <dt>Pass/fail reason</dt>
        <dd class="subq-reason">${esc(reason)}</dd>
      </dl>
    </article>`;
  }).join('');
  return`<div class="subpanel subq-section">
    <div class="section-head"><div><div class="mini-label">SUB-QUESTION FAILURES</div><h3>${rows.length} failed question${rows.length===1?'':'s'} in this trial</h3></div><span class="chip dim">each card is one Q · clearly bounded</span></div>
    <div class="subq-list">${cards}</div>
  </div>`;
}

function renderDrilldownExplorer(tabKey,result){
  const rows=result.details||[];

  return`<div class="drilldown-list">${rows.map((item,index)=>{const rowKey=detailRowKey(tabKey,result,index);const open=!!state.expandedRows[rowKey];return`<article class="drilldown-row ${item.statusClass} ${open?'open':''}"><button class="run-strip drilldown-summary ${item.statusClass}" onclick="toggleDetailRow('${esc(rowKey)}')" aria-expanded="${open?'true':'false'}"><div class="rs-dot"></div><div class="rs-model">${esc(result.model)}</div><div class="rs-task">${esc(item.name)}</div><div class="rs-bar"><div class="rs-fill" style="width:${item.score}%"></div></div><div class="rs-score">${item.score}%</div><div class="rs-badge badge ${item.statusClass}">${esc(item.status)}</div></button>${open?`<div class="drilldown-body"><div class="drilldown-meta"><span class="tag dim">LAT ${esc(fmtMs(item.latencyMs||item.timeMs||0))}</span>${item.cost?`<span class="tag dim">${esc(fmtMoney(item.cost))}</span>`:''}${item.errorText?'<span class="tag red">ERROR</span>':''}</div>${evidenceValue('Prompt / Question',item.prompt)}${evidenceValue('Model Answer',item.answer)}${evidenceValue('Expected / Threshold',item.expected)}${evidenceValue('Pass / Fail Reason',item.reason||item.message)}${evidenceValue('Error',item.errorText)}${evidenceValue('Evidence',item.evidence)}</div>`:''}</article>`}).join('')}</div>`;
}

function renderFocusedRun(tabKey){
  const result=focusedResultForTab(tabKey);
  if(!result)return'<section class="panel inspection-shell"><div class="empty">SELECT A RUN</div></section>';
  // Facts rendered as dense "label | value" strips — the old
  // renderFactList emitted cards with paragraph subtitles; the new
  // .fact-strip layout is a flat table-like rail, 9-11px mono, all
  // on one line, ellipsis on overflow. Reviewer scans vertically.
  // VERDICT and ORIGIN are shown as distinct fact strips so the operator can
  // see at a glance whether this was a model loss, an infra NC, or a
  // test/judge NC — three very different things that used to collapse onto
  // a single red "failed" badge.
  const originBucket=result.isModelFailure
    ? 'MODEL'
    : result.isInfraIssue
      ? 'INFRA'
      : result.isTestOrJudgeIssue
        ? 'TEST/JUDGE'
        : (result.completionState==='PASS'?'—':(result.failureOrigin||'UNKNOWN'));
  const originCls=result.isModelFailure?'red':result.isInfraIssue?'':result.isTestOrJudgeIssue?'cyan':'dim';
  const sigStatus=String(result.trust?.bundle_signature_status||'legacy_unverified');
  const sigCls=sigStatus==='valid'?'teal':sigStatus==='forged'||sigStatus==='tampered'?'red':'warn';
  const eligibility=runEligibilityMeta(result);
  const oracleStatus=String(result.oracleIntegrity?.oracle_hash_status||'unknown');
  const oracleCls=oracleStatus==='valid'?'teal':oracleStatus==='unknown'||oracleStatus==='not_required'?'dim':'red';
  const bp=result.benchmarkProvenance||{};
  const scoringLimits=Array.isArray(bp.known_scoring_limitations)?bp.known_scoring_limitations:[];
  const provenanceFacts=[
    {label:'BUNDLE',value:String(result.bundleId||result.runId||'unknown')},
    {label:'RANKING',value:eligibility.label,cls:eligibility.cls},
    {label:'HASH',value:String(result.bundleHash||'unknown').slice(0,16),cls:'teal'},
    {label:'AUTH',value:sigStatus.toUpperCase(),cls:sigCls},
    {label:'ORACLE',value:oracleStatus.toUpperCase(),cls:oracleCls},
    {label:'SOURCE',value:String(bp.source||'unknown')},
    {label:'PUBLIC',value:String(bp.public_status||'unknown').toUpperCase(),cls:bp.public_status==='private'?'teal':bp.public_status==='public'?'warn':'dim'},
    {label:'CONTAM RISK',value:String(bp.contamination_risk||'unknown').toUpperCase(),cls:bp.contamination_risk==='low'?'teal':bp.contamination_risk==='high'?'red':'warn'},
    {label:'TARGET',value:`${result.provider}/${result.model}`},
    {label:'TESTED MODEL',value:`${result.provider}/${result.model}`,cls:'teal'},
    {label:'JUDGE MODEL',value:result.judgeUsage?.kind==='deterministic'?'deterministic (no model)':`${result.judgeUsage?.provider||''}/${result.judgeUsage?.model||''}`,cls:result.judgeUsage?.kind==='deterministic'?'dim':'cyan'},
    {label:'TASK',value:`${displayTestName(result.task)} (${esc(result.task)})`},
    {label:'FAMILY',value:humanizeToken(result.family||'unknown'),cls:'dim'},
    {label:'VERDICT',value:String(result.verdictLabel||'UNKNOWN'),cls:result.verdictOriginCls||result.verdictClass||'dim'},
    {label:'ORIGIN',value:String(originBucket),cls:originCls},
    {label:'REASON',value:String(result.verdictSummary||'n/a')},
    ...(result.personalityEvaluation?[{label:'PERSONA CAT',value:String(result.personalityEvaluation.category||'UNKNOWN'),cls:result.personalityEvaluation.failure_is_infrastructure?'warn':result.personalityEvaluation.category==='STRONG_PERSONALITY'||result.personalityEvaluation.category==='ADEQUATE_PERSONALITY'||result.personalityEvaluation.category==='PASS'?'teal':['WEAK_PERSONALITY','OVERDONE_ROLEPLAY','STYLE_MISMATCH'].includes(String(result.personalityEvaluation.category))?'red':'dim'}]:[]),
    ...(result.benchmarkEvaluation?[{label:'BENCH CAT',value:String(result.benchmarkEvaluation.category||'UNKNOWN'),cls:result.benchmarkEvaluation.failure_is_infrastructure?'warn':result.benchmarkEvaluation.category==='PASS'?'teal':result.benchmarkEvaluation.category==='WRONG_ANSWER'?'red':'dim'}]:[]),
    ...(result.buildEvaluation?[{label:'BUILD CAT',value:String(result.buildEvaluation.category||'UNKNOWN'),cls:result.buildEvaluation.failure_is_infrastructure?'warn':result.buildEvaluation.category==='PASS'?'teal':['WRONG_EDIT','NO_EDIT','BUILD_FAILED','TEST_FAILED'].includes(String(result.buildEvaluation.category))?'red':'dim'}]:[]),
    ...(result.safetyEvaluation?[{label:'SAFETY CAT',value:String(result.safetyEvaluation.category||'UNKNOWN'),cls:result.safetyEvaluation.failure_is_infrastructure?'warn':['PASS','SAFE_REFUSAL','SAFE_COMPLETION'].includes(String(result.safetyEvaluation.category))?'teal':['UNSAFE_COMPLIANCE','OVER_REFUSAL'].includes(String(result.safetyEvaluation.category))?'red':'dim'}]:[]),
    ...(result.memoryEvaluation?[{label:'MEMORY CAT',value:String(result.memoryEvaluation.category||'UNKNOWN'),cls:result.memoryEvaluation.failure_is_infrastructure?'warn':result.memoryEvaluation.category==='PASS'?'teal':['RECALL_FAILURE','UPDATE_FAILURE','FORGET_FAILURE','SCOPE_LEAK'].includes(String(result.memoryEvaluation.category))?'red':'dim'}]:[]),
    ...(result.poisonEvaluation?[{label:'POISON CAT',value:String(result.poisonEvaluation.category||'UNKNOWN'),cls:result.poisonEvaluation.failure_is_infrastructure?'warn':result.poisonEvaluation.category==='PASS'?'teal':result.poisonEvaluation.category==='TRUE_COMPROMISE'?'red':'dim'}]:[]),
    {label:'2ND OPN',value:String(result.secondOpinionStatus||'skipped').toUpperCase(),cls:'dim'},
    {label:'QC',value:String(result.qcReviewStatus||'skipped').toUpperCase(),cls:'dim'},
    {label:'FLAGS',value:String(Number(result.reviewSecurity?.injection_flags_count||0)),cls:result.reviewSecurity?.injection_flags_count?'':'dim'}
  ];
  const methodologyFacts=[
    {label:'SCHEMA',value:String(result.schema||'crucibulum.v1'),cls:'dim'},
    {label:'TEST CATEGORY',value:String(result.suiteId||'v1')},
    {label:'JUDGE',value:String(result.judge?.label||'deterministic'),cls:'teal'},
    {label:'HASH OK',value:result.trust?.bundle_hash_verified?'VERIFIED':'UNCHECKED',cls:result.trust?.bundle_hash_verified?'teal':''},
    {label:'SIGNED',value:result.trust?.bundle_authenticated?'VERIFIED':'NO PROOF',cls:result.trust?.bundle_authenticated?'teal':sigCls},
    {label:'RUBRIC',value:result.trust?.rubric_hidden?'HIDDEN':'VISIBLE',cls:'dim'},
    {label:'ORACLE VIS',value:String(bp.oracle_visibility||'unknown').toUpperCase(),cls:'dim'},
    {label:'GOLD VIS',value:String(bp.gold_solution_visibility||'unknown').toUpperCase(),cls:'dim'},
    {label:'LIMITS',value:scoringLimits.length?scoringLimits.join(' | '):'unknown',cls:scoringLimits.length?'warn':'dim'}
  ];

  // When overall score can't be resolved (e.g. hydrated payload missing it),
  // show a neutral state rather than a misleading 0% / FAILED badge.
  const overallCls=!result.overallKnown?'dim':result.overall>=80?'pass':result.overall>=55?'warn':'fail';
  const overallWord=result.verdictLabel||(!result.overallKnown?'PENDING':result.overall>=80?'PASSED':result.overall>=55?'REVIEW':'FAILED');

  // Glyph wall — dense telemetry meters for the operational row.
  const op=result.operationalRows?.[0]||{};

    {label:'JUDGE COST',value:fmtMoney(judgeCost),cls:judgeCost>0?'cyan':'dim',title:'Cost charged for the judge / scoring model'},
    {label:'TOTAL COST',value:fmtMoney(totalCost),cls:'orange',title:'Tested-model cost + judge cost'},
    {label:'THRESH',value:`${result.passThreshold||0}%`,cls:'dim'}
  ];

  const honestyBanner=(!eligibility.ranked&&(eligibility.isNotCountedTowardScore||eligibility.isPreFixInflated))?`<div class="run-honesty-banner"><span class="chip red hot">${eligibility.isPreFixInflated?'PRE-FIX HISTORICAL':'NOT COUNTED'}</span><span>${esc(eligibility.reasons.join(' · '))}</span></div>`:'';
  return`<section class="panel inspection-shell">
    ${honestyBanner}
    <div class="inspection-top">
      <div class="model-callout">
        <div class="eyebrow">FOCUSED RUN</div>
        <h2 class="model-name">${esc(result.model)}</h2>
        <div class="mc-chips">
          <span class="chip orange">${esc(String(result.provider).toUpperCase())}</span>
          <span class="chip teal" title="${esc(result.task)}">${esc(displayTestName(result.task).toUpperCase())}</span>
          <span class="chip dim">${esc(humanizeToken(result.family||'unknown').toUpperCase())}</span>
          ${result.verdictLabel?`<span class="chip ${result.verdictClass||'dim'} ${result.verdictOriginCls||''}" title="${esc(result.verdictHint||'')}">${esc(result.verdictGlyph||'')} ${esc(result.verdictLabel)}</span>`:''}
          <span class="chip dim">${esc(fmtDate(result.timestamp))}</span>
        </div>
      </div>
      <div class="mc-score ${overallCls}" title="Composite score combines correctness with secondary credits (efficiency / regression / integrity). For conversational tests the formula is round((correctness*0.85 + efficiency*0.15)*100)/100, so legal composite values may differ from the binary correctness anchors. See docs/SCORING_FIELDS.md.">
        <div class="mc-score-label">COMPOSITE</div>
        <div class="mc-score-num">${esc(result.overallKnown?String(result.overall):'—')}</div>
        <span class="badge ${overallCls}">${overallWord}</span>
        ${(result.overallKnown && (typeof op.correctness === 'number' || typeof op.efficiency === 'number'))
          ? `<div class="mc-score-breakdown dim" style="font-size:10px;margin-top:4px;line-height:1.3" title="The COMPOSITE above is round((correctness*0.85 + efficiency*0.15)*100)/100 for conversational tests. Inspect Correctness directly for binary-question accuracy.">correctness ${esc(String(scorePct(op.correctness)))}% · efficiency ${esc(String(scorePct(op.efficiency)))}%<br>formula: correctness×85% + efficiency×15%</div>`
          : ''}
      </div>
    </div>

    <div class="inspection-grid">
      <div class="stack-grid">
        <div class="subpanel">
          <div class="section-head"><div><div class="mini-label">SIGNAL CARDS</div><h3>Category Breakdown</h3></div></div>

        </div>
        ${isSimpleView()?'':`<div class="subpanel">

          <div class="glyph-grid">${glyphs.map(g=>`<div class="glyph"${g.title?` title="${esc(g.title)}"`:''}><div class="g-label">${esc(g.label)}</div><div class="g-value ${g.cls||''}">${esc(g.value)}</div></div>`).join('')}</div>
        </div>`}
      </div>
      ${isAdvancedView()?`<div class="stack-grid">
        <div class="subpanel">

          <div class="fact-list">${provenanceFacts.map(f=>`<div class="fact-strip"><div class="fs-label">${esc(f.label)}</div><div class="fs-value ${f.cls||''}">${esc(f.value)}</div></div>`).join('')}</div>

function scoreHistogramBuckets(runs){
  // 10-point bins, 0..100, returns [{label, count, cls}] for a compact
  // distribution bar chart. Gives at-a-glance sense of overall quality.
  const bins=Array.from({length:10},(_,i)=>({lo:i*10,hi:i*10+9,count:0}));
  for(const run of runs){
    const s=scorePct(run.overall);
    const idx=Math.min(9,Math.floor(s/10));
    bins[idx].count+=1;
  }
  const top=Math.max(1,...bins.map((b)=>b.count));
  return bins.map((b)=>({
    label:`${b.lo}–${b.hi===99?100:b.hi}`,
    count:b.count,
    width:Math.round((b.count/top)*100),
    cls:b.lo>=80?'pass':b.lo>=55?'warn':'fail'
  }));
}
function renderScoreDistribution(tabKey,runs){
  if(!runs.length)return'';
  const bins=scoreHistogramBuckets(runs);
  const total=runs.length;
  return`<div class="dist-chart"><div class="dist-bars">${bins.map((b)=>`<div class="dist-col" title="${b.label}%: ${b.count} run${b.count===1?'':'s'}"><div class="dist-count">${b.count||''}</div><div class="dist-bar-track"><div class="dist-bar-fill ${b.cls}" style="height:${b.width}%"></div></div><div class="dist-label">${b.label}</div></div>`).join('')}</div><div class="dist-caption">${total} run${total===1?'':'s'} · score distribution</div></div>`;
}

function archiveFilterLabel(filter){
  if(filter==='pass')return'PASS';
  if(filter==='fail')return'FAIL';

  if(filter==='model')return'MODEL FAIL';
  if(filter==='infra')return'INFRA';

}
function renderRuns(tabKey){
  // Archive defaults to a compact score-distribution graph + top 6 rows,
  // not a wall of every run. "Show all" expands to the dense horizontal
  // strip list for power-users who want to scan linearly.
  const runs=state.tabData[tabKey]?.runs||[];
  const scope=laneScopeDescriptor(tabKey);
  if(!runs.length){
    // Lane-aware empty copy so a reader knows *which* lane is empty and what
    // "no runs" means in this scope — "NO SIGNAL" alone is ambiguous between
    // "the lane has no runs" and "we're not rendering anything yet".
    const laneMsg=scope.kind==='lane'
      ? `No ${scope.tabLabel} runs in this scope yet. Arm a model and press RUN to populate.`
      : scope.kind==='global'
        ? 'No runs recorded yet across any lane.'
        : 'No signal in this view.';
    return`<div class="empty empty-lane"><div class="empty-title">NO SIGNAL · ${esc(scope.scopeLabel)}</div><div class="empty-body">${esc(laneMsg)}</div></div>`;
  }
  const normalized=runs.map((run)=>({raw:run,n:normalizeRunForDisplay(run)}));
  const filter=state.archiveFilter[tabKey]||'all';
  const filtered=normalized.filter(({n})=>{
    if(filter==='pass')return n.completionState==='PASS';
    if(filter==='fail')return n.completionState==='FAIL';
    if(filter==='nc')return n.completionState==='NC';
    if(filter==='model')return n.completionState==='FAIL'&&n.failureOrigin==='MODEL';
    if(filter==='infra')return n.completionState==='NC'&&['PROVIDER','NETWORK','HARNESS','UNKNOWN'].includes(n.failureOrigin||'');
    if(filter==='testjudge')return n.completionState==='NC'&&['TEST','JUDGE'].includes(n.failureOrigin||'');
    return true;
  });
  const expanded=!!state.collapsed[`archive:${tabKey}`];
  const visible=expanded?filtered.slice(0,200):filtered.slice(0,6);
  const stripRow=({raw,n})=>{
    // Two classes in parallel: legacy pass|warn|fail drives the existing
    // color band, the origin-specific class adds the glyph and distinct
    // tint so NC·PROVIDER never reads the same as FAIL·MODEL.
    const cls=n.verdictClass||'warn';
    const originCls=n.verdictOriginCls||'';
    const word=n.verdictLabel||'REVIEW';
    const glyph=n.verdictGlyph||'';
    const hint=n.verdictHint||'';
    const rid=raw.bundle_id||raw.run_id||raw.id||'';
    const taskName=esc(humanizeToken(raw.task_id||n.task));
    const famKey=raw.family||n.family||'';
    const famLabel=famKey?(TASK_FAMILY_LABELS[famKey]||famKey):'';
    const famChip=famLabel?`<span class="tag dim rs-family">${esc(famLabel.toUpperCase())}</span>`:'';
    const eligibility=runEligibilityMeta({raw,n});
    const eligibilityTag=`<span class="tag ${eligibility.cls} rs-eligibility">${esc(eligibility.label)}</span>`;
    const reason=n.verdictSummary?`<div class="rs-reason">${esc(n.verdictSummary)}</div>`:'';
    return`<button class="run-strip ${cls} ${originCls}" title="${esc(hint)}" onclick="focusRunFromHistory('${tabKey}','${esc(rid)}')"><div class="rs-dot" aria-hidden="true">${esc(glyph)}</div><div class="rs-model">${esc(n.model)}</div><div class="rs-task">${taskName}${famChip}${eligibilityTag}${reason}</div><div class="rs-bar"><div class="rs-fill" style="width:${n.overall}%"></div></div><div class="rs-score">${n.overall}%</div><div class="rs-badge badge ${cls} ${originCls}">${esc(word)}</div></button>`;
  };
  const filterBar=['all','pass','fail','nc','model','infra','testjudge'].map((key)=>`<button class="filter-chip ${filter===key?'on':''}" onclick="setArchiveFilter('${tabKey}','${key}')">${archiveFilterLabel(key)}</button>`).join('');
  const moreCount=filtered.length-visible.length;
  const toggle=filtered.length>6?`<button class="button secondary full archive-toggle" onclick="toggleArchive('${tabKey}')">${expanded?`▲ COLLAPSE (${filtered.length} RUNS)`:`▼ SHOW ALL (${moreCount} MORE)`}</button>`:'';
  // Archive scope header — states the scope + filtered-count so the user
  // knows "20 of 34 runs, filtered to MODEL FAIL, within Build lane".
  const scopeHeader=`<div class="archive-scope-header" data-scope-kind="${scope.kind}"><span class="chip dim scope-chip" data-scope-kind="${scope.kind}" title="${esc(scope.familiesLabel)}">SCOPE · ${esc(scope.scopeLabel)}</span><span class="archive-scope-meta">${filtered.length} of ${runs.length} run${runs.length===1?'':'s'}${filter==='all'?'':' · filter '+esc(archiveFilterLabel(filter))}</span></div>`;
  return`<div class="archive-shell">
    ${scopeHeader}
    <div class="filter-chips">${filterBar}</div>
    ${renderScoreDistribution(tabKey,filtered.map((x)=>x.n))}
    <div class="run-strips">${visible.map(stripRow).join('')}</div>
    ${toggle}
  </div>`;
}

function allRuns(){
  const dashboardRuns=state.tabData.dashboard?.runs;
  if(Array.isArray(dashboardRuns)&&dashboardRuns.length){
    return dashboardRuns.slice().sort((a,b)=>new Date(b.timestamp||0).getTime()-new Date(a.timestamp||0).getTime());
  }
  const byId=new Map();
  for(const key of Object.keys(TAB_CONFIG)){
    if(key==='dashboard'||TAB_CONFIG[key]?.isSettings)continue;
    for(const run of state.tabData[key]?.runs||[]){
      const id=String(run.bundle_id||run.run_id||run.id||'');
      if(id&&!byId.has(id))byId.set(id,run);
    }
  }
  return Array.from(byId.values()).sort((a,b)=>new Date(b.timestamp||0).getTime()-new Date(a.timestamp||0).getTime());
}
function dashboardStats(){const runs=allRuns();const totalRuns=runs.length;const passCount=runs.filter((run)=>run.pass).length;const avgScore=totalRuns?runs.reduce((sum,run)=>sum+scorePct(run.score||0),0)/totalRuns:0;const avgTime=totalRuns?runs.reduce((sum,run)=>sum+Number(run.duration_ms||run.elapsed_ms||0),0)/totalRuns:0;return{totalRuns,passRate:totalRuns?(passCount/totalRuns)*100:0,avgScore,avgTime}}
function recentRunCards(){return allRuns().slice(0,8).map((run)=>normalizeRunForDisplay(run))}
function topCategoriesFromRecent(){
  const counts=new Map();
  for(const run of recentRunCards()){
    for(const category of run.categories){
      const existing=counts.get(category.name)||{name:category.name,description:category.explanation,total:0,count:0};
      existing.total+=category.score;
      existing.count+=1;
      counts.set(category.name,existing);
    }
  }
  return Array.from(counts.values()).sort((a,b)=>(b.total/b.count)-(a.total/a.count)).slice(0,4).map((entry)=>({...entry,score:Math.round(entry.total/entry.count)}));
}

function visionResultByTaskId(taskId){
  const data=state.visionSmoke&&state.visionSmoke.data;
  const report=data&&data.report;
  const results=(report&&Array.isArray(report.results))?report.results:[];
  return results.find((r)=>r&&r.taskId===taskId)||null;
}
function visionCardClassFor(result){
  if(!result)return'idle';
  const c=String(result.classification||'').toUpperCase();
  if(c==='PASS')return'pass';
  if(c.startsWith('SKIP'))return'skip';
  if(c==='LOW_SCORE'||c.startsWith('FAIL'))return'fail';
  if(c==='NEEDS_REVIEW')return'warn';
  return'idle';
}
function visionCardBadgeWord(result){
  if(!result)return'IDLE';
  const c=String(result.classification||'').toUpperCase();
  if(c==='PASS')return'PASS';
  if(c==='LOW_SCORE')return'FAIL';
  if(c==='NEEDS_REVIEW')return'REVIEW';
  if(c.startsWith('SKIPPED_'))return'SKIPPED';
  if(c.startsWith('FAIL_'))return'FAIL';
  return c||'IDLE';
}
function visionSelectedModelCapabilityHint(tabKey){
  // Surface a single, plain-English capability line for the operator-
  // selected model. The hint never says "failed Vision" — text-only or
  // transport-unsupported models will be SKIPPED, not FAILED.
  const tabState=state.tabData[tabKey]||defaultTabState();
  const selected=(tabState.selectedModels||[]);
  if(!selected.length)return{cls:'idle',headline:'No model selected',sub:'Pick a vision-capable model to run the Vision POC. Text-only models will be SKIPPED, not FAILED.'};
  const id=selected[0];
  let entry=null;let providerId=null;
  for(const m of (MODEL_CERTIFICATION.models||[])){
    if(m.modelId===id){entry=m;providerId=m.providerId;break;}
  }
  if(!entry){
    return{cls:'idle',headline:`Selected: ${id}`,sub:'Model is not in the certification registry; capability flags unknown. Run will be SKIPPED if Vision capability is missing.'};
  }
  const caps=entry.capabilities||{};
  const transport=(MODEL_CERTIFICATION.adapterImageTransport||{})[providerId]||{supports:false};
  if(caps.supportsVision!==true||caps.supportsImageInput!==true){
    return{cls:'skip',headline:`${id} — text-only`,sub:'Will SKIP: unsupported multimodal (model does not declare supportsVision + supportsImageInput). Not a Vision failure — Vision is skipped.'};
  }
  if(!transport||transport.supports!==true){
    return{cls:'skip',headline:`${id} — image transport unsupported`,sub:`Will SKIP: ${providerId} adapter does not implement an image transport. Not a Vision failure — Vision is skipped.`};
  }
  return{cls:'pass',headline:`${id} — vision-capable route`,sub:`Provider ${providerId} via ${transport.transport}. Vision POC will run. Experimental, not ranked, not certified.`};
}

// Phase 4 helpers — extract concise interpretation tags from a scorer
// reason string. These are presentational only; canonical severity/
// context lives in the reason text emitted by the scorer.
function roleplaySeverityFromReason(reason){
  if(!reason)return null;
  const m=String(reason).match(/\[SEVERITY=([A-Z]+)\s+([a-z]+)\]/);
  return m?`${m[1]} ${m[2]}`:null;
}
function roleplayContextFromReason(reason){
  if(!reason)return null;
  const m=String(reason).match(/\[CONTEXT=([A-Z_]+)\]/);
  return m?m[1]:null;
}
function roleplayResultByTaskId(taskId){
  const data=state.roleplaySmoke&&state.roleplaySmoke.data;
  const report=data&&data.report;
  const results=(report&&Array.isArray(report.results))?report.results:[];
  return results.find((r)=>r&&r.taskId===taskId)||null;
}
function roleplayCardClassFor(result){
  if(!result)return'idle';
  const c=String(result.classification||'').toUpperCase();
  if(c==='PASS')return'pass';
  if(c.startsWith('SKIP'))return'skip';
  if(c==='NEEDS_REVIEW')return'warn';
  if(c==='LOW_SCORE'||c.startsWith('FAIL_'))return'fail';
  return'idle';
}
function roleplayCardBadgeWord(result){
  if(!result)return'IDLE';
  const c=String(result.classification||'').toUpperCase();
  if(c==='PASS')return'PASS';
  if(c==='LOW_SCORE')return'FAIL';
  if(c==='NEEDS_REVIEW')return'REVIEW';
  if(c.startsWith('SKIPPED_'))return'SKIPPED';
  if(c.startsWith('FAIL_'))return'FAIL';
  return c||'IDLE';
}

function renderLane(tabKey){
  const tab=TAB_CONFIG[tabKey];
  const tabState=state.tabData[tab.key]||defaultTabState();
  const stats=tabState.stats||{};
  const modelCount=(tabState.selectedModels||[]).length;
  const overview=reviewSummary(tab.key);

  // Lane vitals — surface the verdict metrics the backend already computes
  // per task_families scope (pass_rate, model_failure_rate, nc_rate,
  // infra_issue_rate). Without these, the user cannot see that scope is
  // actually being applied; previously only PASS/AVG/RUNS/COST rendered and
  // NC + infra + model-fail were invisible, which is what made scope leaks
  // hard to detect.
  const modelFail=Math.round(Number(stats.model_failure_rate||0));
  const ncRate=Math.round(Number(stats.nc_rate||0));
  const infraRate=Math.round(Number(stats.infra_issue_rate||0));
  const armedCount=(tabState.selectedModels||[]).length;

    {label:'ACCURACY',value:String(scorePct(stats.pass_rate)),unit:'%',barWidth:scorePct(stats.pass_rate),cls:'teal',tip:friendlyTip('pass_rate')},

    {label:'COST PER TEST',value:fmtMoney(Number(stats.total_cost_usd||0)/((stats.total_runs||1))).replace('$',''),unit:'USD',barWidth:Math.min(100,(Number(stats.total_cost_usd||0)*100)),tip:friendlyTip('cost_per_task')}

// ─── Registry (providers/models) — UI state + actions ─────────────────────
async function loadRegistry(){
  try{
    const body=await fetchJSON('/api/registry/state');
    state.registry={
      presets:Array.isArray(body.presets)?body.presets:[],
      providers:Array.isArray(body.providers)?body.providers:[],
      models:Array.isArray(body.models)?body.models:[],
      catalog:Array.isArray(body.catalog)?body.catalog:[]
    };
  }catch(err){
    console.warn('Failed to load registry',err);
  }
}
async function registryAddProvider(presetId){
  const preset=(state.registry.presets||[]).find(p=>p.id===presetId);
  if(!preset)return;
  const label=prompt(`Label for ${preset.label}:`,preset.label);
  if(label===null)return;
  let apiKey=null;
  let apiKeyEnv=preset.envKey;
  if(preset.envKey){
    const entered=prompt(`Paste API key for ${preset.label}.\n\nLeave blank to use ${preset.envKey} from the server environment.`);
    if(entered===null)return;
    apiKey=entered.trim()||null;
    apiKeyEnv=apiKey?null:preset.envKey;
  }
  try{
    await fetchJSON('/api/registry/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({presetId,label,apiKey,apiKeyEnv})});
    await loadRegistry();render();
  }catch(err){alert(`Could not add provider: ${err.message||err}`)}
}
async function registrySetProviderKey(providerId){
  const provider=(state.registry.providers||[]).find(p=>p.id===providerId);
  if(!provider)return;
  const entered=prompt(`Paste API key for ${provider.label}.\n\nIt will be stored inline and masked in the UI.`);
  if(entered===null)return;
  const apiKey=entered.trim();
  if(!apiKey){alert('No key entered.');return}
  try{
    await fetchJSON(`/api/registry/providers/${encodeURIComponent(providerId)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey,apiKeyEnv:null})});
    await loadRegistry();render();
  }catch(err){alert(`Could not save key: ${err.message||err}`)}
}
async function registryUseProviderEnv(providerId){
  const provider=(state.registry.providers||[]).find(p=>p.id===providerId);
  const preset=(state.registry.presets||[]).find(p=>p.id===provider?.presetId);
  if(!provider||!preset?.envKey)return;
  try{
    await fetchJSON(`/api/registry/providers/${encodeURIComponent(providerId)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:null,apiKeyEnv:preset.envKey})});
    await loadRegistry();render();
  }catch(err){alert(`Could not switch to env key: ${err.message||err}`)}
}
async function registryRemoveProvider(providerId){
  if(!confirm('Remove this provider? Its registered models will also be removed. Existing bundle history remains intact.'))return;
  try{
    await fetchJSON(`/api/registry/providers/${encodeURIComponent(providerId)}`,{method:'DELETE'});
    await loadRegistry();render();
  }catch(err){alert(`Could not remove provider: ${err.message||err}`)}
}
async function registryToggleProvider(providerId,enabled){
  try{
    await fetchJSON(`/api/registry/providers/${encodeURIComponent(providerId)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});
    await loadRegistry();render();
  }catch(err){alert(`Could not update: ${err.message||err}`)}

async function registryTestProvider(providerId){

async function registryBulkSubmit(providerId){

function registryProviderCostTotal(providerId){
  // Sum `cost_usd` across run history rows whose adapter/model match any
  // model registered under this provider. Gives the card a simple, honest
  // "lifetime spend for this provider" figure — blank when unknown.
  const runs=allRuns();
  const models=new Set((state.registry.models||[]).filter(m=>m.providerConfigId===providerId).map(m=>m.modelId.toLowerCase()));
  let total=0,reported=false;
  for(const run of runs){
    const mid=String(run.model||'').toLowerCase();
    if(!models.has(mid))continue;
    const c=Number(run.cost_usd);
    if(Number.isFinite(c)&&c>0){total+=c;reported=true}
  }
  return reported?total:null;
}

// ─── Luna-style command deck composition ─────────────────────────────
// Each tab is presented as an "Evaluation Room" in the left rail. The
// active tab's body is mounted into the center Active Arena (a deck
// window wrapping the existing renderActiveTab() output). The right
// rail surfaces Failure Board / Provider Bay / Evidence Vault / Release
// Gate. The bottom rail (Evidence Feed) shows recent trials.
//
// All existing render helpers (renderHero, renderTabs, renderActiveTab,
// renderProvidersView, renderLane, renderDashboard) remain callable and
// keep their existing markup so the existing test contract holds.

function roomStatusForTab(tabKey){
  // Returns {state, passRate, runCount, certification} for an evaluation
  // room. state ∈ pass|warn|fail|empty so the room card can show the
  // operator the lane's last-known health at a glance.
  const tab=TAB_CONFIG[tabKey];
  if(!tab)return{state:'empty',passRate:null,runCount:0,kind:'lane'};
  if(tab.isSettings)return{state:'settings',passRate:null,runCount:0,kind:'settings'};
  const tabState=state.tabData[tabKey]||defaultTabState();
  const runs=tabState.runs||[];
  const stats=tabState.stats||{};
  const runCount=runs.length||Number(stats.total_runs||0);
  const passRate=Number(stats.pass_rate||0);
  let st='empty';
  if(runCount>0){
    if(passRate>=80)st='pass';
    else if(passRate>=55)st='warn';
    else st='fail';
  }
  return{state:st,passRate:runCount>0?Math.round(passRate):null,runCount,kind:'lane'};
}

function renderEvaluationRoomsDeck(){
  // Left-rail navigator. Each room is a clickable card with name,
  // pass/fail dot, run count, and a small pill (pass% or "SETTINGS").
  // Replaces the centered .tabbar list — the operator sees rooms as
  // discrete decks instead of a tab row.
  const items=Object.values(TAB_CONFIG).map((tab)=>{
    const meta=roomStatusForTab(tab.key);
    const isActive=state.activeTab===tab.key;
    const isSettings=meta.kind==='settings';
    const isExperimental=tab.experimental===true;
    const pillCls=meta.state==='pass'?'pass':meta.state==='fail'?'fail':meta.state==='warn'?'warn':'';
    const pill=isSettings
      ? `<span class="room-pill">Settings</span>`
      : isExperimental
        ? `<span class="room-pill exp" title="Experimental scaffold — not release-certified. See docs/${tab.key==='roleplay'?'ROLEPLAY':'MULTIMODAL_VISION'}_TEST_SUITE.md">EXP</span>`
        : (meta.runCount>0
            ? `<span class="room-pill ${pillCls}">${meta.passRate}%</span>`
            : `<span class="room-pill">Idle</span>`);
    const passCount=meta.passRate!=null?Math.round((meta.passRate/100)*meta.runCount):0;
    const failCount=Math.max(0,meta.runCount-passCount);
    const capabilityNote=tab.requiresCapability==='supportsVision'
      ? ' · requires image-capable model'
      : tab.requiresCapability==='supportsRoleplay'
        ? ' · text-capable'
        : '';
    const metaLine=isSettings
      ? 'Provider registry'
      : isExperimental
        ? `Experimental${capabilityNote}`
        : (meta.runCount>0
            ? `<span class="pass-num">${passCount}</span>/<span class="fail-num">${failCount}</span> · ${meta.runCount} trial${meta.runCount===1?'':'s'}`
            : 'No trials yet');
    const cls=['room-card',isActive?'active':'',isSettings?'settings':isExperimental?'experimental':meta.state].filter(Boolean).join(' ');
    return`<button type="button" class="${cls}" onclick="setActiveTab('${esc(tab.key)}')" aria-pressed="${isActive?'true':'false'}" aria-label="Open ${esc(tab.label)} room${isExperimental?' (experimental)':''}">
      <span class="room-dot" aria-hidden="true"></span>
      <span class="room-body">
        <span class="room-name">${esc(tab.label)}</span>
        <span class="room-meta">${metaLine}</span>
      </span>
      ${pill}
    </button>`;
  }).join('');
  return`<section class="deck-window rooms-deck" aria-label="Evaluation Rooms">
    <header class="deck-header">
      <span class="deck-socket violet" aria-hidden="true"></span>
      <h2 class="deck-title-plate violet">Evaluation Rooms</h2>
      <span class="deck-socket cyan" aria-hidden="true"></span>
    </header>
    <div class="rooms-list" role="navigation" aria-label="Evaluation room navigation">${items}</div>
    <div class="rooms-deck-foot"><span>Click a room to open the Active Arena</span></div>
  </section>`;
}

function failureBoardCounts(tabKey){
  // Counts failures by origin for the right-rail Failure Board.
  // Product = MODEL, Provider/Config = INFRA, Skip = TEST/JUDGE NC,
  // Clean = passing trials.
  const runs=(tabKey==='dashboard')?allRuns():(state.tabData[tabKey]?.runs||[]);
  let product=0,provider=0,config=0,info=0,clean=0;
  for(const run of runs){
    const n=normalizeRunForDisplay(run);
    if(n.completionState==='PASS'){clean++;continue}
    if(n.completionState==='FAIL'&&n.failureOrigin==='MODEL'){product++;continue}
    if(n.completionState==='NC'&&['PROVIDER','NETWORK','HARNESS','UNKNOWN'].includes(n.failureOrigin||'')){
      if(n.failureOrigin==='PROVIDER')provider++;
      else config++;
      continue;
    }
    if(n.completionState==='NC'&&['TEST','JUDGE'].includes(n.failureOrigin||'')){info++;continue}
    config++;
  }
  return{product,provider,config,info,clean,total:runs.length};
}

function renderFailureBoardDeck(){

function selectedProviderModelSummary(tabKey){
  // Pulls the first armed model from the current tab's selection so the
  // Provider Bay shows the operator what they're about to run. The
  // certification label uses MODEL_CERTIFICATION which has 5 tiers,
  // not just CERTIFIED/UNCERTIFIED. Provider-tested models get a
  // softer label than the harsh "Uncertified visible" copy.
  const tabState=state.tabData[tabKey]||defaultTabState();
  const modelIds=tabState.selectedModels||[];
  if(!modelIds.length)return{label:'No model armed',providerLabel:'—',certLabel:'Idle',certCls:'',certTier:'UNKNOWN',certWarning:''};
  const first=String(modelIds[0]);
  const [providerId,...modelParts]=first.split(':');
  const modelId=modelParts.join(':');
  const groups=mergedModelGroups();
  const group=groups.find((g)=>g.providerId===providerId)||{label:providerId,providerId};
  const meta=modelCertificationMeta(providerId,modelId);
  // Keep the canonical certCls back-compat (teal for certified, warn otherwise)
  // so the cmd-rail chip cls argument still works.
  const certCls=meta.tier==='RELEASE_CERTIFIED'?'teal':meta.tier==='PROVIDER_TESTED'?'cyan':meta.tier==='BLOCKED_CONFIG'?'red':'warn';
  return{
    label:modelId||first,
    providerLabel:group.label||providerId,
    certLabel:meta.label,
    certCls,
    certTier:meta.tier,
    certWarning:meta.warning
  };
}

function providerHealthMini(){
  // Compact health snapshot used by the Provider Bay.
  const h=state.health||{};
  const providers=Object.values(h.providers||{});
  const cloud=providers.filter((p)=>p.kind==='cloud');
  const cloudOk=cloud.filter((p)=>p.status==='ok').length;
  const cloudDown=cloud.filter((p)=>p.status==='down').length;
  const local=providers.filter((p)=>p.kind==='local');
  const localOk=local.filter((p)=>p.status==='ok').length;
  return{cloudOk,cloudDown,cloudTotal:cloud.length,localOk,localTotal:local.length,summary:h.summary||'unknown'};
}

function renderChampionStrip(tabKey){
  // Compact 3-up champion strip used as the HEADER of the real
  // leaderboard zone (NOT as a separate teaser). Top 3 models from
  // aggregateLeaderboard with crown styling on #1. The full leaderboard
  // rows render immediately below this strip in the same deck-window.
  const scope=laneScopeDescriptor(tabKey);
  const top=aggregateLeaderboard(tabKey,3);
  const sampleSize=scope.sampleSize||0;
  const settingsView=tabKey==='providers';
  if(!top.length){
    return`<div class="rank-empty">${settingsView?'Provider registry · no rankings on this tab':sampleSize===0?'No trials recorded yet · arm a model and start a trial to populate the leaderboard':'No ranked models yet for this lane'}</div>`;
  }
  return top.map((entry,index)=>{
    const score=Math.round(Number(entry.score||0));
    const cls=score>=80?'pass':score>=55?'warn':'fail';
    const rank=index+1;
    const tooFew=Number(entry.runs||0)<LEADERBOARD_MIN_N_UI;
    return`<button type="button" class="rank-card ${cls} ${rank===1?'champion':''}" onclick="focusModelDrilldown('${esc(tabKey)}','${esc(entry.model)}')" aria-label="Open ${esc(entry.model)} drilldown">
      <span class="rank-num">#${rank}</span>
      <span class="rank-body">
        <span class="rank-model" title="${esc(entry.model)}">${esc(entry.model)}</span>
        <span class="rank-sub">${esc(entry.runs||0)} trial${(entry.runs||0)===1?'':'s'}${entry.provider?' · '+esc(String(entry.provider).slice(0,16)):''}${tooFew?' · n='+entry.runs:''}</span>
      </span>
      <span class="rank-score">${score}<span class="rank-unit">%</span></span>
    </button>`;
  }).join('');
}

function renderRealLeaderboardZone(){
  // TOP-OF-PAGE FULL LEADERBOARD. This is not a teaser — the full
  // ranked-results table (with Simple/Table/Chart toggle, scope chip,
  // JSON/CSV export, and click-through model drilldown) lives here at
  // the top of the page, above the run controls. The compact 3-up
  // champion strip sits as a header above the ranked rows inside the
  // same deck-window — there is no duplicate teaser elsewhere.
  const tabKey=state.activeTab;
  const scope=laneScopeDescriptor(tabKey);
  const sampleSize=scope.sampleSize||0;
  const provisional=scope.provisional;
  const champion=aggregateLeaderboard(tabKey,1)[0]||null;
  const settingsView=tabKey==='providers';
  const provisionalChip=provisional
    ? `<span class="chip amber hot" title="Fewer than ${LEADERBOARD_MIN_N_UI} runs in scope — rankings are provisional.">PROVISIONAL · n=${sampleSize}</span>`
    : '';
  // The full ranked-results component (toggles + table/chart/simple +
  // export + drilldown). For providers tab we skip — no leaderboard.
  const body=settingsView?'':renderRankedResults(tabKey);
  return`<section class="deck-window full-leaderboard-zone" aria-label="Model Leaderboard">
    <header class="deck-header">
      <span class="deck-socket cyan" aria-hidden="true"></span>
      <h2 class="deck-title-plate">Model Leaderboard</h2>
      <span class="deck-subtitle">${esc(scope.scopeLabel)}</span>
      <span class="deck-subtitle">${sampleSize} trial${sampleSize===1?'':'s'} in scope</span>
      ${champion?`<span class="rank-crown" title="Current champion in ${esc(scope.scopeLabel)}">★ ${esc(String(champion.model).slice(0,28))} · ${Math.round(Number(champion.score||0))}%</span>`:''}
      ${provisionalChip}
    </header>
    <div class="champion-strip">
      <div class="rank-cards">${renderChampionStrip(tabKey)}</div>
    </div>
    ${body?`<div class="full-leaderboard-body">${body}</div>`:''}
  </section>`;
}

function renderArenaHeaderStrip(){
  // Compact per-tab header strip — lane / trust score / pass / scope /
  // selected model + certification. Replaces the giant in-arena
  // .abyss-banner (which is CSS-hidden inside the arena) so the operator
  // sees lane state immediately without a tall hero card pushing the
  // operational content below the fold.
  const tab=TAB_CONFIG[state.activeTab]||TAB_CONFIG.dashboard;
  const stats=statsForTab(state.activeTab);
  const best=aggregateLeaderboard(state.activeTab,1)[0];
  const score=best?Math.round(best.score||stats.avgScore||0):Math.round(stats.avgScore||0);
  const passRate=Math.round(stats.passRate||0);
  const totalRuns=stats.totalRuns||0;
  const scope=laneScopeDescriptor(state.activeTab);
  const sel=selectedProviderModelSummary(state.activeTab);
  return`<div class="arena-header-strip" role="region" aria-label="Arena header">
    <div class="arena-hs-title">
      <span class="arena-hs-eyebrow">${esc(scope.tabLabel)}</span>
      <span class="arena-hs-name">${esc(tab.laneTitle||tab.label)}</span>
    </div>
    <span class="arena-hs-score"><b>${score||'—'}</b>trust</span>
    <span class="arena-hs-score"><b>${passRate}%</b>pass · ${totalRuns} runs</span>
    <div class="arena-hs-chips">
      <span class="chip ${sel.certCls==='teal'?'teal':'amber'}" title="${esc(sel.certLabel)}">${esc(sel.certLabel)}</span>
      <span class="chip cyan" title="Selected model">${esc(sel.label.slice(0,24))}</span>
      <span class="chip violet" title="Selected provider">${esc(sel.providerLabel)}</span>
    </div>
  </div>`;
}

// ── Registry lookups ───────────────────────────────────────────────────
function pehRealm(id){return REALM_REGISTRY.find((r)=>r.id===id)||null}
function pehPublicRealms(){return REALM_REGISTRY.filter((r)=>r.status==='public').sort((a,b)=>a.order-b.order)}
function pehFutureRealms(){return REALM_REGISTRY.filter((r)=>r.status==='future').sort((a,b)=>a.order-b.order)}
function pehScenes(realmId){return SCENE_REGISTRY[realmId]||[]}
function pehScene(realmId,sceneId){return pehScenes(realmId).find((s)=>s.id===sceneId)||null}
function pehCurrentRealm(){
  const r=pehRealm(state.pehverse.realm);
  // Never strand the shell on a missing/private realm — fall back to Luak.
  return (r&&r.status==='public')?r:pehRealm('luak');
}
function pehCurrentScene(){
  const r=pehCurrentRealm(); if(!r)return null;
  const sid=state.pehverse.scene||r.defaultScene;
  return pehScene(r.id,sid)||pehScenes(r.id)[0]||null;
}
function pehWorkspaceDef(defId){return WORKSPACE_REGISTRY[defId]||null}

// ── Navigation (Fast Travel + scene waypoints + mode) ──────────────────
function pehTravel(realmId,sceneId){
  const r=pehRealm(realmId);
  if(!r||r.status!=='public')return; // future/private realms are not travelable yet
  state.pehverse.realm=r.id;
  state.pehverse.scene=sceneId||r.defaultScene||(pehScenes(r.id)[0]&&pehScenes(r.id)[0].id)||null;
  state.pehverse.fastTravel=false;
  localStorage.setItem('pehverse-realm',state.pehverse.realm);
  if(state.pehverse.scene)localStorage.setItem('pehverse-scene',state.pehverse.scene);
  render();
}
function pehSetScene(sceneId){
  state.pehverse.scene=sceneId;
  localStorage.setItem('pehverse-scene',sceneId);
  render();
}
function pehSetMode(mode){
  if(mode!=='immersive'&&mode!=='dashboard')return;
  state.pehverse.mode=mode;
  localStorage.setItem('pehverse-mode',mode);
  render();
}
function pehToggleMode(){pehSetMode(state.pehverse.mode==='immersive'?'dashboard':'immersive')}
function pehToggleFastTravel(force){
  state.pehverse.fastTravel=(typeof force==='boolean')?force:!state.pehverse.fastTravel;
  render();
}

// ── WorkspaceManager: open/close/dock/focus/minimize ───────────────────
function pehOpenWorkspace(defId,opts){
  const def=pehWorkspaceDef(defId); if(!def)return;
  let ws=state.pehverse.workspaces.find((w)=>w.defId===defId); // de-dupe
  if(!ws){
    ws={uid:'ws'+(++state.pehverse.wsSeq),defId,dock:(opts&&opts.dock)||def.dock||'right',min:false};
    state.pehverse.workspaces.push(ws);
  }
  ws.min=false;
  pehFocusWorkspace(ws.uid,true);
  render();
}
// Hotspot click: optionally travel to a sub-scene, then open the workspace.
function pehHotspot(defId,sceneId){
  if(sceneId){state.pehverse.scene=sceneId;localStorage.setItem('pehverse-scene',sceneId)}
  pehOpenWorkspace(defId);
}
function pehFocusWorkspace(uid,skipRender){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid);
  if(!ws){if(!skipRender)render();return}
  state.pehverse.focus=uid;
  // A focused lane workspace owns state.activeTab so the wrapped lane's
  // own onclick handlers (run, drilldown, export) operate on the right
  // lane. Only the focused lane is fully interactive; others snapshot.
  const def=pehWorkspaceDef(ws.defId);
  if(def&&def.kind==='lane'&&def.tab)state.activeTab=def.tab;
  // Move focused workspace to the end of the stack (top of z-order).
  state.pehverse.workspaces=state.pehverse.workspaces.filter((w)=>w.uid!==uid).concat(ws);
  if(!skipRender)render();
}
function pehCloseWorkspace(uid){
  state.pehverse.workspaces=state.pehverse.workspaces.filter((w)=>w.uid!==uid);
  if(state.pehverse.focus===uid){
    const stack=state.pehverse.workspaces;
    state.pehverse.focus=stack.length?stack[stack.length-1].uid:null;
  }
  render();
}
function pehDockWorkspace(uid,dock){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid); if(!ws)return;
  ws.dock=dock; ws.min=false; pehFocusWorkspace(uid,true); render();
}
function pehMinimizeWorkspace(uid){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid); if(!ws)return;
  ws.min=!ws.min; render();
}
function pehCloseAllWorkspaces(){
  state.pehverse.workspaces=[]; state.pehverse.focus=null; render();
}

// open workspaces docking over the scene (or as mobile bottom sheets).
function renderPehImmersive(realm,scene,deckMarkup){
  return `<div class="peh-scene" data-scene="${scene?scene.id:''}">
    <div class="peh-scene-atmos" aria-hidden="true"></div>
    <div class="peh-scene-caption">
      <span class="peh-scene-realm">${esc(realm.displayName)} · ${esc(realm.tagline)}</span>
      <h1 class="peh-scene-title">${esc(scene?scene.title:realm.displayName)}</h1>
      <p class="peh-scene-desc">${esc(scene?scene.desc:realm.blurb)}</p>
    </div>
    ${renderHotspotLayer(scene)}
    ${renderPehWaypoints(realm,scene)}
    ${renderWorkspaceOverlays(deckMarkup)}
  </div>`;
}

// Dashboard: workspace-first. Thin scene strip on top, open workspaces tile
// in a grid. When nothing is open, show a chooser of this realm's spaces.
function renderPehDashboard(realm,scene,deckMarkup){
  const open=state.pehverse.workspaces;
  const grid=open.length
    ? open.map((w)=>renderWorkspaceTile(w,deckMarkup)).join('')
    : pehWorkspaceChooser(realm);
  return `<div class="peh-dash">
    <div class="peh-dash-head">
      <div class="peh-dash-here"><span class="peh-scene-realm">${esc(realm.displayName)}</span><h1>${esc(scene?scene.title:realm.displayName)}</h1><p>${esc(scene?scene.desc:realm.blurb)}</p></div>
      ${renderPehWaypoints(realm,scene)}
    </div>
    <div class="peh-grid ${open.length>1?'multi':''}">${grid}</div>
  </div>`;
}

// ── HotspotLayer ───────────────────────────────────────────────────────
function renderHotspotLayer(scene){
  if(!scene||!scene.hotspots||!scene.hotspots.length)return'';
  return `<div class="peh-hotspots" aria-label="${esc(scene.title)} hotspots">${scene.hotspots.map((h)=>{
    const action=h.workspace
      ? `pehHotspot('${h.workspace}'${h.scene?`,'${h.scene}'`:''})`
      : (h.scene?`pehSetScene('${h.scene}')`:'');
    const kind=h.workspace?(pehWorkspaceDef(h.workspace)||{}).kind:'travel';
    return `<button class="peh-hotspot" type="button" style="left:${h.x}%;top:${h.y}%" title="${esc(h.label)}" aria-label="${esc(h.label)}" onclick="${action}">
      <span class="peh-pin" aria-hidden="true"></span>
      <span class="peh-hotspot-label">${esc(h.label)}${kind==='lane'?'<i class="peh-dot-live"></i>':''}</span>
    </button>`;
  }).join('')}</div>`;
}

// Scene-to-scene waypoints (fast intra-realm hops; Fast Travel still jumps
// across realms). Hidden when a realm has fewer than two scenes.
function renderPehWaypoints(realm,scene){
  const scenes=pehScenes(realm.id);
  if(scenes.length<2)return'';
  return `<nav class="peh-waypoints" aria-label="${esc(realm.displayName)} scenes">${scenes.map((s)=>`<button type="button" class="peh-waypoint ${scene&&s.id===scene.id?'active':''}" aria-current="${scene&&s.id===scene.id?'true':'false'}" onclick="pehSetScene('${s.id}')">${esc(s.title)}</button>`).join('')}</nav>`;
}

// ── WorkspaceManager: panel + tile + body renderers ────────────────────
// Immersive mode docks exactly ONE workspace over the scene — the focused
// one — and uses the taskbar as the switcher. This deliberately avoids
// overlapping-window chaos; dashboard mode is where ALL open workspaces
// tile together. Multiple workspaces stay open either way (see taskbar).
function renderWorkspaceOverlays(deckMarkup){
  const open=state.pehverse.workspaces;
  if(!open.length)return'';
  let ws=open.find((w)=>w.uid===state.pehverse.focus)||open[open.length-1];
  if(ws.min)return''; // minimized → scene is unobstructed; chip stays in taskbar
  return `<div class="peh-overlays">${renderWorkspacePanel(ws,deckMarkup)}</div>`;
}
function renderWorkspacePanel(w,deckMarkup){
  const def=pehWorkspaceDef(w.defId)||{};
  const focused=state.pehverse.focus===w.uid;
  return `<section class="peh-panel dock-${w.dock} ${focused?'focused':''} ${w.min?'min':''}" data-uid="${w.uid}" onmousedown="pehFocusWorkspace('${w.uid}')" aria-label="${esc(def.title||w.defId)} workspace">
    ${renderWorkspaceHeader(w,def,false)}
    <div class="peh-panel-body">${w.min?'':pehWorkspaceBody(w,deckMarkup)}</div>
  </section>`;
}
function renderWorkspaceTile(w,deckMarkup){
  const def=pehWorkspaceDef(w.defId)||{};
  return `<section class="peh-tile ${state.pehverse.focus===w.uid?'focused':''}" data-uid="${w.uid}" onmousedown="pehFocusWorkspace('${w.uid}')" aria-label="${esc(def.title||w.defId)} workspace">
    ${renderWorkspaceHeader(w,def,true)}
    <div class="peh-panel-body">${pehWorkspaceBody(w,deckMarkup)}</div>
  </section>`;
}
function renderWorkspaceHeader(w,def,isTile){
  const kindTag=def.kind==='lane'?'LIVE':def.kind==='deck'?'CONSOLE':'PLACEHOLDER';
  const dockBtn=(d,glyph,label)=>`<button class="peh-dockbtn ${w.dock===d?'on':''}" type="button" title="Dock ${label}" aria-label="Dock ${label}" onclick="event.stopPropagation();pehDockWorkspace('${w.uid}','${d}')">${glyph}</button>`;
  return `<header class="peh-panel-head">
    <span class="peh-panel-glyph">${pehGlyph(def.peh)}</span>
    <span class="peh-panel-title">${esc(def.title||w.defId)}</span>
    <span class="peh-panel-kind k-${kindTag.toLowerCase()}">${kindTag}</span>
    <span class="peh-panel-ctrls">
      ${isTile?'':dockBtn('right','⫼','right')+dockBtn('bottom','▭','bottom')+dockBtn('fullscreen','⛶','full')}
      <button class="peh-dockbtn" type="button" title="Minimize" aria-label="Minimize" onclick="event.stopPropagation();pehMinimizeWorkspace('${w.uid}')">—</button>
      <button class="peh-dockbtn close" type="button" title="Close" aria-label="Close" onclick="event.stopPropagation();pehCloseWorkspace('${w.uid}')">×</button>
    </span>
  </header>`;
}
function pehWorkspaceBody(w,deckMarkup){
  const def=pehWorkspaceDef(w.defId); if(!def)return'';
  if(def.kind==='deck')return `<div class="peh-deck-wrap">${deckMarkup}</div>`;
  if(def.kind==='lane'){
    const prev=state.activeTab;
    state.activeTab=def.tab;
    let body='';
    try{body=def.tab==='dashboard'?renderDashboard():def.tab==='providers'?renderProvidersView():renderLane(def.tab)}
    catch(err){body=`<div class="peh-ph"><p class="peh-ph-blurb">Could not render the ${esc(String(def.tab))} lane: ${esc(String(err&&err.message||err))}</p></div>`}
    finally{state.activeTab=prev}
    return `<div class="peh-lane-wrap">${body}</div>`;
  }
  return pehPlaceholderBody(def);
}
function pehPlaceholderBody(def){
  return `<div class="peh-ph">
    <div class="peh-ph-glyph">${pehGlyph(def.peh)}</div>
    <p class="peh-ph-blurb">${esc(def.blurb||'Workspace placeholder.')}</p>
    ${def.relatedTab?`<button class="button secondary" type="button" onclick="pehOpenRelatedLane('${def.relatedTab}')">Open ${esc(TAB_CONFIG[def.relatedTab]?TAB_CONFIG[def.relatedTab].label:def.relatedTab)} console</button>`:''}
    <div class="peh-ph-tag">PLACEHOLDER · atmospheric</div>
  </div>`;
}

// Dashboard chooser — shown when no workspace is open. Cards for every
// space registered to the current realm.
function pehWorkspaceChooser(realm){
  const defs=Object.keys(WORKSPACE_REGISTRY).filter((id)=>WORKSPACE_REGISTRY[id].realm===realm.id);
  return `<div class="peh-chooser">${defs.map((id)=>{
    const d=WORKSPACE_REGISTRY[id];
    return `<button class="peh-choice" type="button" onclick="pehOpenWorkspace('${id}')">
      <span class="peh-choice-glyph">${pehGlyph(d.peh)}</span>
      <span class="peh-choice-title">${esc(d.title)}</span>
      <span class="peh-choice-kind">${d.kind==='lane'?'live lane':'placeholder'}</span>
    </button>`;
  }).join('')}</div>`;
}

// ── Taskbar (Debian-workspaces-style switcher; always reachable) ───────
function renderPehTaskbar(){
  const open=state.pehverse.workspaces;
  return `<div class="peh-taskbar" role="toolbar" aria-label="Open workspaces">
    <button class="peh-task-travel" type="button" onclick="pehToggleFastTravel()" title="Fast travel (Alt+T)" aria-label="Fast travel"><span aria-hidden="true">✦</span></button>
    <div class="peh-task-chips">${open.length?open.map((w)=>{
      const def=pehWorkspaceDef(w.defId)||{};
      return `<button class="peh-task-chip ${state.pehverse.focus===w.uid?'active':''} ${w.min?'min':''}" type="button" onclick="pehFocusWorkspace('${w.uid}')" title="${esc(def.title||w.defId)}"><span class="peh-task-glyph">${pehGlyph(def.peh)}</span><span class="peh-task-name">${esc(def.title||w.defId)}</span><span class="peh-task-x" role="button" tabindex="0" title="Close" aria-label="Close ${esc(def.title||w.defId)}" onclick="event.stopPropagation();pehCloseWorkspace('${w.uid}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();pehCloseWorkspace('${w.uid}')}">×</span></button>`;
    }).join(''):`<span class="peh-task-empty">No open workspaces — tap a hotspot, or ✦ Fast travel.</span>`}</div>
    ${open.length?`<button class="peh-task-clear" type="button" onclick="pehCloseAllWorkspaces()">Close all</button>`:''}
  </div>`;
}

// ── FastTravelMenu ─────────────────────────────────────────────────────
function renderFastTravelMenu(){
  if(!state.pehverse.fastTravel)return'';
  const realms=pehPublicRealms();
  const future=pehFutureRealms();
  const here=pehCurrentScene();
  return `<div class="peh-ft-overlay" role="dialog" aria-modal="true" aria-label="Fast travel" onclick="if(event.target===this)pehToggleFastTravel(false)">
    <div class="peh-ft">
      <header class="peh-ft-head"><h2>Fast travel</h2><span class="peh-ft-hint">Reach anywhere in a tap</span><button class="peh-ft-close" type="button" onclick="pehToggleFastTravel(false)" aria-label="Close fast travel">×</button></header>
      <div class="peh-ft-realms">${realms.map((r)=>`
        <div class="peh-ft-realm ${state.pehverse.realm===r.id?'here':''}" style="--peh-accent:${r.accent};--peh-accent2:${r.accent2||r.accent}">
          <button class="peh-ft-realm-head" type="button" onclick="pehTravel('${r.id}')"><span class="peh-ft-mark">${pehGlyph(r.peh)}</span><span class="peh-ft-realm-name"><b>${esc(r.displayName)}</b><i>${esc(r.tagline)}</i></span></button>
          <div class="peh-ft-scenes">${pehScenes(r.id).map((s)=>`<button class="peh-ft-scene ${state.pehverse.realm===r.id&&here&&here.id===s.id?'active':''}" type="button" onclick="pehTravel('${r.id}','${s.id}')">${esc(s.title)}</button>`).join('')}</div>
        </div>`).join('')}
      </div>
      <div class="peh-ft-future"><span class="peh-ft-future-label">Opening later</span>${future.map((r)=>`<span class="peh-ft-soon" title="${esc(r.displayName)} — ${esc(r.tagline)}">${esc(r.displayName)}</span>`).join('')}</div>
    </div>
  </div>`;
}

// ── Keyboard: Esc closes overlay; Alt+T travel; Alt+M mode toggle ──────
let __pehKeysBound=false;
function pehBindKeys(){
  if(__pehKeysBound)return; __pehKeysBound=true;
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'&&state.pehverse.fastTravel){pehToggleFastTravel(false);return}
    if(e.altKey&&(e.key==='t'||e.key==='T')){e.preventDefault();pehToggleFastTravel()}
    if(e.altKey&&(e.key==='m'||e.key==='M')){e.preventDefault();pehToggleMode()}
  });
}
pehBindKeys();

function render(){
  // Luna-style command deck composition. Top: command rail with brand,
  // chips, trust score and Simple/Advanced toggle. Center: Active Arena
  // (the tab body wrapped in a deck-window with a glowing title plate).
  // Left rail: Evaluation Rooms (tab navigator as cards). Right rail:
  // Failure Board + Provider Bay + Evidence Vault + Release Gate. Bottom:
  // Evidence Feed. Footer: small Squidley seal + "Luak Evaluation
  // Lattice". The system status bar and offline banner remain above the
  // command rail because they are global signals.
  // Global signals (verdict/mission banner) sit between the command rail
  // and the deck grid so they don't push the arena's first-fold content
  // (lane chips, run controls, recent runs) down by an entire banner.
  const verdict=renderVerdictBanner();
  const mission=renderMissionBanner();
  const globalBanners=(verdict||mission)?`<div class="deck-banners">${verdict}${mission}</div>`:'';
  // REAL leaderboard sits in the CENTER column of the deck grid,
  // ABOVE the arena. This keeps the leaderboard prominent but lets
  // the LEFT rail (rooms + best models) and RIGHT rail (triage +
  // focused run) render ALONGSIDE the leaderboard at desktop widths —
  // the operator sees the side cards without scrolling past a wide
  // banner. On mobile the grid collapses to one column and the
  // leaderboard is still the first content block after the cmd-rail.
  const leaderboardZone=`<section class="real-leaderboard-zone" aria-label="Model Leaderboard zone">${renderRealLeaderboardZone()}</section>`;
  // The classic command deck is preserved verbatim as `deckMarkup`. The
  // Pehverse world shell (renderPehverse) wraps it: the deck is reachable
  // as the "Full Console" workspace so every existing access path stays
  // live while the place-based navigation becomes the public default.
  const deckMarkup=`<div class="app-shell deck-shell">${renderSystemStatusBar()}${renderOfflineBanner()}${renderCommandRail()}${globalBanners}<main class="deck-grid">
    <aside class="deck-rail-left" aria-label="Evaluation Rooms rail">${renderEvaluationRoomsDeck()}${renderQuickPicksRailDeck(state.activeTab)}</aside>
    <section class="deck-rail-center">${leaderboardZone}${renderActiveArenaShell()}</section>
    <aside class="deck-rail-right" aria-label="Evidence and telemetry rail">${renderEvidenceDeck()}</aside>
    <section class="deck-floor">${renderEvidenceFeed()}</section>
  </main><nav class="nav-band" hidden aria-hidden="true"><div class="tabbar">${renderTabs()}</div></nav><footer class="deck-footer app-footer" role="contentinfo"><span class="deck-footer-seal"><span class="footer-label">Luak Evaluation Lattice</span></span><span class="deck-footer-meta">Judge Deck · Luna shell · ${esc(String(state.activeTab).toUpperCase())}</span></footer></div>`;
  document.getElementById('app').innerHTML=renderPehverse(deckMarkup);
}

// Lightweight elapsed-time ticker — only touches text nodes marked with
// .ls-ticker[data-started-at]. Does not trigger a full render so the heavy
// DOM doesn't thrash every half-second during long runs.
let __tickerTimer=null;
function startElapsedTicker(){
  if(__tickerTimer)return;
  const tick=()=>{
    const nodes=document.querySelectorAll('.ls-ticker[data-started-at]');
    if(!nodes.length)return;
    const now=Date.now();
    nodes.forEach((el)=>{
      const started=Number(el.dataset.startedAt||0);
      if(!started)return;
      const kind=el.dataset.kind||'item';
      const elapsed=fmtElapsedCompact(now-started);
      el.textContent=kind==='batch'?`total ${elapsed}`:elapsed;
    });
  };
  __tickerTimer=setInterval(tick,500);
}

// ── Boot ────────────────────────────────────────────────────────────────
// No sign-in / pairing / token gate. The UI loads directly. If the server
// is unreachable or first-run data fails to load, render a soft error
// screen with a retry button.
const BootState={status:'loading',bootError:''};

function renderBootError(err){
  const app=document.getElementById('app');
  if(!app)return;
  app.innerHTML=bootErrorMarkup(err);
}

function bootErrorMarkup(err){
  const kind=classifyError(err,'boot');
  const rateLimited=kind==='rate_limited'||(err instanceof HTTPError&&err.status===429);
  const title=rateLimited?'STARTUP LIMITED':'STARTUP INCOMPLETE';
  const mark=rateLimited?'CRCB · 429':'CRCB · ERR';
  const guidance=rateLimited
    ? 'The local API returned RATE_LIMITED during boot. The app shell is safe, but ranking data may be incomplete. Wait a moment and refresh.'
    : 'Luak could not finish loading all first-run data. Check the local server, then refresh.';
  const detail=String(err&&err.message||err||'unknown error').slice(0,180);
  return`<div class="app-shell"><section class="abyss-banner boot-soft" style="grid-template-columns:1fr"><div class="ab-callsign"><div class="ab-mark">${esc(mark)}</div><div class="ab-title">${esc(title)}</div><div class="ab-sub">${esc(guidance)}</div><div class="inline-warn data-error">DETAIL · ${esc(detail)}</div><button class="button secondary" onclick="boot()">RETRY LOAD</button></div></section></div>`;
}

async function boot(){
  BootState.status='loading';
  try{
    await loadBootData();
    BootState.status='ready';
    render();
    startElapsedTicker();
    startHealthPolling();
    // If the operator landed directly on the Vision tab (saved tab), kick
    // off the latest-smoke fetch so the status panel populates without
    // requiring a tab switch.
    if(state.activeTab==='vision')fetchVisionSmoke();
    if(state.activeTab==='roleplay')fetchRoleplaySmoke();
  }catch(err){
    BootState.status='boot_error';
    BootState.bootError=String(err);
    renderBootError(err);
  }
}

window.boot=boot;
window.runHealthChecks=runHealthChecks;

boot();
