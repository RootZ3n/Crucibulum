// ── Helpers ─────────────────────────────────────────────────────────────

function humanizeToken(text){const raw=String(text||'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();if(!raw)return'';return raw.replace(/\b\w/g,(m)=>m.toUpperCase())}

// ── WorkspaceRegistry ────────────────────────────────────────────────────
const WORKSPACE_REGISTRY={
  'console':           {product:null,   title:'Speedway Dashboard', kind:'deck',  dock:'fullscreen', peh:'flag'},
  'launch-control':    {product:'luak', title:'Launch Control',     kind:'live',  dock:'fullscreen', peh:'wrench'},
  'leaderboard-ws':    {product:'luak', title:'Leaderboard',        kind:'live',  dock:'fullscreen', peh:'trophy'},
  'race-results':      {product:'luak', title:'Race Results',       kind:'live',  dock:'fullscreen', peh:'gauge'},
  'records-ws':        {product:'luak', title:'Records',            kind:'live',  dock:'fullscreen', peh:'star'},
  'diagnostics-ws':    {product:'luak', title:'Diagnostics',        kind:'live',  dock:'fullscreen', peh:'tools'},
  'timing-ws':         {product:'luak', title:'Timing',             kind:'live',  dock:'fullscreen', peh:'gauge'}
};

// ── Registry lookups ─────────────────────────────────────────────────────
function pehProduct(id){return PRODUCT_REGISTRY.find((p)=>p.id===id)||null}
function pehPublicProducts(){return PRODUCT_REGISTRY.filter((p)=>p.status==='public').sort((a,b)=>a.order-b.order)}
function pehFutureProducts(){return PRODUCT_REGISTRY.filter((p)=>p.status==='future').sort((a,b)=>a.order-b.order)}
function pehScenes(productId){return SCENE_REGISTRY[productId]||[]}
function pehScene(productId,sceneId){return pehScenes(productId).find((s)=>s.id===sceneId)||null}
function pehWorkspaceDef(defId){return WORKSPACE_REGISTRY[defId]||null}

// ── Product isolation ────────────────────────────────────────────────────
function pehDevMode(){
  try{
    if(typeof window!=='undefined'&&window.PEHVERSE_DEV===true)return true;
    if(typeof location!=='undefined'&&/[?&]peh-dev=1(?:&|$)/.test(location.search||'')){
      try{localStorage.setItem('pehverse-dev','1')}catch(e){}
    }
    return(typeof localStorage!=='undefined'&&localStorage.getItem('pehverse-dev')==='1');
  }catch(e){return false}
}
function pehResolveActiveProduct(){
  let injected=null,devSel=null;
  try{injected=(typeof window!=='undefined'&&window.PEHVERSE_PRODUCT)||null}catch(e){}
  try{devSel=pehDevMode()?localStorage.getItem('pehverse-product'):null}catch(e){}
  const want=injected||devSel||PEH_DEFAULT_PRODUCT;
  const p=pehProduct(want);
  return(p&&p.status==='public')?p.id:PEH_DEFAULT_PRODUCT;
}
function pehActiveProduct(){
  const p=pehProduct(state.pehverse.product);
  return(p&&p.status==='public')?p:pehProduct(PEH_DEFAULT_PRODUCT);
}
function pehActiveProductId(){const p=pehActiveProduct();return p?p.id:PEH_DEFAULT_PRODUCT}
function pehCurrentScene(){
  const p=pehActiveProduct();if(!p)return null;
  const sid=state.pehverse.scene||p.defaultScene;
  return pehScene(p.id,sid)||pehScenes(p.id)[0]||null;
}
function pehInitProduct(){
  const pid=pehResolveActiveProduct();
  state.pehverse.product=pid;
  const prod=pehProduct(pid);
  if(!state.pehverse.scene||!pehScene(pid,state.pehverse.scene)){
    state.pehverse.scene=(prod&&prod.defaultScene)||(pehScenes(pid)[0]&&pehScenes(pid)[0].id)||null;
  }
}
function pehWorkspaceBelongsToActive(def){
  if(!def)return false;
  return def.product==null||def.product===pehActiveProductId();
}

// ── Navigation ───────────────────────────────────────────────────────────
function pehSetScene(sceneId){
  if(!pehScene(pehActiveProductId(),sceneId))return;
  state.pehverse.scene=sceneId;state.pehverse.pehPosition=null;
  localStorage.setItem('pehverse-scene',sceneId);render();
}
function pehGoScene(sceneId){
  if(!pehScene(pehActiveProductId(),sceneId))return;
  state.pehverse.scene=sceneId;state.pehverse.pehPosition=null;state.pehverse.fastTravel=false;
  localStorage.setItem('pehverse-scene',sceneId);render();
}
function pehDevSwitchProduct(productId){
  if(!pehDevMode())return;
  const p=pehProduct(productId);
  if(!p||p.status!=='public')return;
  state.pehverse.product=p.id;
  state.pehverse.scene=p.defaultScene||(pehScenes(p.id)[0]&&pehScenes(p.id)[0].id)||null;
  state.pehverse.workspaces=[];state.pehverse.focus=null;
  state.pehverse.pehBubble=null;state.pehverse.pehPosition=null;state.pehverse.fastTravel=false;
  try{localStorage.setItem('pehverse-product',p.id);if(state.pehverse.scene)localStorage.setItem('pehverse-scene',state.pehverse.scene)}catch(e){}
  render();
}
function pehSetMode(mode){
  if(mode!=='immersive'&&mode!=='dashboard')return;
  state.pehverse.mode=mode;localStorage.setItem('pehverse-mode',mode);render();
}
function pehToggleMode(){pehSetMode(state.pehverse.mode==='immersive'?'dashboard':'immersive')}
function pehToggleFastTravel(force){
  state.pehverse.fastTravel=(typeof force==='boolean')?force:!state.pehverse.fastTravel;render();
}

// ── WorkspaceManager ─────────────────────────────────────────────────────
function pehOpenWorkspace(defId,opts){
  const def=pehWorkspaceDef(defId);if(!def)return;
  if(!pehWorkspaceBelongsToActive(def))return;
  let ws=state.pehverse.workspaces.find((w)=>w.defId===defId);
  if(!ws){
    ws={uid:'ws'+(++state.pehverse.wsSeq),defId,dock:(opts&&opts.dock)||def.dock||'right',min:false};
    state.pehverse.workspaces.push(ws);
  }
  ws.min=false;pehFocusWorkspace(ws.uid,true);render();
}
function pehFocusWorkspace(uid,skipRender){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid);
  if(!ws){if(!skipRender)render();return}
  state.pehverse.focus=uid;
  state.pehverse.workspaces=state.pehverse.workspaces.filter((w)=>w.uid!==uid).concat(ws);
  if(!skipRender)render();
}
function pehCloseWorkspace(uid){
  state.pehverse.workspaces=state.pehverse.workspaces.filter((w)=>w.uid!==uid);
  if(state.pehverse.focus===uid){
    const stack=state.pehverse.workspaces;
    state.pehverse.focus=stack.length?stack[stack.length-1].uid:null;
  }
  render();
}
function pehDockWorkspace(uid,dock){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid);if(!ws)return;
  ws.dock=dock;ws.min=false;pehFocusWorkspace(uid,true);render();
}
function pehMinimizeWorkspace(uid){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid);if(!ws)return;
  ws.min=!ws.min;render();
}
function pehCloseAllWorkspaces(){state.pehverse.workspaces=[];state.pehverse.focus=null;render()}
function pehBackToMap(uid){
  if(uid)state.pehverse.workspaces=state.pehverse.workspaces.filter((w)=>w.uid!==uid);
  const stack=state.pehverse.workspaces;
  state.pehverse.focus=stack.length?stack[stack.length-1].uid:null;
  state.pehverse.mode='immersive';
  try{localStorage.setItem('pehverse-mode','immersive')}catch(e){}
  render();
}
function pehHotspot(defId,sceneId){
  if(sceneId&&pehScene(pehActiveProductId(),sceneId)){
    state.pehverse.scene=sceneId;state.pehverse.pehPosition=null;localStorage.setItem('pehverse-scene',sceneId);
  }
  pehOpenWorkspace(defId);
}

// ── Peh speech bubble ────────────────────────────────────────────────────
let pehBubbleFadeTimer=null,pehBubbleClearTimer=null;
const PEH_BUBBLE_HOLD_MS=6000,PEH_BUBBLE_FADE_MS=300;
function pehClearBubbleTimers(){
  if(pehBubbleFadeTimer){clearTimeout(pehBubbleFadeTimer);pehBubbleFadeTimer=null;}
  if(pehBubbleClearTimer){clearTimeout(pehBubbleClearTimer);pehBubbleClearTimer=null;}
}
function pehBubbleAnchor(h){return(h.y!=null&&h.y<24)?'down':'up'}
function pehSayGreeting(hotspot,scene){
  if(!hotspot)return;
  const text=hotspot.greeting||(scene?`Welcome to ${scene.title}.`:'This way!');
  const x=Math.max(16,Math.min(84,hotspot.x!=null?hotspot.x:50));
  const y=hotspot.y!=null?hotspot.y:50;
  pehClearBubbleTimers();
  state.pehverse.pehBubble={text,x,y,anchor:pehBubbleAnchor(hotspot),
    variant:(scene&&scene.pehSlot&&scene.pehSlot.variant)||'race-engineer',
    hotspotId:hotspot.id,phase:'enter'};
  state.pehverse.pehPosition={x:hotspot.x!=null?hotspot.x:50,y};
  render();
  pehBubbleFadeTimer=setTimeout(()=>{
    pehBubbleFadeTimer=null;
    if(!state.pehverse.pehBubble||state.pehverse.pehBubble.hotspotId!==hotspot.id)return;
    state.pehverse.pehBubble.phase='exit';render();
    pehBubbleClearTimer=setTimeout(()=>{
      pehBubbleClearTimer=null;
      if(state.pehverse.pehBubble&&state.pehverse.pehBubble.hotspotId===hotspot.id){state.pehverse.pehBubble=null;render();}
    },PEH_BUBBLE_FADE_MS);
  },PEH_BUBBLE_HOLD_MS);
}
function pehDismissBubble(){
  if(!state.pehverse.pehBubble)return;
  pehClearBubbleTimers();
  state.pehverse.pehBubble.phase='exit';render();
  pehBubbleClearTimer=setTimeout(()=>{pehBubbleClearTimer=null;state.pehverse.pehBubble=null;render();},PEH_BUBBLE_FADE_MS);
}
function pehHotspotActivate(sceneId,hotspotId){
  const scene=pehScene(pehActiveProductId(),sceneId);
  const hotspot=scene&&scene.hotspots?scene.hotspots.find((h)=>h.id===hotspotId):null;
  if(hotspot)pehSayGreeting(hotspot,scene);
  setTimeout(()=>{
    if(!hotspot)return;
    if(hotspot.workspace)pehHotspot(hotspot.workspace,hotspot.scene);
    else if(hotspot.scene)pehSetScene(hotspot.scene);
  },300);
}

// ── Peh slot ──────────────────────────────────────────────────────────────
function pehSquirrelSilhouette(){
  return`<svg class="peh-squirrel" viewBox="0 0 64 64" width="100%" height="100%" aria-hidden="true"><path fill="currentColor" d="M40 9c2.2 0 4 2 4 4.6 0 2-1 3.6-2.4 4.4 3 2.4 4.8 6 4.8 10.2 0 3-1 5.7-2.7 7.9 5.7 2.5 9.7 8.1 9.7 14.6 0 1.7-1.3 3-3 3H22c-7.2 0-13-5.8-13-13 0-6.8 5.2-12.4 11.9-13 .3-4 2.3-7.5 5.3-9.8-.7-1-1.1-2.2-1.1-3.5C25 11 28 8 31.8 8c1.9 0 3.6.8 4.8 2 1-1.2 2.4-1 3.4-1z"/><g fill="none" stroke="#3a2a18" stroke-width="1.6" stroke-linecap="round" opacity=".92"><circle cx="29.5" cy="23.5" r="3.7"/><path d="M33 22.4c3-1 5.2-.9 7 .5"/></g><circle cx="29.5" cy="23.5" r="1.4" fill="#0c0a1a"/></svg>`;
}
function pehSlotMarkup(slot,opts){
  if(!slot)return'';
  const o=opts||{};
  const variant=slot.variant||'race-engineer';
  const inline=o.inline;
  const pos=inline?'':`left:${slot.x}%;top:${slot.y}%;`;
  const anchor=slot.anchor||'center';
  return`<div class="peh-slot peh-slot-${anchor} ${inline?'peh-slot-inline':''} ${o.glow?'glow':''}" style="${pos}" data-variant="${esc(variant)}" data-anchor="${esc(anchor)}" title="Peh — your guide (${esc(variant)})" aria-label="Peh — ${esc(variant)}">
    <span class="peh-slot-medallion" aria-hidden="true">${pehSquirrelSilhouette()}</span>
    ${inline?'':'<span class="peh-slot-tag">Peh</span>'}
  </div>`;
}
function renderPehSlot(scene){
  if(!scene||!scene.pehSlot)return'';
  const pv=state.pehverse;
  const slot=pv.pehPosition?Object.assign({},scene.pehSlot,{x:pv.pehPosition.x,y:pv.pehPosition.y}):scene.pehSlot;
  return pehSlotMarkup(slot,{inline:false,glow:!!pv.pehBubble});
}
function renderPehBubble(){
  const b=state.pehverse.pehBubble;
  if(!b)return'';
  const phaseClass=b.phase==='exit'?'peh-bubble-exit':'peh-bubble-enter';
  return`<div class="peh-bubble-layer" aria-hidden="false">
    <div class="peh-bubble peh-bubble-anchor-${esc(b.anchor)} ${phaseClass}" style="left:${b.x}%;top:${b.y}%" role="status" title="Dismiss" onclick="pehDismissBubble()">
      <div class="peh-bubble-content">
        <span class="peh-bubble-name">Peh</span>
        <p class="peh-bubble-text">${esc(b.text)}</p>
      </div>
      <div class="peh-bubble-tail" aria-hidden="true"></div>
    </div>
  </div>`;
}
function renderPehGuide(product){
  if(!product||!product.mascotArt)return'';
  return`<figure class="peh-guide" aria-hidden="true">
    <span class="peh-guide-frame"><img class="peh-guide-img" src="${esc(product.mascotArt)}" alt="" loading="lazy"></span>
    <figcaption class="peh-guide-cap"><b>Peh</b><i>your guide</i></figcaption>
  </figure>`;
}

// ── PehverseShell ─────────────────────────────────────────────────────────
function renderPehverse(deckMarkup){
  const pv=state.pehverse;
  const product=pehActiveProduct();
  const scene=pehCurrentScene();
  const styleVars=`--peh-accent:${product.accent};--peh-accent2:${product.accent2||product.accent}`;
  return`<div class="peh-shell peh-mode-${pv.mode} peh-product-${product.id}" data-product="${product.id}" style="${styleVars}">
    ${renderPehTopBar(product,scene)}
    <div class="peh-stage">${renderPehStage(product,scene,deckMarkup)}</div>
    ${renderPehTaskbar()}
    ${renderFastTravelMenu()}
  </div>`;
}
function renderPehTopBar(product,scene){
  const pv=state.pehverse;
  const dev=pehDevMode();
  return`<header class="peh-topbar">
    <div class="peh-brand"><span class="peh-brand-mark" title="Pehverse">PEH</span><span class="peh-brand-word">${esc(product.displayName)}</span>${dev?'<span class="peh-dev-badge" title="Dev mode">DEV</span>':''}</div>
    <button class="peh-travel-btn" type="button" onclick="pehToggleFastTravel()" aria-haspopup="dialog" aria-expanded="${pv.fastTravel?'true':'false'}" title="Fast travel (Alt+T)">
      <span class="peh-travel-glyph" aria-hidden="true">✦</span>
      <span class="peh-here"><b>${esc(product.displayName)}</b><i>${esc(scene?scene.title:product.tagline)}</i></span>
      <span class="peh-travel-cta">Fast travel</span>
    </button>
    <div class="peh-mode-toggle" role="group" aria-label="View mode (Alt+M)">
      <button type="button" class="${pv.mode==='immersive'?'active':''}" aria-pressed="${pv.mode==='immersive'}" onclick="pehSetMode('immersive')">Immersive</button>
      <button type="button" class="${pv.mode==='dashboard'?'active':''}" aria-pressed="${pv.mode==='dashboard'}" onclick="pehSetMode('dashboard')">Dashboard</button>
    </div>

function renderPehStage(product,scene,deckMarkup){
  return state.pehverse.mode==='dashboard'
    ?renderPehDashboard(product,scene,deckMarkup)
    :renderPehImmersive(product,scene,deckMarkup);
}
function renderPehImmersive(product,scene,deckMarkup){
  return`<div class="peh-scene" data-scene="${scene?scene.id:''}">
    <div class="peh-scene-atmos" aria-hidden="true"></div>
    <div class="peh-scene-caption">
      <span class="peh-scene-tag">${esc(product.displayName)} · ${esc(product.tagline)}</span>
      <h1 class="peh-scene-title">${esc(scene?scene.title:product.displayName)}</h1>
      <p class="peh-scene-desc">${esc(scene?scene.desc:product.blurb)}</p>
    </div>
    ${renderPehSlot(scene)}
    ${renderPehBubble()}
    ${renderPehGuide(product)}
    ${renderHotspotLayer(scene)}
    ${renderPehWaypoints(product,scene)}
    ${renderWorkspaceOverlays(deckMarkup)}
  </div>`;
}
function renderPehDashboard(product,scene,deckMarkup){
  const open=state.pehverse.workspaces;
  const grid=open.length
    ?open.map((w)=>renderWorkspaceTile(w,deckMarkup)).join('')
    :pehWorkspaceChooser(product);
  return`<div class="peh-dash">
    <div class="peh-dash-head">
      <div class="peh-dash-here">${scene&&scene.pehSlot?pehSlotMarkup(scene.pehSlot,{inline:true}):''}<span class="peh-scene-tag">${esc(product.displayName)}</span><h1>${esc(scene?scene.title:product.displayName)}</h1><p>${esc(scene?scene.desc:product.blurb)}</p></div>
      ${renderPehWaypoints(product,scene)}
    </div>
    <div class="peh-grid ${open.length>1?'multi':''}">${grid}</div>
  </div>`;
}
function renderHotspotLayer(scene){
  if(!scene||!scene.hotspots||!scene.hotspots.length)return'';
  return`<div class="peh-hotspots" aria-label="${esc(scene.title)} hotspots">${scene.hotspots.map((h)=>{
    const action=`pehHotspotActivate('${scene.id}','${h.id}')`;
    const kind=h.workspace?(pehWorkspaceDef(h.workspace)||{}).kind:'travel';
    const isLive=kind==='deck'||kind==='live';
    return`<button class="peh-hotspot" type="button" style="left:${h.x}%;top:${h.y}%" title="${esc(h.label)}" aria-label="${esc(h.label)}" onclick="${action}">
      <span class="peh-pin" aria-hidden="true"></span>
      <span class="peh-hotspot-label">${esc(h.label)}${isLive?'<i class="peh-dot-live"></i>':''}</span>
    </button>`;
  }).join('')}</div>`;
}
function renderPehWaypoints(product,scene){
  const scenes=pehScenes(product.id);
  if(scenes.length<2)return'';
  return`<nav class="peh-waypoints" aria-label="${esc(product.displayName)} areas">${scenes.map((s)=>`<button type="button" class="peh-waypoint ${scene&&s.id===scene.id?'active':''}" aria-current="${scene&&s.id===scene.id?'true':'false'}" onclick="pehSetScene('${s.id}')">${esc(s.title)}</button>`).join('')}</nav>`;
}

// ── Workspace panel / tile rendering ──────────────────────────────────────
function renderWorkspaceOverlays(deckMarkup){
  const open=state.pehverse.workspaces;
  if(!open.length)return'';
  let ws=open.find((w)=>w.uid===state.pehverse.focus)||open[open.length-1];
  if(ws.min)return'';
  return`<div class="peh-overlays">${renderWorkspacePanel(ws,deckMarkup)}</div>`;
}
function renderWorkspacePanel(w,deckMarkup){
  const def=pehWorkspaceDef(w.defId)||{};
  const focused=state.pehverse.focus===w.uid;
  return`<section class="peh-panel dock-${w.dock} ${focused?'focused':''} ${w.min?'min':''}" data-uid="${w.uid}" onmousedown="pehFocusWorkspace('${w.uid}')" aria-label="${esc(def.title||w.defId)} workspace">
    ${renderWorkspaceHeader(w,def,false)}
    <div class="peh-panel-body">${w.min?'':pehWorkspaceBody(w,deckMarkup)}</div>
  </section>`;
}
function renderWorkspaceTile(w,deckMarkup){
  const def=pehWorkspaceDef(w.defId)||{};
  return`<section class="peh-tile ${state.pehverse.focus===w.uid?'focused':''}" data-uid="${w.uid}" onmousedown="pehFocusWorkspace('${w.uid}')" aria-label="${esc(def.title||w.defId)} workspace">
    ${renderWorkspaceHeader(w,def,true)}
    <div class="peh-panel-body">${pehWorkspaceBody(w,deckMarkup)}</div>
  </section>`;
}
function renderWorkspaceHeader(w,def,isTile){
  const kindTag=def.kind==='live'?'LIVE':def.kind==='deck'?'CONSOLE':'LIVE';
  const dockBtn=(d,glyph,label)=>`<button class="peh-dockbtn ${w.dock===d?'on':''}" type="button" title="Dock ${label}" aria-label="Dock ${label}" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();pehDockWorkspace('${w.uid}','${d}')">${glyph}</button>`;
  return`<header class="peh-panel-head">
    ${isTile?'':`<button class="peh-backmap" type="button" title="Back to the map" aria-label="Back to the world map" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();pehBackToMap('${w.uid}')"><span aria-hidden="true">‹</span> Map</button>`}
    <span class="peh-panel-glyph">${pehGlyph(def.peh)}</span>
    <span class="peh-panel-title">${esc(def.title||w.defId)}</span>
    <span class="peh-panel-kind k-${kindTag.toLowerCase()}">${kindTag}</span>
    <span class="peh-panel-ctrls">
      ${isTile?'':dockBtn('right','⫼','right')+dockBtn('bottom','▭','bottom')+dockBtn('fullscreen','⛶','full')}
      <button class="peh-dockbtn" type="button" title="Minimize" aria-label="Minimize" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();pehMinimizeWorkspace('${w.uid}')">—</button>
      <button class="peh-dockbtn close" type="button" title="Close" aria-label="Close" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();pehCloseWorkspace('${w.uid}')">×</button>
    </span>
  </header>`;
}

// ── Workspace body dispatch ───────────────────────────────────────────────
function pehWorkspaceBody(w,deckMarkup){
  const def=pehWorkspaceDef(w.defId);if(!def)return'';
  if(def.kind==='deck')return`<div class="peh-deck-wrap">${deckMarkup}</div>`;
  if(def.kind==='live')return`<div class="peh-live-wrap">${renderLiveWorkspace(w.defId)}</div>`;
  return`<div class="peh-ph"><p style="padding:20px;color:var(--ink-dim)">Unknown workspace kind.</p></div>`;
}
function pehProductWorkspaces(productId){
  return Object.keys(WORKSPACE_REGISTRY).filter((id)=>{
    const d=WORKSPACE_REGISTRY[id];return d.product===productId||d.product==null;
  });
}
function pehWorkspaceChooser(product){
  const defs=pehProductWorkspaces(product.id);
  return`<div class="peh-chooser">${defs.map((id)=>{
    const d=WORKSPACE_REGISTRY[id];
    return`<button class="peh-choice" type="button" onclick="pehOpenWorkspace('${id}')">
      <span class="peh-choice-glyph">${pehGlyph(d.peh)}</span>
      <span class="peh-choice-title">${esc(d.title)}</span>
      <span class="peh-choice-kind">${d.kind==='live'?'live data':d.kind==='deck'?'dashboard':'workspace'}</span>
    </button>`;
  }).join('')}</div>`;
}

// ── Live workspace router ─────────────────────────────────────────────────
function renderLiveWorkspace(defId){
  switch(defId){
    case 'launch-control':return renderLaunchControl();
    case 'leaderboard-ws':return renderLeaderboardWs();
    case 'race-results':  return renderRaceResults();
    case 'records-ws':    return renderRecords();
    case 'diagnostics-ws':return renderDiagnostics();
    case 'timing-ws':     return renderTiming();
    default:return`<div class="ck-empty">Unknown workspace: ${esc(defId)}</div>`;
  }
}

// ── Shared data helpers ───────────────────────────────────────────────────
const FAMILIES=[
  {id:'A',label:'Adversarial',     weight:'15%'},
  {id:'B',label:'Spec Discipline', weight:'20%'},
  {id:'C',label:'Orchestration',   weight:'20%'},
  {id:'D',label:'Identity',        weight:'5%'},
  {id:'E',label:'Truthfulness',    weight:'5%'},
  {id:'F',label:'Efficiency',      weight:'5%'},
  {id:'G',label:'Behavior',        weight:'5%'},
  {id:'H',label:'Safety',          weight:'5%'},
  {id:'I',label:'Memory',          weight:'5%'},
  {id:'J',label:'Tool Calling',    weight:'5%'},
  {id:'K',label:'Trust',           weight:'10%'}
];
const FAM_COLORS={A:'#ef4444',B:'#3b82f6',C:'#8b5cf6',D:'#14b8a6',E:'#22c55e',F:'#eab308',G:'#f97316',H:'#dc2626',I:'#6366f1',J:'#22d3ee',K:'#f59e0b'};
const FAM_MAP={};FAMILIES.forEach(f=>{FAM_MAP[f.id]=f});

function pctNum(v){if(v==null)return null;return Math.round(v*(v<=1?100:1));}
function pctStr(v){const p=pctNum(v);return p!=null?p+'%':'—';}
function timeAgo(ts){
  if(!ts)return'';const t=new Date(ts).getTime();if(isNaN(t))return String(ts).slice(0,10);
  const s=Math.floor((Date.now()-t)/1000);
  if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';
}
function scoreCls(v){if(v==null)return'dim';const f=v<=1?v:v/100;return f>=.7?'':f>=.4?'warn':'fail';}
function provColor(p){
  const m={ollama:'#4ade80',openai:'#22d3ee',deepseek:'#818cf8',anthropic:'#fb923c',minimax:'#ec4899',google:'#facc15',mistral:'#fbbf24',cohere:'#06b6d4',together:'#a78bfa'};
  return m[(p||'').toLowerCase()]||'#8b5cf6';
}
function buildTasksByFam(){
  const tasksByFam={};
  (state.dashData.tasks||[]).forEach(t=>{
    const f=t.family||t.score_family||t.category||'Other';
    (tasksByFam[f]||(tasksByFam[f]=[])).push(t);
  });
  return tasksByFam;
}

// ── Window 1: LAUNCH CONTROL ──────────────────────────────────────────────
function renderLaunchControl(){
  const d=state.dashData;
  const localProviders=(d.providers||[]).filter(p=>p.kind==='local');
  const cloudProviders=(d.providers||[]).filter(p=>p.kind==='cloud');
  const runMode=d.runMode||'single';
  const sel=d.selectedModel;

  // Local model cards
  function localModelCard(m,prov){
    const name=m.id||m.label||'';
    const isSelected=sel===name;
    const avail=m.available!==false;
    return`<div class="lc-model-card${isSelected?' selected':''}">
      <span class="lc-model-dot ${avail?'on':'off'}"></span>
      <div class="lc-model-info">
        <div class="lc-model-name" title="${esc(name)}">${esc(m.label||name)}</div>
        <div class="lc-model-badge">${esc(prov.label||prov.id)}</div>
      </div>
      <button class="lc-select-btn" type="button" onmousedown="event.stopPropagation()" onclick="ckSelectModel('${esc(name)}')">${isSelected?'✓ Selected':'Select'}</button>
    </div>`;
  }

  let localCards='';
  if(localProviders.length){
    localProviders.forEach(prov=>{
      const models=prov.models||[];
      if(models.length){localCards+=models.map(m=>localModelCard(m,prov)).join('');}
      else if(prov.available){
        if(prov.manualModelAllowed){
          localCards+=`<div class="lc-manual-row">
            <span class="lc-model-badge">${esc(prov.label||prov.id)}</span>
            <input type="text" class="lc-manual-field" id="lc-manual-${esc(prov.id)}" placeholder="Enter model name…" onkeydown="if(event.key==='Enter'){ckSelectModel(this.value);}">
            <button class="lc-select-btn" type="button" onclick="ckSelectModel(document.getElementById('lc-manual-${esc(prov.id)}').value)">Use</button>
          </div>`;
        } else {
          localCards+=`<div class="ck-empty">${esc(prov.label||prov.id)}: no models</div>`;
        }
      } else {
        localCards+=`<div class="lc-provider-off"><span class="lc-model-dot off"></span><span>${esc(prov.label||prov.id)}: ${esc(prov.reason||'offline')}</span></div>`;
      }
    });
  } else {
    localCards=`<div class="ck-empty">No local providers<br>Start Ollama or similar</div>`;
  }
  const localCount=localProviders.reduce((n,p)=>(p.models||[]).length+n,0);

  // Cloud provider cards
  let cloudCards='';
  if(cloudProviders.length){
    cloudCards=cloudProviders.map(prov=>{
      const avail=prov.available;
      const models=prov.models||[];
      if(!avail){
        return`<div class="lc-cloud-card unavail">
          <div class="lc-cp-head">
            <span class="lc-model-dot off"></span>
            <span class="lc-cp-name">${esc(prov.label||prov.id)}</span>
            <span class="lc-cp-kind">cloud</span>
          </div>
          <div class="lc-cp-reason">${esc(prov.reason||'Unavailable')}</div>
        </div>`;
      }
      let modelsHtml='';
      if(models.length){
        modelsHtml=models.map(m=>{
          const name=m.id||m.label||'';
          const isSelected=sel===name;
          return`<div class="lc-model-card${isSelected?' selected':''}">
            <span class="lc-model-dot ${m.available!==false?'on':'warn'}"></span>
            <div class="lc-model-info">
              <div class="lc-model-name" title="${esc(name)}">${esc(m.label||name)}</div>
            </div>
            <button class="lc-select-btn" type="button" onmousedown="event.stopPropagation()" onclick="ckSelectModel('${esc(name)}')">${isSelected?'✓ Selected':'Select'}</button>
          </div>`;
        }).join('');
      } else if(prov.manualModelAllowed){
        modelsHtml=`<div class="lc-manual-row">
          <input type="text" class="lc-manual-field" id="lc-manual-${esc(prov.id)}" placeholder="Enter model name…" onkeydown="if(event.key==='Enter'){ckSelectModel(this.value);}">
          <button class="lc-select-btn" type="button" onclick="ckSelectModel(document.getElementById('lc-manual-${esc(prov.id)}').value)">Use</button>
        </div>`;
      }
      return`<div class="lc-cloud-card avail">
        <div class="lc-cp-head">
          <span class="lc-model-dot on"></span>
          <span class="lc-cp-name">${esc(prov.label||prov.id)}</span>
          <span class="lc-cp-kind">cloud</span>
        </div>
        ${modelsHtml}
      </div>`;
    }).join('');
  } else {
    cloudCards=`<div class="ck-empty">No cloud providers configured</div>`;
  }

  // TEST FAMILY dropdown options
  const tasksByFam=buildTasksByFam();
  let familyOpts='';
  if(runMode==='family'){
    const famKeys=[...new Set(['A','B','C','D','E','F','G','H','I','J','K',...Object.keys(tasksByFam)])].filter(k=>tasksByFam[k]&&tasksByFam[k].length);
    if(famKeys.length){
      familyOpts=famKeys.map(f=>{
        const fdef=FAM_MAP[f];
        const label=fdef?`${f} — ${fdef.label}`:f;
        const cnt=(tasksByFam[f]||[]).length;
        return`<option value="${esc(f)}"${d.selectedFamily===f?' selected':''}>${esc(label)} (${cnt} tests)</option>`;
      }).join('');
    } else {
      familyOpts='<option value="">No test families loaded</option>';
    }
  } else {
    const famKeys=Object.keys(tasksByFam).sort();
    if(famKeys.length){
      familyOpts=famKeys.map(f=>{
        const fdef=FAM_MAP[f];
        const label=fdef?`${f} — ${fdef.label}`:f;
        const tasks=tasksByFam[f]||[];
        return`<optgroup label="${esc(label)}">${tasks.map(t=>{
          const n=t.id||t.name||t.task||'';
          return`<option value="${esc(n)}"${d.selectedTask===n?' selected':''}>${esc(humanizeToken(t.name||t.id||n))}</option>`;
        }).join('')}</optgroup>`;
      }).join('');
    } else {
      familyOpts='<option value="">No tests loaded</option>';
    }
  }

  const famLabel=runMode==='family'&&d.selectedFamily?` ${esc(d.selectedFamily)}`:'';
  const startLabel=runMode==='family'?`🏁 RUN ALL${famLabel}`:'🏁 START RUN';
  const selDisplay=sel
    ?`<div class="lc-sel-display">Selected: <strong>${esc(sel)}</strong></div>`
    :`<div class="lc-sel-empty">No model selected</div>`;

  const activeRuns=d.activeRuns||[];
  const activeSection=activeRuns.length?`
    <div class="lc-active">
      <div class="ck-panel-head"><span class="ck-panel-icon">⚡</span><span class="ck-panel-title">Active Runs</span><span class="ck-panel-badge" style="color:var(--amber)">${activeRuns.length} running</span></div>
      <div class="ck-active-list">
        ${activeRuns.map(r=>{
          const pv2=r.total>0?Math.min(100,Math.round(r.done/r.total*100)):0;
          const elapsed=r.startedAt?Math.floor((Date.now()-r.startedAt)/1000)+'s':'—';
          return`<div class="ck-run-card">
            <div class="ck-run-head">
              <span class="ck-run-id">Run #${esc(String(r.id||'?'))}</span>
              <span class="ck-run-model">${esc(r.model||'—')}</span>
              <span class="ck-run-task">${esc(r.task||'—')}</span>
              <span class="ck-run-elapsed">${esc(elapsed)}</span>
            </div>
            <div class="ck-run-progress-row">
              <div class="ck-run-bar-track"><div class="ck-run-bar-fill" style="width:${pv2}%"></div></div>
              <span class="ck-run-pct">${pv2}%</span>
            </div>
            <div class="ck-run-counts">${r.done||0}/${r.total||'?'} · ${r.pass||0} pass · ${r.fail||0} fail</div>
          </div>`;
        }).join('')}
      </div>
    </div>`:''

  return`<div class="lc">
    <div class="lc-cols">
      <div class="lc-panel">
        <div class="ck-panel-head"><span class="ck-panel-icon">💻</span><span class="ck-panel-title">Local Models</span><span class="ck-panel-badge">${localCount}</span></div>
        <div class="lc-models-scroll">${localCards}</div>
      </div>
      <div class="lc-panel lc-controls-panel">
        <div class="ck-panel-head"><span class="ck-panel-icon">🏁</span><span class="ck-panel-title">Run Controls</span></div>
        <div class="lc-controls-body">
          ${selDisplay}
          <div class="lc-field">
            <label class="ck-field-label">Test Family</label>
            <select class="ck-select" id="lc-fam-sel" onchange="${runMode==='family'?'ckSelectFamilyForRun(this.value)':'ckSelectTask(this.value)'}">
              <option value="">— select ${runMode==='family'?'family':'test'} —</option>${familyOpts}
            </select>
          </div>
          <div class="lc-field">
            <label class="ck-field-label">Run Mode</label>
            <div class="lc-mode-toggle">
              <button class="lc-mode-btn${runMode==='single'?' active':''}" type="button" onmousedown="event.stopPropagation()" onclick="ckSetRunMode('single')">Single Test</button>
              <button class="lc-mode-btn${runMode==='family'?' active':''}" type="button" onmousedown="event.stopPropagation()" onclick="ckSetRunMode('family')">Full Family</button>
            </div>
          </div>
          ${runMode==='single'?`<div class="lc-field">
            <label class="ck-field-label">Count (1–50)</label>
            <input type="number" class="ck-count-input" id="lc-count" value="${d.selectedCount||5}" min="1" max="50" onchange="ckSetCount(this.value)">
          </div>`:''}
          <button class="ck-btn-start" id="lc-start-btn" type="button" onmousedown="event.stopPropagation()" onclick="ckStartRun()">${startLabel}</button>
          <div id="lc-run-error"></div>
          <div class="ck-or-divider">or</div>
          <button class="ck-btn-suite" type="button" onmousedown="event.stopPropagation()" onclick="ckRunSuite()">Run Full Suite</button>
        </div>
      </div>
      <div class="lc-panel">
        <div class="ck-panel-head"><span class="ck-panel-icon">☁️</span><span class="ck-panel-title">Cloud Providers</span><span class="ck-panel-badge">${cloudProviders.length}</span></div>
        <div class="lc-models-scroll">${cloudCards}</div>
      </div>
    </div>
    ${activeSection}
  </div>`;
}

// ── Score Families subcomponent ───────────────────────────────────────────
function renderScoreFamiliesPanel(){
  const d=state.dashData;
  const topEntry=d.leaderboard[0]||null;
  const famScores=topEntry&&topEntry.scores?topEntry.scores:{};
  const famCards=FAMILIES.map(f=>{
    const raw=famScores[f.id]!=null?famScores[f.id]:null;
    const p=pctNum(raw);const pv=p!=null?p:0;
    const c=FAM_COLORS[f.id]||'var(--cyan)';
    return`<div class="ck-fam-card">
      <div class="ck-fam-letter" style="color:${c}">${esc(f.id)}</div>
      <div class="ck-fam-mid">
        <div class="ck-fam-label">${esc(f.label)}</div>
        <div class="ck-fam-bar-track"><div class="ck-fam-bar-fill" style="width:${pv}%;background:linear-gradient(90deg,${c},${c}aa)"></div></div>
      </div>
      <div class="ck-fam-right">
        <div class="ck-fam-pct" style="color:${c}">${p!=null?p+'%':'—'}</div>
        <div class="ck-fam-weight">${esc(f.weight)}</div>
      </div>
    </div>`;
  }).join('');
  return`<div class="ck-panel">
    <div class="ck-panel-head"><span class="ck-panel-icon">📊</span><span class="ck-panel-title">Score Families</span>${topEntry?`<span class="ck-panel-badge">${esc((topEntry.model||topEntry.name||'').slice(0,18))}</span>`:''}</div>
    <div class="ck-families-list">${famCards||'<div class="ck-empty">Run benchmarks to see family scores</div>'}</div>
  </div>`;
}

// ── Leaderboard subcomponent ─────────────────────────────────────────────
function renderLeaderboardPanel(){
  const d=state.dashData;
  const medals=['🥇','🥈','🥉'];
  const lbCards=d.leaderboard.length
    ?d.leaderboard.slice(0,10).map((m,i)=>{
        const name=m.model||m.name||m.id||'—';
        const prov=m.provider||m.org||'—';
        const raw=m.score!=null?m.score:m.composite!=null?m.composite:null;
        const p=pctNum(raw);
        const tierCls=i===0?'gold':i===1?'silver':i===2?'bronze':'';
        const scores=m.scores||{};
        const topFams=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]).slice(0,2);
        const chips=topFams.map(k=>{
          const c=FAM_COLORS[k]||'var(--cyan)';
          return`<span class="ck-lb-chip" style="color:${c};border-color:${c}">${esc(k)}: ${pctNum(scores[k])||'?'}%</span>`;
        }).join('');
        return`<div class="ck-lb-card ${esc(tierCls)}">
          ${i<3?`<div class="ck-lb-medal">${medals[i]}</div>`:`<div class="ck-lb-rank">#${i+1}</div>`}
          <div class="ck-lb-info">
            <div class="ck-lb-name" title="${esc(name)}">${esc(name)}</div>
            ${chips?`<div class="ck-lb-chips">${chips}</div>`:''}
          </div>
          <div class="ck-lb-score-col">
            <div class="ck-lb-score">${p!=null?p+'%':'—'}</div>
            <div class="ck-lb-provider">${esc(prov)}</div>
          </div>
        </div>`;
      }).join('')
    :'<div class="ck-empty">No ranked models yet<br>Run benchmarks to populate</div>';
  return`<div class="ck-panel">
    <div class="ck-panel-head"><span class="ck-panel-icon">🏆</span><span class="ck-panel-title">Leaderboard</span><span class="ck-panel-badge">${d.leaderboard.length} ranked</span></div>
    <div class="ck-lb-list">${lbCards}</div>

}

// ── Window 3: RACE RESULTS ───────────────────────────────────────────────
function renderRaceResults(){
  const d=state.dashData;
  const uniqueModels=[...new Set(d.runs.map(r=>r.model||r.model_id||r.name||'').filter(Boolean))];
  const uniqueTasks=[...new Set(d.runs.map(r=>r.task||r.task_family||r.benchmark||r.type||'').filter(Boolean))];

  const runRows=d.runs.length
    ?d.runs.slice(0,30).map(r=>{
        const model=r.model||r.model_id||r.name||'—';
        const task=r.task||r.task_family||r.benchmark||r.type||'—';
        const raw=r.score!=null?r.score:r.composite!=null?r.composite:null;
        const p=pctNum(raw);const cls=scoreCls(raw);
        const prov=r.provider||r.org||'—';
        const ts=r.created_at||r.timestamp||r.started_at||r.updated_at||null;
        const statusOk=r.status==='pass'||r.passed===true?'pass':r.status==='fail'||r.passed===false?'fail':p!=null?(p>=70?'pass':p>=40?'warn':'fail'):'dim';
        return`<tr>

          <td style="color:var(--ink-dim);font-size:11px">${esc(task)}</td>
          <td><div class="ck-score-cell"><div class="ck-score-mini-bar"><div class="ck-score-mini-fill ${esc(cls)}" style="width:${p!=null?p:0}%"></div></div><span class="ck-score-num ${esc(cls)}">${p!=null?p+'%':'—'}</span></div></td>
          <td style="color:var(--ink-dim);font-size:11px;white-space:nowrap">${esc(timeAgo(ts))}</td>
          <td><span class="ck-pass-badge ${esc(statusOk)}">${statusOk==='dim'?'—':statusOk}</span></td>
          <td style="color:var(--ink-dim);font-size:11px">${esc(prov)}</td>
        </tr>`;
      }).join('')
    :`<tr><td colspan="6"><div class="ck-empty">No runs recorded yet</div></td></tr>`;

  return`<div class="rr">
    <div class="ck-runs-filters">
      <select class="ck-select" id="rr-filter-model">
        <option value="">All Models</option>
        ${uniqueModels.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}
      </select>

    </div>
    <div class="ck-runs-table-wrap">
      <table class="ck-runs-table">

        <tbody>${runRows}</tbody>
      </table>
    </div>
  </div>`;
}

// ── Window 4: RECORDS ────────────────────────────────────────────────────
function renderRecords(){
  const d=state.dashData;
  const lb=d.leaderboard;

  // Top score per family — find model with best score in each family
  const topPerFam=FAMILIES.map(f=>{
    let best=null;let bestScore=-1;
    lb.forEach(m=>{
      const sc=m.scores&&m.scores[f.id]!=null?m.scores[f.id]:null;
      if(sc!=null&&sc>bestScore){bestScore=sc;best=m;}
    });
    return{fam:f,model:best,score:bestScore>=0?bestScore:null};
  });

  const famRows=topPerFam.map(({fam,model,score})=>{
    const c=FAM_COLORS[fam.id]||'var(--cyan)';
    const p=pctNum(score);
    const name=model?(model.model||model.name||model.id||'—'):'—';
    return`<div class="rec-fam-row">
      <span class="rec-fam-letter" style="color:${c}">${esc(fam.id)}</span>
      <span class="rec-fam-label">${esc(fam.label)}</span>
      <span class="rec-fam-model" title="${esc(name)}">${esc(name.slice(0,20))}</span>
      <span class="rec-fam-score" style="color:${c}">${p!=null?p+'%':'—'}</span>
    </div>`;
  }).join('');

  // Overall best
  const best=lb[0]||null;
  const bestScore=best?pctNum(best.score!=null?best.score:best.composite):null;

  // Consistency — model with lowest score variance
  const modelsWithScores=lb.filter(m=>m.scores&&Object.keys(m.scores).length>=3);
  let mostConsistent=null;let minVariance=Infinity;
  modelsWithScores.forEach(m=>{
    const vals=Object.values(m.scores).map(v=>v!=null?pctNum(v):null).filter(v=>v!=null);
    if(vals.length<3)return;
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    const variance=vals.reduce((a,v)=>a+Math.pow(v-avg,2),0)/vals.length;
    if(variance<minVariance){minVariance=variance;mostConsistent=m;}
  });

  return`<div class="rec">
    <div class="rec-cols">
      <div class="ck-panel">
        <div class="ck-panel-head"><span class="ck-panel-icon">🏆</span><span class="ck-panel-title">Top Per Family</span></div>
        <div class="rec-fam-list">${famRows||'<div class="ck-empty">Run benchmarks to see family records</div>'}</div>
      </div>
      <div class="ck-panel">
        <div class="ck-panel-head"><span class="ck-panel-icon">⭐</span><span class="ck-panel-title">All-Time Records</span></div>
        <div class="rec-alltime">
          <div class="rec-stat">
            <div class="rec-stat-label">Best Overall</div>
            <div class="rec-stat-val">${best?esc(best.model||best.name||'—'):'—'}</div>
            <div class="rec-stat-score" style="color:var(--amber)">${bestScore!=null?bestScore+'%':'—'}</div>
          </div>
          <div class="rec-stat">
            <div class="rec-stat-label">Most Consistent</div>
            <div class="rec-stat-val">${mostConsistent?esc((mostConsistent.model||mostConsistent.name||'').slice(0,20)):'—'}</div>
            <div class="rec-stat-score" style="color:var(--teal)">${mostConsistent?'σ='+Math.round(Math.sqrt(minVariance))+'%':'—'}</div>
          </div>
          <div class="rec-stat">
            <div class="rec-stat-label">Total Models Ranked</div>
            <div class="rec-stat-val" style="font-size:28px;color:var(--cyan)">${lb.length}</div>
          </div>
          <div class="rec-stat">
            <div class="rec-stat-label">Evidence Bundles</div>
            <div class="rec-stat-val" style="font-size:28px;color:var(--violet-hot)">${d.runs.length.toLocaleString()}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

          ${h&&h.uptime?`<div class="diag-row"><span class="diag-name">Uptime</span><span class="diag-status">${esc(String(h.uptime))}</span></div>`:''}

// ── Data loading ──────────────────────────────────────────────────────────
function loadDashboard(){
  if(state.dashData.status==='loading')return;
  state.dashData.status='loading';render();
  const api=window.LuakAPI;
  if(!api){state.dashData.status='error';state.dashData.error='LuakAPI not loaded';render();return;}
  Promise.allSettled([
    api.health(),api.leaderboard({limit:20}),api.benchmarks({limit:30}),
    api.models(),api.adapters(),api.providers(),api.tasks()
  ]).then(([h,lb,runs,models,adapters,providers,tasks])=>{
    const prev=state.dashData;
    state.dashData={
      ...prev,
      status:'loaded',
      health:h.status==='fulfilled'?h.value.data:null,
      leaderboard:lb.status==='fulfilled'?(lb.value.data?.leaderboard||lb.value.data?.entries||lb.value.data?.models||[]):[],
      runs:runs.status==='fulfilled'?(runs.value.data?.runs||runs.value.data?.items||(Array.isArray(runs.value.data)?runs.value.data:[])):[],
      models:models.status==='fulfilled'?(models.value.data?.models||(Array.isArray(models.value.data)?models.value.data:[])):[],
      adapters:adapters.status==='fulfilled'?(adapters.value.data?.adapters||(Array.isArray(adapters.value.data)?adapters.value.data:[])):[],
      providers:providers.status==='fulfilled'?(providers.value.data?.providers||(Array.isArray(providers.value.data)?providers.value.data:[])):[],
      tasks:tasks.status==='fulfilled'?(tasks.value.data?.tasks||(Array.isArray(tasks.value.data)?tasks.value.data:[])):[],
      error:null
    };
    render();
  }).catch(err=>{
    state.dashData={...state.dashData,status:'error',error:String(err?.message||err)};render();
  });
}

// ── Interactive cockpit functions ─────────────────────────────────────────
let _ckRunTimer=null;

function ckSelectModel(name){
  state.dashData.selectedModel=name||null;render();
}
function ckSetRunMode(mode){
  state.dashData.runMode=mode;
  state.dashData.selectedTask=null;state.dashData.selectedFamily=null;
  render();
}
function ckSelectTask(taskId){
  state.dashData.selectedTask=taskId||null;render();
}
function ckSelectFamilyForRun(famId){
  state.dashData.selectedFamily=famId||null;render();
}
function ckSetCount(val){
  const n=parseInt(val,10)||5;
  state.dashData.selectedCount=Math.max(1,Math.min(50,n));
}
function ckSetTimingModel(name){
  state.dashData.timingModel=name||null;render();
}

function ckStartRun(){
  const api=window.LuakAPI;if(!api)return;
  const d=state.dashData;
  const model=d.selectedModel||'';
  const runMode=d.runMode||'single';

  function showErr(msg){
    const el=document.getElementById('lc-run-error');
    if(el)el.innerHTML=`<div class="ck-run-error">${esc(msg)}</div>`;
  }
  function clearErr(){const el=document.getElementById('lc-run-error');if(el)el.innerHTML='';}
  function setBtnState(loading){
    const btn=document.getElementById('lc-start-btn');
    if(!btn)return;
    btn.disabled=loading;
    btn.textContent=loading?'⏳ Launching…':(runMode==='family'&&d.selectedFamily?`🏁 RUN ALL ${d.selectedFamily}`:'🏁 START RUN');
  }

  if(!model){showErr('Select a model first');return;}
  clearErr();setBtnState(true);

  let body;
  if(runMode==='family'){
    const family=d.selectedFamily||'';
    if(!family){showErr('Select a test family first');setBtnState(false);return;}
    body={adapter:model,model,task:family,count:1,mode:'family'};
  } else {
    const task=d.selectedTask||'';
    const count=d.selectedCount||5;
    body={adapter:model,model,task,count};
  }

  api.request('/api/runs',{method:'POST',body}).then(res=>{
    setBtnState(false);
    if(!res.ok){showErr(res.error||'Run failed to start');return;}
    const runId=(res.data&&(res.data.id||res.data.run_id))||null;
    const activeRun={id:runId||('local-'+Date.now()),model:body.model,task:body.task,count:body.count||1,done:0,pass:0,fail:0,total:body.count||1,startedAt:Date.now(),output:''};
    state.dashData.activeRuns.push(activeRun);
    render();
    if(runId)ckPollRun(runId,activeRun);
    ckEnsureTimer();
  }).catch(err=>{
    setBtnState(false);showErr(String(err&&err.message||err));
  });
}

function ckRunSuite(){
  const api=window.LuakAPI;if(!api)return;
  const model=state.dashData.selectedModel||'';
  if(!model){alert('Select a model first');return;}
  api.request('/api/run-suite',{method:'POST',body:{model}}).then(res=>{
    if(!res.ok){alert('Suite failed: '+(res.error||'unknown error'));return;}
    const runId=res.data&&(res.data.id||res.data.run_id);
    const activeRun={id:runId||('suite-'+Date.now()),model,task:'Full Suite',done:0,pass:0,fail:0,total:0,startedAt:Date.now(),output:''};
    state.dashData.activeRuns.push(activeRun);render();
    if(runId)ckPollRun(runId,activeRun);ckEnsureTimer();
  });
}

function ckPollRun(id,runObj){
  if(typeof EventSource!=='undefined'){
    try{
      const es=new EventSource((window.LUAK_API_BASE||'')+'/api/runs/'+encodeURIComponent(id)+'/status');
      es.onmessage=function(ev){
        try{
          const data=JSON.parse(ev.data);
          runObj.done=data.done||data.completed||0;runObj.pass=data.pass||data.passed||0;
          runObj.fail=data.fail||data.failed||0;runObj.total=data.total||runObj.total||0;
          runObj.output=data.output||data.last_output||'';
          if(data.status==='done'||data.status==='complete'||data.status==='finished'){es.close();ckFinishRun(runObj);}
        }catch(e){}
      };
      es.onerror=function(){es.close();ckFallbackPollRun(id,runObj);};
      return;
    }catch(e){}
  }
  ckFallbackPollRun(id,runObj);
}
function ckFallbackPollRun(id,runObj){
  function poll(){
    if(!state.dashData.activeRuns.includes(runObj))return;
    window.LuakAPI&&window.LuakAPI.benchmark(id).then(function(res){
      if(!res.ok)return;
      const data=res.data||{};
      runObj.done=data.done||data.completed||data.progress||0;
      runObj.pass=data.pass||data.passed||0;runObj.fail=data.fail||data.failed||0;
      runObj.total=data.total||runObj.total||0;runObj.output=data.output||data.last_output||'';
      if(data.status==='done'||data.status==='complete'||data.status==='finished'){ckFinishRun(runObj);return;}
      setTimeout(poll,2000);
    });
  }
  setTimeout(poll,2000);
}
function ckFinishRun(runObj){
  setTimeout(function(){
    state.dashData.activeRuns=state.dashData.activeRuns.filter(r=>r!==runObj);loadDashboard();
  },10000);
}
function ckEnsureTimer(){
  if(_ckRunTimer)return;
  _ckRunTimer=setInterval(function(){
    if(!state.dashData.activeRuns||!state.dashData.activeRuns.length){clearInterval(_ckRunTimer);_ckRunTimer=null;return;}
    render();
  },1000);
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────
let __pehKeysBound=false;
function pehBindKeys(){
  if(__pehKeysBound)return;__pehKeysBound=true;
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'&&state.pehverse.fastTravel){pehToggleFastTravel(false);return}
    if(e.altKey&&(e.key==='t'||e.key==='T')){e.preventDefault();pehToggleFastTravel()}
    if(e.altKey&&(e.key==='m'||e.key==='M')){e.preventDefault();pehToggleMode()}
  });
}
pehBindKeys();
pehInitProduct();

  const deckMarkup=renderSpeedwayConsole();
  document.getElementById('app').innerHTML=renderPehverse(deckMarkup);
}

// ── Boot ──────────────────────────────────────────────────────────────────
function boot(){
  try{
    if(!state.pehverse.workspaces.length){
      const ws={uid:'ws'+(++state.pehverse.wsSeq),defId:'console',dock:'fullscreen',min:false};
      state.pehverse.workspaces.push(ws);state.pehverse.focus=ws.uid;
    }
    render();
    setTimeout(loadDashboard,0);
  }catch(err){
    const app=document.getElementById('app');
    if(app)app.innerHTML='<div style="padding:24px;color:#f0eaff;font-family:sans-serif">The Speedway could not finish loading. <button onclick="boot()" style="margin-left:8px">Retry</button><pre style="color:#9b8ec4;white-space:pre-wrap;margin-top:12px">'+esc(String(err&&err.stack||err))+'</pre></div>';
  }
}
window.boot=boot;
boot();
