function canonicalBreakdownEntries(run){
  // The breakdown arrives in three shapes depending on source:
  // - /api/runs row: run.breakdown (flat, top-level)
  // - /api/runs/:id/summary: run.outcome.score_breakdown (nested under outcome)
  // - SSE 'complete' payload: run.score.breakdown (run.score is an object here, not a number)
  // All three must resolve to the same four-category order below.
  const scoreObj=run&&typeof run.score==='object'&&run.score?run.score:null;
  const raw=pick(run,'breakdown')||pick(run,'outcome')?.score_breakdown||scoreObj?.breakdown||{};
  const order=['correctness','regression','integrity','efficiency'];
  return order.filter((key)=>raw&&raw[key]!==undefined).map((key)=>{
    const score=scorePct(raw[key]);
    const info=categoryInfo(key);
    return{
      key,
      rawName:key,
      name:info.label,
      explanation:info.description,
      score,
      pass:score>=80?1:0,
      fail:score<55?1:0,
      error:0,
      timeMs:Number(pick(run,'duration_ms','elapsed_ms')||0),
      status:statusWord(score,score<55?'fail':'pass'),
      statusClass:outcomeClass(score,score<55?'fail':'pass'),
      outcome:`${info.label} contributed ${score}% to the canonical run result.`
    };
  });
}

function normalizeRunForDisplay(run){
  // Run payloads arrive in three shapes and the focused panel must bind to
  // all of them from one source of truth:
  //   1. /api/runs row         — flat {score: number, breakdown, tokens_in, cost_usd, ...}
  //   2. /api/runs/:id/summary — nested {outcome: {score, score_breakdown}, usage, target, ...}
  //   3. SSE 'complete' payload — nested {score: {total, breakdown, pass}, target, ...}
  // Hydration also re-normalizes an already-normalized object (overall, operationalRows, ...).
  // The fallback chains below accept all four so overall score never decays to a stale 0.
  const target=pick(run,'target')||{};
  const model=pick(run,'model','modelId','model_name')||target.model||'unknown';
  const provider=pick(run,'provider','providerId')||target.provider||deriveRoutingForModel(model).providerId||'unknown';
  const outcome=pick(run,'outcome')||null;
  const scoreField=run?run.score:undefined;
  const scoreIsObject=scoreField&&typeof scoreField==='object';
  const rawOverall=
    pick(run,'overall_score','composite','avg_score','overall')
    ??(scoreIsObject?undefined:scoreField)
    ??outcome?.score
    ??(scoreIsObject?scoreField.total:undefined);
  const overallKnown=rawOverall!==undefined&&rawOverall!==null&&Number.isFinite(Number(rawOverall));
  const overall=overallKnown?scorePct(rawOverall):0;
  const verdict=normalizedVerdict(run);
  const interpretation=pick(run,'interpretation')||null;
  const poisonEvaluation=pick(run,'poison_evaluation')||outcome?.poison_evaluation||null;
  const benchmarkEvaluation=pick(run,'benchmark_evaluation')||outcome?.benchmark_evaluation||null;
  const buildEvaluation=pick(run,'build_evaluation')||outcome?.build_evaluation||null;
  const safetyEvaluation=pick(run,'safety_evaluation')||outcome?.safety_evaluation||null;
  const memoryEvaluation=pick(run,'memory_evaluation')||outcome?.memory_evaluation||null;
  const personalityEvaluation=pick(run,'personality_evaluation')||outcome?.personality_evaluation||null;
  const verdictPresentation=pick(run,'verdict_presentation')||outcome?.verdict_presentation||null;
  const verdictView=verdictBadge(verdict,overall,{presentation:verdictPresentation,poisonEvaluation,safetyEvaluation,memoryEvaluation});
  const description=pick(run,'model_description','description')||`Run completed through ${provider}.`;
  const rawCategories=pick(run,'category_breakdown','categories','categoryScores')
    ||outcome?.score_breakdown
    ||(scoreIsObject?scoreField.breakdown:null)
    ||[];
  const categories=(Array.isArray(rawCategories)?rawCategories:Object.entries(rawCategories).map(([name,val])=>({name,...(typeof val==='object'?val:{score:val})}))).map((entry)=>{
    const score=scorePct(pick(entry,'score','value','overall'));
    const name=pick(entry,'name','category','label')||'general';
    const info=categoryInfo(name);
    const pass=Number(pick(entry,'pass_count','pass','passed')??(score>=80?1:0));
    const fail=Number(pick(entry,'fail_count','fail','failed')??(score<55?1:0));
    const error=Number(pick(entry,'error_count','errors')??0);
    const timeMs=Number(pick(entry,'time_ms','duration_ms','elapsed_ms')??pick(run,'duration_ms','elapsed_ms')??0);
    const rawSummary=pick(entry,'message','detail','summary','failure_reason','what_failed');
    return{
      key:normalizeKey(name),
      rawName:name,
      name:info.label,
      explanation:info.description,
      score,
      pass,
      fail,
      error,
      timeMs,
      status:statusWord(score,pick(entry,'status')),
      statusClass:outcomeClass(score,pick(entry,'status')),
      outcome:buildFailureText(entry,score,rawSummary)
    };
  });
  // Conversational bundles (the per-question format used by classification,
  // reasoning, truthfulness, context-degradation tasks) don't store
  // task_results — the per-question failures live on the timeline as
  // `error` events with a `detail` string like
  // "CL1-Q1: FAIL — Response did not match pattern /\\bbug\\b/. Got: …".
  // Surface those so the user doesn't end up staring at a single
  // "Run completed through minimax" row with no explanation of which
  // question failed or why.
  const timelineErrors=Array.isArray(pick(run,'timeline'))
    ?pick(run,'timeline').filter((e)=>e&&e.type==='error'&&typeof e.detail==='string')
    :[];
  const details=(Array.isArray(pick(run,'task_results','results','items','tests'))?pick(run,'task_results','results','items','tests'):[]).map((item)=>{
    const score=scorePct(pick(item,'score','overall_score'));
    const status=pick(item,'status')||(pick(item,'pass')===true?'pass':pick(item,'pass')===false?'fail':'review');
    return{
      id:pick(item,'id','task_id','name')||`detail-${Math.random().toString(36).slice(2,8)}`,
      name:humanizeToken(pick(item,'task','task_id','name','id')||'Task'),
      score,
      status:statusWord(score,status),
      statusClass:outcomeClass(score,status),
      message:buildFailureText(item,score,pick(item,'message','detail','summary')||''),
      timeMs:Number(pick(item,'time_ms','duration_ms','elapsed_ms')||0),
      latencyMs:Number(pick(item,'latency_ms','time_ms','duration_ms','elapsed_ms')||0),
      cost:Number(pick(item,'cost_usd','estimated_cost_usd')||0),
      prompt:pick(item,'prompt','question','input','user_prompt','query')||'',
      answer:pick(item,'answer','response','output','model_answer','assistant_response')||'',
      expected:pick(item,'expected','expected_answer','threshold','pass_condition','rubric','oracle')||'',
      errorText:pick(item,'error','error_text','stderr','failure_reason')||'',
      reason:pick(item,'reason','failure_reason','pass_reason','judge_note')||'',
      evidence:pick(item,'evidence','notes','judge_evidence','diff','excerpt')||''
    };
  });
  const fallbackCategory=categoryInfo('workflow');
  const breakdownEntries=canonicalBreakdownEntries(run);
  return{
    id:pick(run,'bundle_id','run_id','id')||`${model}-${Date.now()}`,
    runId:pick(run,'bundle_id','run_id','id')||'',
    bundleId:pick(run,'bundle_id','run_id','id')||'',
    bundleHash:pick(run,'bundle_hash')||'',
    model,
    provider,
    description,
    overall,
    verdict,
    verdictPresentation,
    verdictLabel:verdictView.label,
    verdictSummary:verdictView.summary,
    verdictClass:verdictView.cls,
    verdictOriginCls:verdictView.originCls,
    verdictGlyph:verdictView.glyph,
    verdictHint:verdictView.hint,
    interpretation,
    poisonEvaluation,
    benchmarkEvaluation,
    buildEvaluation,
    safetyEvaluation,
    memoryEvaluation,
    personalityEvaluation,
    completionState:verdictView.state,
    failureOrigin:verdictView.origin,
    isModelFailure:!!verdictView.isModelFailure,
    isInfraIssue:!!verdictView.isInfra,
    isTestOrJudgeIssue:!!verdictView.isTestOrJudge,
    categories:categories.length?categories:(breakdownEntries.length?breakdownEntries:[{
      key:'workflow',
      rawName:'workflow',
      name:fallbackCategory.label,
      explanation:fallbackCategory.description,
      score:overall,
      pass:overall>=80?1:0,
      fail:overall<55?1:0,
      error:0,
      timeMs:Number(pick(run,'duration_ms','elapsed_ms')||0),
      status:statusWord(overall,pick(run,'pass')===false?'fail':'pass'),
      statusClass:outcomeClass(overall,pick(run,'pass')===false?'fail':'pass'),
      outcome:buildFailureText(run,overall,pick(run,'summary','message')||description),
      synthetic:true
    }]),
    operationalRows:[{
      model,
      efficiency:scorePct(pick(run,'breakdown')?.efficiency||outcome?.score_breakdown?.efficiency||(scoreIsObject?scoreField.breakdown?.efficiency:undefined)||pick(run,'efficiency_score','value_score')),
      tokensIn:Number(pick(run,'tokens_in')??pick(run,'usage')?.tokens_in??0),
      tokensOut:Number(pick(run,'tokens_out')??pick(run,'usage')?.tokens_out??0),
      cost:Number(pick(run,'cost_usd')??pick(run,'usage')?.estimated_cost_usd??0),
      correctness:scorePct(pick(run,'breakdown')?.correctness||outcome?.score_breakdown?.correctness||(scoreIsObject?scoreField.breakdown?.correctness:undefined)||pick(run,'correctness'))
    }],
    recommendations:Array.isArray(pick(run,'recommendations','findings','actionable_findings'))&&pick(run,'recommendations','findings','actionable_findings').length?pick(run,'recommendations','findings','actionable_findings'):[overall>=80?'This run is strong enough to keep in the preferred pool.':'This run needs attention before it should be trusted.'],
    details:details.length
      ?details
      :timelineErrors.length
        ?timelineErrors.map((event,idx)=>{
          const detail=String(event.detail||'');
          // Conversational error lines are usually "QID: VERDICT — reason … Got: answer"
          // Split on em-dash first, then on " Got: " to separate the judge's reason
          // from what the model actually said. Also extract the QID
          // and any pattern /.../ so the focused-run sub-question card
          // can show them as separately-labeled fields (prevents the
          // 425-vs-6 cross-read failure mode the operator hit).
          const labelSplit=detail.split(/\s[—-]\s/);
          const label=labelSplit[0]||`Step ${idx+1}`;
          const rest=labelSplit.slice(1).join(' — ');
          const gotSplit=rest.split(/\bGot:\s*/);
          const reason=gotSplit[0]?.trim()||rest||detail;
          const answer=gotSplit.slice(1).join('Got: ').trim();
          const qidMatch=label.match(/^([A-Z]+\d+-Q\d+|[A-Za-z0-9_-]+)/);
          const qid=qidMatch?qidMatch[1]:'';
          const patternMatch=detail.match(/pattern\s+(\/[^/]+\/[a-z]*)/i);
          const expected=patternMatch?patternMatch[1]:'';
          return{
            id:`tl-${idx}`,
            name:label.replace(/:\s*FAIL\s*$/i,''),
            score:0,
            status:'FAIL',
            statusClass:'fail',
            message:reason,
            reason,
            answer,
            prompt:'',
            expected,
            errorText:'',
            evidence:'',
            timeMs:Number(event.t||0),
            latencyMs:0,
            cost:0,
            // Sub-question metadata for the focused-run inspector.
            subQuestion:{
              qid,
              expectedPattern:expected,
              modelAnswer:answer,
              reason,
              rawDetail:detail
            }
          };
        })
        :[{name:humanizeToken(pick(run,'task_id','task')||'Run'),score:overall,status:statusWord(overall,pick(run,'pass')===false?'fail':'pass'),statusClass:outcomeClass(overall,pick(run,'pass')===false?'fail':'pass'),message:buildFailureText(run,overall,pick(run,'summary','message')||description),timeMs:Number(pick(run,'duration_ms','elapsed_ms')||0)}],
    timestamp:pick(run,'timestamp','created_at')||pick(run,'timing')?.started_at,
    task:pick(run,'task_id','task')||'batch',
    pass:pick(run,'pass')??outcome?.pass??(scoreIsObject?scoreField.pass:undefined),
    overallKnown,
    family:pick(run,'family'),
    difficulty:pick(run,'difficulty'),
    passThreshold:scorePct(pick(run,'pass_threshold')||pick(run,'outcome')?.pass_threshold),
    judge:pick(run,'judge')||{},
    oracleIntegrity:pick(run,'oracle_integrity')||{},
    benchmarkProvenance:pick(run,'benchmark_provenance')||pick(run,'task')?.benchmark_provenance||{},
    // Judge model spend, separate from tested-model spend. Always defined so
    // the UI can render "Judge cost: $0 (deterministic)" without branching.
    judgeUsage:pick(run,'judge_usage')||{provider:'',model:'',tokens_in:0,tokens_out:0,estimated_cost_usd:0,kind:'deterministic',note:'deterministic judge — no model cost'},
    trust:pick(run,'trust')||{},
    reviewSecurity:pick(run,'review_security')||{},
    secondOpinionStatus:pick(run,'second_opinion_status')||'skipped',
    qcReviewStatus:pick(run,'qc_review_status')||'skipped',
    schema:pick(run,'schema')||'crucibulum.evaluation.summary.v1',
    suiteId:pick(run,'suite_id')||'v1',
    authority:pick(run,'authority')||{}
  };
}

function runEligibilityMeta(run){
  const n=run?.n||run||{};
  const raw=run?.raw||run||{};
  const trust=n.trust||raw.trust||{};
  const verdict=n.verdict||raw.verdict||{};
  const score=n.score||raw.score||{};
  const reasons=[];
  let isPreFixInflated=false;
  let isNotCountedTowardScore=false;

  // Verdict-level exclusions (NC, not counted)
  const cs=String(verdict.completionState||'').toUpperCase();
  const origin=String(verdict.failureOrigin||'').toUpperCase();
  if(verdict.countsTowardModelScore===false){
    isNotCountedTowardScore=true;
    reasons.push(`NOT COUNTED — ${origin||cs||'excluded by verdict'}`);
  }
  // Pre-fix inflation: C=0 but total score >= 10% and NC/PROVIDER
  const correctness=typeof score.breakdown?.correctness==='number'?score.breakdown.correctness:(typeof score.correctness==='number'?score.correctness:-1);
  const total=typeof score.total==='number'?score.total:0;
  if(correctness===0&&total>=0.10&&(cs==='NC'||origin==='PROVIDER')){
    isPreFixInflated=true;
    reasons.push('PRE-FIX HISTORICAL — inflated score with zero correctness');
  }

  // Trust signature checks
  const sig=String(trust.bundle_signature_status||'legacy_unverified').toLowerCase();
  const values=[n.adapter,n.provider,n.model,raw.adapter,raw.provider,raw.model,raw.target?.adapter,raw.target?.provider,raw.target?.model]
    .map(v=>String(v||'').toLowerCase());
  const isMock=values.some(v=>v.includes('harness-mock')||v.includes('mock')||v.includes('demo'));
  const verified=trust.bundle_verified===true&&(trust.bundle_authenticated===true||trust.bundle_authenticated===undefined)&&sig==='valid'&&!isMock;

  const ranked=verified&&!isNotCountedTowardScore&&!isPreFixInflated;
  let label,cls;
  if(ranked){label='ELIGIBLE FOR PUBLIC RANKING';cls='teal';}
  else if(isPreFixInflated){label='PRE-FIX HISTORICAL · NOT RANKED';cls='red';}
  else if(isNotCountedTowardScore){label='NOT COUNTED · '+origin;cls='warn';}
  else if(isMock){label='MOCK/DEMO · NOT RANKED';cls='dim';}
  else if(sig==='tampered'||sig==='forged'){label='TAMPERED · NOT RANKED';cls='red';}
  else if(sig==='legacy_unverified'){label='LEGACY · UNVERIFIED · NOT RANKED';cls='warn';}
  else if(sig==='unsigned_key_missing'){label='UNSIGNED · NOT RANKED';cls='warn';}
  else{label='UNVERIFIED · NOT RANKED';cls='warn';}
  return{ranked,label,cls,reasons,isPreFixInflated,isNotCountedTowardScore};
}

function isRecommendableEntry(entry){
  if(!entry)return false;
  const overall=safeNum(entry.avgOverall||entry.composite||0);
  if(overall<=0)return false;
  // passRate is null when the backend didn't supply it (no data ≠ proven zero).
  // Only reject when passRate is explicitly 0 (proven zero passes).
  const pr=entry.passRate??entry.average_pass_rate;
  if(pr!==null&&pr!==undefined&&safeNum(pr)<=0)return false;
  return true;
}

function laneHealthSignals(tabKey){
  const data=state.tabData[tabKey]||{};
  const stats=data.stats||{};
  const runs=data.runs||[];
  const leaderboard=data.leaderboard||[];
  const signals=[];
  const totalRuns=safeNum(stats.total_runs||runs.length);
  const passRate=safeNum(stats.pass_rate);
  const ncRate=safeNum(stats.nc_rate);
  // small_sample: any model under sample threshold
  if(leaderboard.some(e=>e.sampleAdequate===false||e.sample_adequate===false)){
    signals.push({kind:'small_sample',severity:'warn',label:'SMALL SAMPLE',detail:'One or more models have fewer runs than the minimum sample threshold.'});
  }
  // all_nc: every run is NC (provider/network outage)
  if(totalRuns>0&&ncRate>=100){
    signals.push({kind:'all_nc',severity:'critical',label:'ALL NC',detail:'Every run in this lane ended in a provider or network outage. No model behavior was observed.'});
  }
  // all_failed: runs exist but pass rate is 0 (not due to NC)
  if(totalRuns>0&&passRate===0&&ncRate<100){
    signals.push({kind:'all_failed',severity:'critical',label:'ALL FAILED',detail:'Every scorable run in this lane failed. No model passed any task.'});
  }
  // stale_historical: any run with pre-fix inflation shape
  const hasStale=runs.some(r=>{
    const v=r.verdict||{};const s=r.score||{};
    const c=typeof s.breakdown?.correctness==='number'?s.breakdown.correctness:-1;
    const t=typeof s.total==='number'?s.total:0;
    return c===0&&t>=0.10&&(String(v.completionState).toUpperCase()==='NC'||String(v.failureOrigin).toUpperCase()==='PROVIDER');
  });
  if(hasStale){
    signals.push({kind:'stale_historical',severity:'warn',label:'STALE HISTORICAL',detail:'Lane contains pre-fix runs with inflated scores (zero correctness but non-zero total).'});
  }
  return signals;
}

async function hydrateFocusedRun(tabKey,runId){
  try{
    // Full bundle endpoint — gives us both the summary (scores, pass/fail)
    // and the raw bundle (timeline with per-question error detail). The
    // drilldown view leans on the timeline to show why each question failed;
    // the /summary-only endpoint strips it, which is why the failure panel
    // ended up showing a single generic "Run completed through minimax" row.
    const res=await fetchJSON(`/api/runs/${encodeURIComponent(runId)}`);
    if(!res?.summary&&!res?.bundle)return;
    const current=state.focusedResult[tabKey];
    if(!current||String(current.runId)!==String(runId))return;
    const timeline=res.bundle?.timeline||res.summary?.timeline;
    state.focusedResult[tabKey]=normalizeRunForDisplay({...current,...(res.summary||{}),...(timeline?{timeline}:{})});
    render();
  }catch{}
}

function setFocusedRun(tabKey,run){
  const normalized=normalizeRunForDisplay(run);
  state.focusedResult[tabKey]=normalized;
  render();
  if(normalized.runId)hydrateFocusedRun(tabKey,normalized.runId);
}

function toggleSection(name){state.collapsed[name]=!state.collapsed[name];render()}

// watchRunCompletion resolves with a structured outcome the caller can route
// into counters. Three outcomes matter:
//   {executed:true, pass:bool}   — SSE complete event fired → bundle stored
//   {executed:false, reason:str} — SSE error fired or stream lost → no bundle
// Conflating these was the core integrity bug: the UI treated "error" as
// "ran and failed" and ticked batchDone regardless. Now "did not run" is
// explicit and bubbles to progress display.
function watchRunCompletion(tabKey,runId,taskId,modelId){
  return new Promise((resolve)=>{
    // Launch trace — survives the run lifecycle and is dumped to console
    // on terminal so an operator can paste a single line back when something
    // is mis-classified. Per-run id keeps watchers isolated.
    const trace={runId,taskId,modelId,t0:Date.now(),events:[]};
    const trace_push=(ev,detail)=>{trace.events.push({t:Date.now()-trace.t0,ev,...(detail?{detail}:{})})};
    trace_push('sse_open');
    const source=new EventSource(`/api/run/${encodeURIComponent(runId)}/live`);
    let started=false;
    const dumpTrace=(finalLabel)=>{
      trace_push('end',finalLabel);
      // eslint-disable-next-line no-console
      try{console.info(`[run-trace] ${taskId} :: ${modelId} :: ${runId} → ${finalLabel}`,trace.events)}catch{}
    };
    source.addEventListener('step',(event)=>{
      try{
        const payload=JSON.parse(event.data);
        const line=payload.detail||payload.type||'Step';
        if(payload.type==='task_start'&&!started){
          started=true;
          trace_push('task_start');
          updateBatchItem(tabKey,taskId,modelId,{status:'started',runId,startedAt:new Date().toISOString()});
          setRunPhase(tabKey,'executing');
          pushRunEvent(tabKey,'exec',`Executing ${humanizeToken(taskId)} · ${modelId}`);
        }
        if(state.runState[tabKey]){
          state.runState[tabKey].currentTaskId=taskId;
          state.runState[tabKey].currentModelId=modelId;
        }
        if(payload.type==='task_error'){
          updateBatchItem(tabKey,taskId,modelId,{reason:payload.detail||'Run failed after launch.'});
          pushRunEvent(tabKey,'fail',`Error in ${humanizeToken(taskId)}: ${(payload.detail||'').slice(0,80)}`);
        }
        state.runState[tabKey].lines.push(`[${taskId} :: ${modelId}] ${line}`);
        render();
      }catch{}
    });
    source.addEventListener('complete',async(event)=>{
      source.close();
      trace_push('sse_complete');
      setRunPhase(tabKey,'judging');
      const payload=JSON.parse(event.data);
      const normalized=normalizeRunForDisplay({...payload,bundle_id:runId,task_id:taskId,model:modelId});
      const verdict=normalized.verdictLabel||((normalized.pass===false)?'FAIL':'PASS');
      pushRunEvent(tabKey,'judge',`Judged ${verdict} · ${normalized.overall}% · ${humanizeToken(taskId)}`);
      state.runState[tabKey].lines.push(`[${taskId} :: ${modelId}] ${verdict} at ${normalized.overall}%`);
      state.focusedResult[tabKey]=normalized;
      const family=taskFamilyLabel(taskId,normalized.family);
      const liveEntry={taskId,modelId,family,overall:normalized.overall,categories:topCategoryTags(normalized.categories,3),statusClass:normalized.overall>=80?'pass':normalized.overall>=55?'warn':'fail'};
      state.runState[tabKey].recentCompletions=[liveEntry,...(state.runState[tabKey].recentCompletions||[])].slice(0,6);
      state.runState[tabKey].completedFamilies=Array.from(new Set([...(state.runState[tabKey].completedFamilies||[]),family]));
      updateBatchItem(tabKey,taskId,modelId,{status:'completed',runId,pass:normalized.completionState==='PASS',completedAt:new Date().toISOString(),reason:normalized.verdictSummary||''});
      setRunPhase(tabKey,'recording');
      pushRunEvent(tabKey,'record','Recorded evidence bundle');
      await refreshRunSurfaces(tabKey);
      render();
      dumpTrace('completed');
      resolve({status:'completed',executed:true,started:true,pass:normalized.completionState==='PASS',payload});
    });
    source.addEventListener('error',(event)=>{
      source.close();
      trace_push('sse_error',typeof event.data==='string'?'data':'connection-close');
      // CATCH_ALL is the visible reason of last resort. Any structured
      // signal — server-sent payload, polling /status, /api/runs hydration —
      // must replace it before we show anything to the operator. Several
      // earlier shapes of this handler fell through to the catch-all when a
      // structured signal was present-but-partial (e.g. payload.error empty,
      // /status returned non-2xx). That produced the operator-reported
      // "Could not start · STREAM · Run stream interrupted" rows for runs
      // that had really failed at health-check / adapter-init / rate-limit.
      const CATCH_ALL='Run stream interrupted — no evidence bundle produced.';
      let reason=CATCH_ALL;
      let stage='stream';
      let classification=started?'failed':'could_not_start';
      let parsed=false;
      let providerError=null;
      // `originalPayload` is what the server emitted on this SSE error
      // event (if anything). The polling fallback uses it as the source
      // of truth when /status or /api/runs themselves fail — without
      // this, we'd lose the structured cause and report "Run state
      // unreachable" instead.
      let originalPayload=null;
      try{
        const payload=JSON.parse(event.data);
        // Replace each field individually so a payload with *some* structure
        // but a blank `error` still surfaces stage/classification/provider_error
        // instead of the catch-all.
        if(payload&&typeof payload==='object'){
          originalPayload=payload;
          if(typeof payload.error==='string'&&payload.error.trim())reason=payload.error;
          else if(typeof payload.reason==='string'&&payload.reason.trim())reason=payload.reason;
          if(typeof payload.stage==='string'&&payload.stage)stage=payload.stage;
          if(typeof payload.classification==='string'&&payload.classification)classification=payload.classification;
          if(payload.provider_error)providerError=payload.provider_error;
          // If reason is still the catch-all but we *did* parse a structured
          // payload, synthesise a non-generic reason from stage/classification
          // so the operator sees the cause class even when the server omitted
          // a free-form message.
          if(reason===CATCH_ALL&&(stage!=='stream'||classification!=='could_not_start')){
            reason=`Run ${classification.replace(/_/g,' ')} at ${stage}`;
          }
          parsed=true;
        }
      }catch{}
      const finish=(finalStatus,finalReason,finalStage,finalProviderError)=>{
        trace_push('finish',`${finalStatus}/${finalStage}`);
        updateBatchItem(tabKey,taskId,modelId,{status:finalStatus,runId,reason:finalReason,providerError:finalProviderError||providerError||null,stage:finalStage||stage||null,completedAt:new Date().toISOString()});
        state.runState[tabKey].lines.push(`[${taskId} :: ${modelId}] ${finalStatus==='failed'?'FAILED':'DID NOT RUN'} — ${finalReason}`);
        const kind=finalStatus==='skipped_by_preflight'?'skip':'fail';
        const verb=finalStatus==='skipped_by_preflight'?'Skipped':(finalStatus==='failed'?'Failed':'Could not start');
        // Map raw reason → categorized label so the feed shows *why*, not just a
        // stack trace. Auth / timeout / network / upstream are the cases the
        // user can actually act on.
        const category=classifyError({message:finalReason,reason:finalReason,provider_error:finalProviderError||providerError},finalStage);
        const label=failureReasonLabel(category);
        pushRunEvent(tabKey,kind,`${verb} ${humanizeToken(taskId)} · ${label} · ${String(finalReason||'').slice(0,80)}`);
        render();
        dumpTrace(`${finalStatus}/${finalStage}`);
        resolve({status:finalStatus,executed:false,started,pass:false,reason:finalReason,stage:finalStage,category});
      };
      if(parsed){
        const finalStatus=(classification==='skipped_by_preflight'?'skipped_by_preflight':(started||classification==='failed')?'failed':'could_not_start');
        finish(finalStatus,reason,stage,providerError);
        return;
      }
      // Connection-level SSE error with no parseable data. The run may still be
      // mid-flight on the server (fast runs can finish before the EventSource
      // fully attaches, or the server's res.end() after sending all events can
      // race with the client's event dispatch order). Poll /status until it
      // settles instead of giving up immediately — otherwise the for-loop above
      // fires the next task while the current one is still running, the same
      // SSE race repeats, and a whole batch can collapse into "could_not_start"
      // while bundles quietly land on disk.
      const reconcileCompleted=async(status)=>{
        const stored=await fetchJSON(`/api/runs/${encodeURIComponent(status.bundle_id)}`).catch(()=>null);
        const pass=stored?.bundle?.score?.pass===true||stored?.score?.pass===true||status?.aggregate?.pass===true;
        updateBatchItem(tabKey,taskId,modelId,{status:'completed',runId,pass,completedAt:new Date().toISOString()});
        state.runState[tabKey].lines.push(`[${taskId} :: ${modelId}] Stream closed after completion — reconciling from status endpoint.`);
        // Refresh tabData so the new bundle shows up in stats/leaderboard/runs.
        await refreshRunSurfaces(tabKey);
        render();
        resolve({status:'completed',executed:true,started:true,pass,reconciled:true});
      };
      // Polling cadence: 1.5 s. Conservative enough to stay under the
      // server's own RATE_READ limit (120/min ≈ 2/s) by a comfortable
      // margin. The old 300ms interval tripped RATE_READ during long
      // polling fallbacks and produced "Run state unreachable — /status
      // query failed (rate_limited)" rows — that was the server telling
      // us to slow down, not the run failing.
      const POLL_INTERVAL_MS=1500;
      // 5-minute budget: a 10-question conversational task (role-stress-001)
      // on a slow cloud model can legitimately need ~100s end-to-end. The
      // server now sends SSE heartbeats every 10s so the connection rarely
      // drops, but if it does the polling fallback must outlast the run —
      // the old 45s ceiling fired BEFORE the run finished and the UI
      // wrongly reported "Run stream interrupted — no evidence bundle
      // produced" while the bundle was still being written.
      const POLL_BUDGET_MS=300000;
      const pollStart=Date.now();
      const pollOnce=()=>{
        fetchJSON(`/api/run/${encodeURIComponent(runId)}/status`).then((status)=>{
          if(status?.status==='complete'&&status?.bundle_id){
            trace_push('poll_status_complete',status.bundle_id);
            reconcileCompleted(status);
            return;
          }
          if(status?.status==='error'){
            trace_push('poll_status_error',status?.failure_stage||'unknown');
            const finalStatus=(status?.failure_stage==='execution'||started)?'failed':'could_not_start';
            finish(finalStatus,status?.error||reason,status?.failure_stage||stage,status?.provider_error||providerError);
            return;
          }
          // status is still 'running' — keep polling until budget exhausted.
          if(Date.now()-pollStart<POLL_BUDGET_MS){
            setTimeout(pollOnce,POLL_INTERVAL_MS);
            return;
          }
          // Budget exhausted. Before reporting an interrupted stream, try
          // one more thing: the bundle may have landed on disk while we
          // were waiting (long conversational task that finished after
          // the SSE dropped). The status endpoint already falls through
          // to the persisted bundle when the in-memory entry is GC'd, so
          // a fresh /status check here is the final reconciliation.
          const honestReason=started
            ?'Run timed out waiting for completion after SSE disconnect.'
            :'Run could not be observed — SSE disconnected before any task_start event.';
          finish(started?'failed':'could_not_start',honestReason,stage,providerError);
        }).catch(async (err)=>{
          // Our OWN server's read rate limit returned 429? Don't escalate
          // to "unreachable" — back off and keep polling. fetchJSON
          // surfaces the response body on err.body for 4xx/5xx, and the
          // server's rate-limited payload is shaped
          // {error:'rate_limited', rule:'read', retry_after_sec}.
          const isReadRateLimit=err&&err.status===429&&err.body&&err.body.error==='rate_limited'&&err.body.rule==='read';
          if(isReadRateLimit&&Date.now()-pollStart<POLL_BUDGET_MS){
            const waitSec=Math.max(1,Number(err.body.retry_after_sec)||5);
            trace_push('poll_self_rate_limited',`waiting ${waitSec}s`);
            pushRunEvent(tabKey,'info',`Status polling rate-limited; backing off ${waitSec}s`);
            setTimeout(pollOnce,waitSec*1000);
            return;
          }
          // /status itself failed. Before falling back to the catch-all,
          // try one last lookup against /api/runs/<runId> — the bundle may
          // be on disk (and now reachable by run_id thanks to the previous
          // identity fix and the minimal-failure-bundle write on the
          // server). This is the path that previously hit the catch-all
          // and produced "Run stream interrupted" / "Run state unreachable"
          // rows.
          try{
            const stored=await fetchJSON(`/api/runs/${encodeURIComponent(runId)}`);
            if(stored?.bundle?.bundle_id){
              const pass=stored.bundle.score?.pass===true;
              // Minimal failure bundles record `failure_mode` like
              // 'could_not_start/health_check' and ship without a real
              // score — surface that as a structured failure, NOT a fake
              // "completed". Honest receipt > silent recovery.
              const failureMode=stored.bundle.diagnosis?.failure_mode;
              if(failureMode&&typeof failureMode==='string'&&failureMode.includes('/')){
                const [cls,stg]=failureMode.split('/');
                const failReason=stored.bundle.timeline?.[0]?.detail||stored.bundle.usage?.provider_cost_note||`Pre-execution failure at ${stg}`;
                finish(cls||'could_not_start',failReason,stg||stage,stored.bundle.provider_attempts?.[0]?.provider_error||providerError);
                return;
              }
              updateBatchItem(tabKey,taskId,modelId,{status:'completed',runId,pass,completedAt:new Date().toISOString()});
              state.runState[tabKey].lines.push(`[${taskId} :: ${modelId}] Reconciled from /api/runs after /status fetch failed.`);
              await refreshRunSurfaces(tabKey);
              render();
              dumpTrace('completed-via-runs-hydration');
              resolve({status:'completed',executed:true,started:true,pass,reconciled:true});
              return;
            }
          }catch(hyderr){
            // Bundle lookup also failed — distinguish "removed by retention"
            // (server says 404 with a structured reason) from "really gone".
            const body=hyderr&&hyderr.body;
            const retentionReason=(body&&typeof body==='object'&&body.error==='Evidence removed by retention')
              ? `Evidence removed by retention. ${body.reason||''}`
              : null;
            if(retentionReason){
              finish(started?'failed':'could_not_start',retentionReason,'retention',providerError);
              return;
            }
          }
          // Last resort. If the original SSE error frame WAS structured
          // (parsed=true), use it as the source of truth — that beats
          // "Run state unreachable" for the exact case the operator
          // reported: a known RATE_LIMIT failure where /status itself
          // got rate-limited by our read bucket and /api/runs hadn't
          // yet learned about the bundle. Without this branch we drop
          // the structured cause we already had in hand.
          if(parsed&&originalPayload){
            finish(classification,reason,stage,providerError);
            return;
          }
          const errLabel=err&&(err.message||err.status)?String(err.message||err.status):'unknown';
          finish(started?'failed':'could_not_start',`Run state unreachable — /status query failed (${errLabel}) and no evidence bundle was found.`,stage,providerError);
        });
      };
      pollOnce();
    });
  });
}

// runSingle distinguishes three failure points:
//   1. POST /api/run rejected (e.g. 422 adapter_cannot_run_task) → did NOT run
//   2. POST accepted but SSE never delivers 'complete' → did NOT run
//   3. POST accepted, SSE 'complete' fired → ran (pass may be true or false)
async function runSingle(tabKey,taskId,modelId){
  const routing=deriveRoutingForModel(modelId);
  let result;
  try{
    result=await fetchJSON('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:taskId,adapter:routing.adapterId,provider:routing.providerId,model:modelId,count:1})});
  }catch(err){
    // 422 adapter_cannot_run_task lands here with a structured body; surface the reason.
    const body=err&&err.body;
    const reason=(body&&(body.reason||body.error))||(err&&err.message)||'POST /api/run rejected';
    const status=err&&err.status===422?'skipped_by_preflight':'could_not_start';
    // POST-time failures don't carry a server-emitted structured provider
    // error yet (the run never got past route validation), but err.body can
    // echo one back from handlers that set it. Pass through so the reason
    // row can still render origin/kind chips when available.
    const postProviderError=(body&&(body.provider_error||body.providerError))||null;
    updateBatchItem(tabKey,taskId,modelId,{status,reason,providerError:postProviderError,stage:'preflight',completedAt:new Date().toISOString()});
    state.runState[tabKey].lines.push(`[${taskId} :: ${modelId}] DID NOT RUN — ${reason}`);
    const kind=status==='skipped_by_preflight'?'skip':'fail';
    const verb=status==='skipped_by_preflight'?'Skipped':'Could not start';
    const category=classifyError(err,status==='skipped_by_preflight'?'preflight':undefined);
    const label=failureReasonLabel(category);
    pushRunEvent(tabKey,kind,`${verb} ${humanizeToken(taskId)} · ${label} · ${String(reason||'').slice(0,80)}`);
    return {status,executed:false,started:false,pass:false,reason,category};
  }
  updateBatchItem(tabKey,taskId,modelId,{status:'queued',runId:result.run_id,reason:''});
  state.runState[tabKey].status='running';
  state.runState[tabKey].runId=result.run_id;
  state.runState[tabKey].lines.push(`Queued ${taskId} on ${modelId}.`,`Run ID: ${result.run_id}`);
  render();
  return watchRunCompletion(tabKey,result.run_id,taskId,modelId);
}

async function resetAdapterCircuits(modelIds){
  // A fresh user-initiated batch shouldn't be blocked by a circuit that
  // opened during a previous session. Best-effort — failures here are
  // harmless; the run path still enforces the circuit on live failures.
  const adapters=new Set(modelIds.map((m)=>deriveRoutingForModel(m).adapterId).filter(Boolean));
  await Promise.all(Array.from(adapters).map((a)=>
    fetchJSON(`/api/adapters/${encodeURIComponent(a)}/reset-circuit`,{method:'POST'}).catch(()=>null)
  ));
}

// ─── Provider rate-limit cooldown ─────────────────────────────────────────
//
// When a provider rate-limits us, we don't want to keep hammering. The
// cooldown manager tracks per-provider/model rate-limit history during a
// batch and exposes:
//   - shouldRetry(outcome): does this outcome warrant a bounded retry?
//   - retryDelayMs(key, outcome): how long to wait before the retry?
//   - noteHit(key, outcome) / noteRecovery(key): bookkeeping
//
// The state is intentionally batch-local — a fresh batch resets it via
// `createCooldownState`. Across batches an operator's behaviour change
// (different model, different time of day) is a clean slate.

const RATE_LIMIT_RETRY_ENABLED=true;
const RATE_LIMIT_MAX_RETRIES=1;
// Backoff tuned from observation: a 10–15s wait wasn't long enough to
// clear OpenRouter/DeepSeek-V4-Pro rate-limit windows in real sessions —
// the operator still saw rate-limits even after 12s and 22s waits. Bumped
// to 30s / 60s / 120s with 180s ceiling so the second retry has a fighting
// chance against per-minute provider quotas.
const RATE_LIMIT_BACKOFF_MIN_MS=30_000;
const RATE_LIMIT_BACKOFF_MAX_MS=180_000;
const RATE_LIMIT_BACKOFF_FACTOR=2;

function createCooldownState(){return{byKey:new Map(),totalCooldownMs:0,totalHits:0,totalRetries:0,totalRecoveries:0}}

function cooldownKey(taskId,modelId){
  const routing=deriveRoutingForModel(modelId);
  // Provider+model is granular enough that a rate limit on
  // openrouter/deepseek-v4-pro doesn't pause openrouter/grok-4.3.
  return `${routing.adapterId||'unknown'}/${routing.providerId||'unknown'}/${modelId}`;
}

function isRateLimitOutcome(outcome){
  if(!outcome)return false;
  if(outcome.executed)return false;
  // Server's structured payload — UI's runSingle / watchRunCompletion stash it.
  const pe=outcome.providerError||outcome.provider_error;
  if(pe){
    if(pe.kind==='RATE_LIMIT')return true;
    if(pe.statusCode===429)return true;
  }
  // Defensive: text classifier might call it "rate_limited" via classifyError.
  if(outcome.category==='rate_limited')return true;
  // Last-ditch: reason string contains "rate limit" / "429". Avoids false
  // positives by requiring the actual signal token, not a fragment.
  const r=String(outcome.reason||'').toLowerCase();
  if(/\b(rate[ _-]?limit(ed|ing)?|too[ _-]many[ _-]requests)\b/.test(r))return true;
  if(/\b429\b/.test(r))return true;
  return false;
}

function retryAfterFromOutcome(outcome){
  const pe=outcome&&(outcome.providerError||outcome.provider_error);
  if(pe&&typeof pe.retryAfterSec==='number'&&pe.retryAfterSec>=0)return pe.retryAfterSec;
  if(pe&&pe.retryAfterSec===null)return null;
  return null;
}

function computeCooldownMs(consecutiveCount,retryAfterSec){
  const safe=Math.max(1,Math.floor(consecutiveCount));
  if(typeof retryAfterSec==='number'&&Number.isFinite(retryAfterSec)&&retryAfterSec>=0){
    return Math.max(RATE_LIMIT_BACKOFF_MIN_MS,Math.min(RATE_LIMIT_BACKOFF_MAX_MS,Math.ceil(retryAfterSec*1000)));
  }
  const base=RATE_LIMIT_BACKOFF_MIN_MS*Math.pow(RATE_LIMIT_BACKOFF_FACTOR,safe-1);
  const capped=Math.min(RATE_LIMIT_BACKOFF_MAX_MS,base);
  const jitter=(Math.random()*2-1)*capped*0.2;
  return Math.max(RATE_LIMIT_BACKOFF_MIN_MS,Math.min(RATE_LIMIT_BACKOFF_MAX_MS,Math.round(capped+jitter)));
}

async function cooldownSleep(tabKey,ms,reason){
  // Abort-aware sleep. Polls the batchAbort flag every 250 ms so the
  // operator's stop button (if any) wakes the wait without dropping the
  // entire run loop.
  const start=Date.now();
  const deadline=start+Math.max(0,ms|0);
  while(Date.now()<deadline){
    if(state.runState[tabKey]&&state.runState[tabKey].batchAbort){
      pushRunEvent(tabKey,'info',`Cooldown skipped — batch aborted by operator after ${(Date.now()-start)/1000|0}s`);
      return false;
    }
    const remaining=deadline-Date.now();
    await new Promise((r)=>setTimeout(r,Math.min(250,remaining)));
  }
  return true;
}
async function runBatch(tabKey,taskIds,modelIds,label){
  if(!taskIds.length){
    state.runState[tabKey]={status:'error',runId:null,lines:['No tasks selected.'],result:null,warn:'Select one or more tests above, then try again.',batchPlanned:0,batchAttempted:0,batchExecuted:0,batchFailed:0,batchPassed:0};
    render();return;
  }
  if(!modelIds.length){
    state.runState[tabKey]={status:'error',runId:null,lines:['No models selected.'],result:null,warn:'Select one or more models from the list above, then try again.',batchPlanned:0,batchAttempted:0,batchExecuted:0,batchFailed:0,batchPassed:0};
    render();return;
  }
  const planned=taskIds.length*modelIds.length;
  // Progress starts empty. Counters only move when something real happens —
  // a run was attempted (POST returned), executed (bundle stored), or failed
  // to start (422 / SSE error). No inflated counts, no fake progress.
  state.runState[tabKey]={
    status:'starting',
    runId:null,
    startedAt:new Date().toISOString(),
    completedAt:null,
    lines:[`${label}: ${taskIds.length} test${taskIds.length===1?'':'s'} × ${modelIds.length} model${modelIds.length===1?'':'s'} = ${planned} run${planned===1?'':'s'} planned.`],
    result:null,
    warn:null,
    batchPlanned:planned,
    batchAttempted:0,
    batchExecuted:0,
    batchFailed:0,
    batchPassed:0,
    // batchTotal/batchDone retained for progress bar; done=attempts resolved, not plan size.
    batchTotal:planned,
    batchDone:0,
    batchItems:buildBatchItems(taskIds,modelIds),
    currentTaskId:taskIds[0]||'',
    currentModelId:modelIds[0]||'',
    recentCompletions:[],
    completedFamilies:[],
    // Mission-banner state: phase cursor + structured event feed.
    phase:'preparing',
    phaseAt:Date.now(),
    currentItemStartedAt:null,
    events:[]
  };
  pushRunEvent(tabKey,'start',`Batch armed · ${planned} run${planned===1?'':'s'} planned`);
  // Batch-local cooldown + abort state. batchAbort defaults false; future
  // stop buttons can flip it. cooldown.byKey tracks consecutive RATE_LIMIT
  // hits per provider+model so backoff escalates.
  state.runState[tabKey].batchAbort=false;
  state.runState[tabKey].cooldown=createCooldownState();
  render();
  await resetAdapterCircuits(modelIds);
  let attempted=0,executed=0,failed=0,couldNotStart=0,skippedByPreflight=0,passed=0;
  outer: for(const taskId of taskIds){
    state.tabData[tabKey]={...(state.tabData[tabKey]||defaultTabState()),selectedTask:taskId};
    render();
    for(const modelId of modelIds){
      if(state.runState[tabKey].batchAbort){pushRunEvent(tabKey,'info','Batch aborted by operator — remaining tests skipped');break outer}
      state.runState[tabKey].lines.push(`Running ${humanizeToken(taskId)} on ${modelId}… (${attempted+1}/${planned} planned)`);
      state.runState[tabKey].status='running';
      state.runState[tabKey].currentTaskId=taskId;
      state.runState[tabKey].currentModelId=modelId;
      state.runState[tabKey].currentItemStartedAt=Date.now();
      setRunPhase(tabKey,'preparing');
      pushRunEvent(tabKey,'next',`Next: ${humanizeToken(taskId)} · ${modelId}`);
      render();
      attempted+=1;
      state.runState[tabKey].batchAttempted=attempted;

      // ── Run the test, then (if rate-limited) cool down and retry once ──
      const key=cooldownKey(taskId,modelId);
      let attempt=0;
      let outcome;
      while(true){
        try{
          outcome=await runSingle(tabKey,taskId,modelId);
        }catch(err){
          outcome={status:'could_not_start',executed:false,pass:false,reason:String(err)};
          state.runState[tabKey].lines.push(`[${humanizeToken(taskId)} :: ${modelId}] DID NOT RUN — ${String(err).slice(0,200)}`);
        }
        if(!RATE_LIMIT_RETRY_ENABLED||attempt>=RATE_LIMIT_MAX_RETRIES||!isRateLimitOutcome(outcome))break;
        const cs=state.runState[tabKey].cooldown;
        const prev=cs.byKey.get(key)||{consecutive:0,lastHitAt:0};
        const consecutive=prev.consecutive+1;
        const retryAfterSec=retryAfterFromOutcome(outcome);
        const waitMs=computeCooldownMs(consecutive,retryAfterSec);
        cs.byKey.set(key,{consecutive,lastHitAt:Date.now()});
        cs.totalHits+=1;
        cs.totalCooldownMs+=waitMs;
        const hint=typeof retryAfterSec==='number'?` (provider Retry-After: ${retryAfterSec}s)`:' (no Retry-After hint)';
        pushRunEvent(tabKey,'info',`Provider cooling down after rate limit${hint} — waiting ~${Math.round(waitMs/1000)}s before retry ${attempt+1}/${RATE_LIMIT_MAX_RETRIES} of ${humanizeToken(taskId)} · ${modelId}`);
        setRunPhase(tabKey,'preparing');
        render();
        const completed=await cooldownSleep(tabKey,waitMs,'rate_limit_backoff');
        if(!completed){
          // Operator aborted — leave the failure as-is and break out.
          break;
        }
        cs.totalRetries+=1;
        pushRunEvent(tabKey,'info',`Retry attempt ${attempt+1}/${RATE_LIMIT_MAX_RETRIES} for ${humanizeToken(taskId)} · ${modelId}`);
        attempt++;
      }
      // If the final outcome succeeded after a previous rate-limit, mark the
      // cooldown lane as recovered (drops the consecutive counter so the
      // *next* hit starts fresh).
      const cs2=state.runState[tabKey].cooldown;
      if(outcome.executed&&cs2.byKey.has(key)){cs2.byKey.delete(key);cs2.totalRecoveries+=1}

      if(outcome.executed){
        executed+=1;
        if(outcome.pass)passed+=1;
      }else if(outcome.status==='failed'){
        failed+=1;
      }else if(outcome.status==='skipped_by_preflight'){
        skippedByPreflight+=1;
      }else{
        couldNotStart+=1;
      }
      state.runState[tabKey].batchExecuted=executed;
      state.runState[tabKey].batchFailed=failed+couldNotStart+skippedByPreflight;
      state.runState[tabKey].batchPassed=passed;
      state.runState[tabKey].batchDone=attempted;
      render();
    }
  }
  state.runState[tabKey].status='complete';
  state.runState[tabKey].runId=null;
  state.runState[tabKey].completedAt=new Date().toISOString();
  setRunPhase(tabKey,'done');
  const summaryParts=[`Done. ${executed} of ${planned} actually ran`,`${passed} passed`];
  if(failed>0)summaryParts.push(`${failed} failed after start`);
  if(couldNotStart>0)summaryParts.push(`${couldNotStart} couldn't start`);
  if(skippedByPreflight>0)summaryParts.push(`${skippedByPreflight} skipped by preflight`);
  const cs=state.runState[tabKey].cooldown;
  if(cs&&cs.totalHits>0){
    summaryParts.push(`${cs.totalHits} provider rate limit${cs.totalHits===1?'':'s'} · ${cs.totalRetries} retr${cs.totalRetries===1?'y':'ies'} attempted · ${cs.totalRecoveries} recovered · ${(cs.totalCooldownMs/1000)|0}s cooldown total`);
  }
  const summary=`${summaryParts.join(' — ')}.`;
  state.runState[tabKey].lines.push(summary);
  pushRunEvent(tabKey,'done',summary);
  await refreshRunSurfaces(tabKey,{all:true});
  render();
}

// Pre-run gate — compares selected model list against the current health
// snapshot. Cloud models fail fast when offline or when their provider's last
// test failed; local models stay usable. If *any* selected model is blocked,
// the user is shown a plain-English summary + offered to continue with the
// reachable subset, or cancel. Returns the filtered list, or null if the user
// cancels.
// Records the last gate decision on `state.lastDispatchGate` so callers (and
// tests) can verify a "silent no-op" did NOT happen — a block always records
// a structured reason whether or not a confirm dialog was shown.
function gateSelectedModels(selectedModels){
  const blocked=blockedRunReasons(selectedModels);
  const releaseSummary=selectedReleaseCertificationSummary(selectedModels);
  if(releaseSummary.uncertified.length&&typeof confirm==='function'){
    const names=releaseSummary.uncertified.map((item)=>`${item.id} — ${item.cert.label}`).join('\n');
    const msg=`Uncertified target — results are useful for exploration but are outside the certified release scope.\n\n${names}\n\nContinue anyway?`;
    if(!confirm(msg)){state.lastDispatchGate={result:'cancelled_uncertified',blocked:[],selectedModels,at:Date.now()};return null}
  }
  if(!blocked.length){
    state.lastDispatchGate={result:'allowed',blocked:[],selectedModels,at:Date.now()};
    return selectedModels;
  }
  const reachable=selectedModels.filter((id)=>canRunModel(id));
  if(typeof alert!=='function'&&typeof confirm!=='function'){
    state.lastDispatchGate={result:reachable.length?'partial_no_prompt':'blocked_no_prompt',blocked,selectedModels,reachable,at:Date.now()};
    return reachable.length?reachable:null;
  }
  const lines=blocked.map((b)=>`• ${b.modelId} — ${b.reason}`).join('\n');
  if(!reachable.length){
    if(typeof alert==='function')alert(`None of the ${selectedModels.length} selected models can run right now.\n\n${lines}\n\nCheck the status bar, fix providers, and try again.`);
    state.lastDispatchGate={result:'blocked_alerted',blocked,selectedModels,reachable:[],at:Date.now()};
    return null;
  }
  const msg=`${blocked.length} of ${selectedModels.length} selected model${selectedModels.length===1?'':'s'} can't run right now:\n\n${lines}\n\nContinue with the ${reachable.length} reachable model${reachable.length===1?'':'s'}? (Cancel to abort and fix providers.)`;
  if(!confirm(msg)){state.lastDispatchGate={result:'partial_cancelled',blocked,selectedModels,reachable,at:Date.now()};return null}
  state.lastDispatchGate={result:'partial_allowed',blocked,selectedModels,reachable,at:Date.now()};
  return reachable;
}
function surfaceBlockedDispatch(tabKey,label){
  // Make a blocked dispatch visible to the operator instead of letting the
  // run button silently no-op. Pushes a structured entry onto the lane's
  // activity feed and records a sentinel record on state so a broad sweep
  // can detect "dispatch was blocked" rather than "dispatch silently
  // disappeared". This is the failure mode the 2026-05-24 broad browser
  // sweep hit.
  const gate=state.lastDispatchGate;
  if(!gate)return;
  const reasons=(gate.blocked||[]).map((b)=>`${b.modelId}: ${b.reason}`).join(' | ');
  const summary=`Dispatch blocked — ${gate.result}. ${reasons||'No reachable models for current health snapshot.'}`;
  if(!state.runState[tabKey])state.runState[tabKey]={lines:[],events:[],status:'blocked',startedAt:new Date().toISOString()};
  if(!Array.isArray(state.runState[tabKey].lines))state.runState[tabKey].lines=[];
  state.runState[tabKey].lines.push(`[${label}] ${summary}`);
  pushRunEvent(tabKey,'blocked',summary);
  render();
}
async function handleRun(tabKey){
  const tab=state.tabData[tabKey]||defaultTabState();
  const selectedTasks=tab.selectedTasks||[];
  const rc=tab.runCount==null?'all':tab.runCount;
  // Honor the run-count segmented control: 1/3/5/10 caps the slice; 'all' runs every selected test.
  const limit=rc==='all'?selectedTasks.length:Math.min(Number(rc)||0,selectedTasks.length);
  const taskIds=selectedTasks.slice(0,Math.max(0,limit));
  const label=rc==='all'?`Run all ${taskIds.length} selected`:`Run ${taskIds.length} of ${selectedTasks.length} selected`;
  const models=gateSelectedModels(tab.selectedModels||[]);
  if(models===null){surfaceBlockedDispatch(tabKey,label);return}
  await runBatch(tabKey,taskIds,models,label);
}
async function handleRunAll(tabKey){
  const models=gateSelectedModels((state.tabData[tabKey]?.selectedModels)||[]);
  if(models===null){surfaceBlockedDispatch(tabKey,'Lane batch run');return}
  await runBatch(tabKey,taskOptionsForTab(tabKey).map((task)=>task.id),models,'Lane batch run');
}

function renderTaskOptions(tabKey){const tabState=state.tabData[tabKey]||defaultTabState();return taskOptionsForTab(tabKey).map((task)=>`<option value="${esc(task.id)}" ${tabState.selectedTask===task.id?'selected':''}>${esc(displayTestName(task))} (${esc(task.id)}) · ${esc(TASK_FAMILY_LABELS[task.family]||task.family)} · ${esc(task.difficulty)}</option>`).join('')}

// ── System health ─────────────────────────────────────────────────────────
// Background liveness probe. Three signals feed the top-level status bar:
//   1. Browser online/offline events (instant)
//   2. `/api/health` ping every HEALTH_POLL_MS (server reachability + baseline
//      network liveness — the request itself confirms both)
//   3. Registered providers' lastTestedOk/lastTestedReason from
//      /api/registry/state (cached, refreshed on each poll cycle)
// `state.health.summary` collapses all three into one of:
//   online | degraded | offline | unknown
// Guard with a short timeout so a wedged server still yields a decisive
// "offline" verdict rather than hanging the poller forever.
function withTimeout(ms){
  if(typeof AbortController==='undefined')return{signal:undefined,cancel:()=>{}};
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms);
  return{signal:ctrl.signal,cancel:()=>clearTimeout(timer)};
}
function classifyError(err,stage){
  const providerError=err&&((err.provider_error||err.providerError)||null);
  if(providerError&&typeof providerError==='object'){
    const origin=String(providerError.origin||'').toUpperCase();
    const kind=String(providerError.kind||'').toUpperCase();
    if(kind==='TIMEOUT')return'timeout';
    if(kind==='AUTH')return'auth';
    if(kind==='RATE_LIMIT')return'rate_limited';
    if(kind==='HTTP_5XX'||kind==='UNAVAILABLE')return'upstream_error';
    if(origin==='NETWORK'||kind==='NETWORK'||kind==='CONNECTION_RESET'||kind==='DNS')return'network';
    if(origin==='PROVIDER'||origin==='ADAPTER'||origin==='LOCAL_RUNTIME')return'provider';
  }
  const status=err&&typeof err.status==='number'?err.status:null;
  if(status===429)return'rate_limited';
  if(status===401||status===403)return'auth';
  if(status&&status>=500&&status<=599)return'upstream_error';
  const msg=String(err&&(err.message||err.reason||err.error)||err||'').toLowerCase();
  if(msg.includes('abort')||msg.includes('timeout')||msg.includes('timed out'))return'timeout';
  // Substring matchers below are intentionally specific: "auth", "rate", and "5"
  // appear in too many benign strings ("generate", "author", "iterate", any number
  // starting with 5). Require the actual signal token, not a fragment of one.
  if(/\b(unauthori[sz]ed|forbidden|invalid[ _-]?api[ _-]?key|missing[ _-]?api[ _-]?key)\b/.test(msg))return'auth';
  if(/\b(rate[ _-]?limit(ed|ing)?|ratelimit(ed|ing)?|too[ _-]many[ _-]requests)\b/.test(msg)||msg.includes('429'))return'rate_limited';
  if(/\b5\d\d\b/.test(msg))return'upstream_error';
  if(msg.includes('failed to fetch')||msg.includes('networkerror')||msg.includes('enotfound')||msg.includes('econnrefused')||/\bnetwork\b/.test(msg))return'network';
  if(stage==='health_check'||stage==='adapter_init')return'provider';
  if(stage==='preflight')return'preflight';
  return'other';
}
function failureReasonLabel(kind){
  switch(kind){
    case'timeout':return'Timed out';
    case'auth':return'Auth failed';
    case'rate_limited':return'Rate-limited';
    case'upstream_error':return'Provider error';
    case'network':return'Network unreachable';
    case'provider':return'Provider unavailable';
    case'preflight':return'Preflight check blocked the run';
    default:return'Failed';
  }
}
function healthLastKnownGoodFresh(now){
  const t=Number(state.health.lastSuccessAt||0);
  if(!t)return false;
  return(now-t)<HEALTH_LAST_KNOWN_TTL_MS;
}
function healthIsRateLimited(now){
  const rl=state.health.rateLimit;
  if(!rl)return false;
  return Number(rl.until||0)>now;
}
async function runHealthChecks(opts){
  const force=!!(opts&&opts.force);
  const now=Date.now();
  if(state.health.checking)return;
  // Dedupe: collapse bursts caused by online/visibilitychange + interval
  // firing back-to-back. Forced refreshes still respect a small floor so a
  // tight loop of `runHealthChecks({force:true})` cannot itself trip the
  // server's RATE_READ bucket — that was the regression captured in the
  // 2026-05-24T11-* lane-cert evidence.
  if(!force&&(now-Number(state.health.lastRequestAt||0))<HEALTH_MIN_INTERVAL_MS)return;
  // Respect server-issued Retry-After: while the rate-limit window is active,
  // do not issue further /api/health requests. The UI continues to use the
  // last-known-good snapshot during this window.
  if(healthIsRateLimited(now)&&!force)return;
  state.health.checking=true;
  state.health.lastRequestAt=now;
  // 1. Browser-level indicator — if the browser already knows we're offline,
  // skip the fetch (it'd fail anyway) and record the verdict.
  if(typeof navigator!=='undefined'&&navigator.onLine===false){
    state.health.net={ok:false,lastCheckedAt:now,error:'browser reports offline',latencyMs:0,rateLimited:false};
    state.health.rateLimit=null;
  }else{
    const started=now;
    const{signal,cancel}=withTimeout(HEALTH_PING_TIMEOUT_MS);
    try{
      const res=await fetch('/api/health',{method:'GET',signal,cache:'no-store'});
      cancel();
      const completedAt=Date.now();
      if(res.ok){
        state.health.net={ok:true,lastCheckedAt:completedAt,error:null,latencyMs:completedAt-started,rateLimited:false};
        state.health.lastSuccessAt=completedAt;
        state.health.rateLimit=null;
      }else if(res.status===429){
        // Luak's own RATE_READ kicked in (broad browser sweep, polling
        // fallback storm, etc.). Treat as transient: if we have a recent
        // last-known-good snapshot, keep using it and surface a visible
        // "rate-limited; using last known health" warning. If we have no
        // baseline yet, degrade to `unknown` (NOT `false`), so cloud dispatch
        // can be blocked with an honest reason instead of pretending the
        // provider itself is offline.
        let retryAfterSec=0;
        try{
          const headerValue=typeof res.headers?.get==='function'?res.headers.get('Retry-After'):null;
          if(headerValue){retryAfterSec=Math.max(0,Number(headerValue)||0)}
          if(!retryAfterSec){
            const body=await res.clone().json().catch(()=>null);
            if(body&&Number(body.retry_after_sec))retryAfterSec=Math.max(0,Number(body.retry_after_sec));
          }
        }catch{/* ignore parse failures */}
        if(!retryAfterSec)retryAfterSec=10;
        const until=completedAt+retryAfterSec*1000;
        state.health.rateLimit={until,retryAfterSec,lastHit:completedAt};
        const fresh=healthLastKnownGoodFresh(completedAt);
        state.health.net={
          ok:fresh?true:null,
          lastCheckedAt:completedAt,
          error:fresh
            ?`Health refresh rate-limited (HTTP 429); using last known health (${Math.round((completedAt-state.health.lastSuccessAt)/1000)}s old). Retry after ${retryAfterSec}s.`
            :`Health refresh rate-limited (HTTP 429) and no recent last-known-good snapshot. Retry after ${retryAfterSec}s.`,
          latencyMs:completedAt-started,
          rateLimited:true
        };
      }else{
        state.health.net={ok:false,lastCheckedAt:completedAt,error:`HTTP ${res.status}`,latencyMs:completedAt-started,rateLimited:false};
        state.health.rateLimit=null;
      }
    }catch(err){
      cancel();
      const completedAt=Date.now();
      const kind=classifyError(err);
      state.health.net={ok:false,lastCheckedAt:completedAt,error:`${failureReasonLabel(kind)}${err&&err.message?' · '+err.message.slice(0,80):''}`,latencyMs:completedAt-started,rateLimited:false};
      state.health.rateLimit=null;
    }
  }
  // 2. Provider reachability — if the server is up, refresh the registry so
  // lastTestedOk/lastTestedReason are current, then aggregate per preset key
  // (openrouter / anthropic / etc.). Skipping the registry refresh when the
  // server is down avoids adding more failures to the log.
  // When we are inside a transient 429 window, do NOT refresh the registry —
  // that would just stack more reads into the same RATE_READ bucket.
  if(state.health.net.ok&&!state.health.net.rateLimited){
    try{await loadRegistry()}catch{/* already logged upstream */}
  }
  state.health.providers=aggregateProviderHealth();
  // When we have a fresh last-known-good snapshot but the current probe was
  // rate-limited, preserve the previous per-provider verdicts so cloud
  // dispatch keeps working. We still update lastSuccessProviders only on
  // success so a long 429 window cannot ratchet the baseline forward.
  if(state.health.net.rateLimited&&healthLastKnownGoodFresh(Date.now())&&state.health.lastSuccessProviders){
    state.health.providers=state.health.lastSuccessProviders;
  }else if(!state.health.net.rateLimited&&state.health.net.ok){
    state.health.lastSuccessProviders=JSON.parse(JSON.stringify(state.health.providers));
  }
  state.health.summary=computeHealthSummary();
  state.health.lastSummaryAt=Date.now();
  state.health.checking=false;
  render();
}
function aggregateProviderHealth(){
  // Returns per-preset aggregated status. Model groups refer to presets
  // ('ollama','openrouter','anthropic',…); the registry has 0..N configured
  // providers per preset. Any provider whose last test passed marks the preset
  // reachable. If all registered providers for a preset failed, mark it down.
  // Ollama is probed indirectly via /api/models — if any local model is listed
  // and the server ping succeeded, local is reachable.
  const out={};
  const registered=state.registry?.providers||[];
  const groups=mergedModelGroups();
  const now=Date.now();
  // Treat the net as "up" for aggregation purposes when /api/health was just
  // rate-limited but we have a fresh last-known-good snapshot. Aggregation
  // running with a stale-offline net would mark every cloud preset 'down'
  // even though the providers themselves are believed reachable.
  const netUpForAggregation=state.health.net.ok===true||(state.health.net.rateLimited&&healthLastKnownGoodFresh(now));
  for(const group of groups){
    const presetId=group.providerId;
    if(group.kind==='local'){
      const netUp=netUpForAggregation;
      const hasModels=(state.liveModels||[]).length>0;
      out[presetId]={

function computeHealthSummary(){

  // dedicated "rate_limited" state so the chip can render it distinctly.
  if(state.health.net.rateLimited&&healthLastKnownGoodFresh(Date.now()))return'rate_limited';
  if(state.health.net.ok===false)return'offline';
  if(state.health.net.ok===null)return'unknown';
  const providers=Object.values(state.health.providers||{});
  const cloud=providers.filter((p)=>p.kind==='cloud');
  const cloudDown=cloud.filter((p)=>p.status==='down').length;
  const local=providers.filter((p)=>p.kind==='local');
  const localDown=local.filter((p)=>p.status==='down').length;
  // "Down" = actively failing. Unconfigured/untested cloud providers are not
  // failures — the user simply hasn't set them up yet. If nothing is down and
  // the network + local stack are up, the system is online. "Degraded" is
  // reserved for real failures on otherwise-configured providers.
  if(cloudDown>0||localDown>0)return'degraded';

function fmtRelativeTime(ts){

  if(delta<2000)return'just now';
  if(delta<60000)return`${Math.round(delta/1000)}s ago`;
  if(delta<3600000)return`${Math.round(delta/60000)}m ago`;
  if(delta<86400000)return`${Math.round(delta/3600000)}h ago`;
  return`${Math.round(delta/86400000)}d ago`;

function fmtElapsedCompact(ms){
  const n=Number(ms||0);
  if(!Number.isFinite(n)||n<=0)return'0s';
  if(n<1000)return`${Math.round(n)}ms`;
  const s=Math.floor(n/1000);
  if(s<60)return`${s}s`;
  const m=Math.floor(s/60);

  if(m<60)return`${m}:${String(rs).padStart(2,'0')}`;

      return`<div class="ranked-row clickable ${focused}" onclick="${clickFn}"${kbClick(clickFn)} aria-label="Inspect ${esc(safeStr(entry.model))}"><div class="ranked-pos">#${i+1}</div><div class="ranked-model" title="${esc(safeStr(entry.model))}">${esc(safeStr(entry.model))}</div><div class="ranked-bar"><div class="ranked-fill" style="width:${width}%"></div></div><div class="ranked-score">${score}%</div><div class="ranked-meta">${safeNum(entry.runs)}R${provTag}${failTag}</div></div>`;
    }).join('')}</div>`;
  } else if(mode==='table'){
    body=`<div class="ranked-table-wrap"><table class="ranked-table"><thead><tr><th>#</th><th>Model</th><th>Score</th><th>Pass</th><th>Crit Fail</th><th>Runs</th><th>Status</th></tr></thead><tbody>${entries.map((entry,i)=>{
      const score=safeScore(entry.avgOverall);
      const passRate=safeNum(entry.passRate);
      const failRate=entry.runs>0?Math.round((safeNum(entry.failures)/entry.runs)*100):0;
      const adequate=entry.sampleAdequate!==false;
      const statusLabel=adequate?'TRUSTED':'PROVISIONAL';
      const statusCls=adequate?'teal':'dim';
      const focused=focusedModel&&normalizeId(entry.model)===normalizeId(focusedModel)?'focused':'';
      const clickFnT=`focusModelDrilldown('${esc(tabKey)}','${esc(safeStr(entry.model))}')`;
      return`<tr class="clickable ${focused}" onclick="${clickFnT}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${clickFnT}}" aria-label="Inspect ${esc(safeStr(entry.model))}"><td>${i+1}</td><td class="rt-model">${esc(safeStr(entry.model))}</td><td class="rt-score ${score>=80?'teal':score>=55?'orange':'red'}">${score}%</td><td>${passRate}%</td><td class="${failRate>10?'red':''}">${failRate}%</td><td>${safeNum(entry.runs)}</td><td><span class="tag ${statusCls}">${statusLabel}</span></td></tr>`;
    }).join('')}</tbody></table></div>`;
  } else {
    body=`<div class="ranked-chart">${entries.map((entry,i)=>{
      const score=safeScore(entry.avgOverall);
      const width=Math.max(4,Math.round((score/top)*100));
      const cls=score>=80?'pass':score>=55?'warn':'fail';
      const focused=focusedModel&&normalizeId(entry.model)===normalizeId(focusedModel)?'focused':'';
      const clickFnC=`focusModelDrilldown('${esc(tabKey)}','${esc(safeStr(entry.model))}')`;
      return`<div class="chart-row clickable ${focused}" onclick="${clickFnC}"${kbClick(clickFnC)} aria-label="Inspect ${esc(safeStr(entry.model))}"><div class="chart-label">${esc(safeStr(entry.model).slice(0,18))}</div><div class="chart-bar-track"><div class="chart-bar-fill ${cls}" style="width:${width}%"></div><span class="chart-bar-value">${score}%</span></div></div>`;
    }).join('')}</div>`;
  }

  const drilldown=focusedModel?renderModelDrilldown(tabKey,focusedModel):'';

  return`<section class="panel benchmark-results" style="padding:14px">
    <div class="benchmark-results-head">
      <div><div class="mini-label">MODEL LEADERBOARD</div><h3 class="panel-title">Ranked Model Comparison</h3></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${toggles}
        <span class="chip ${scope.kind==='lane'?'teal':'cyan'} scope-chip" data-scope-kind="${scope.kind}">SCOPE · ${esc(scope.scopeLabel)}</span>
        ${exportBtns}
      </div>
    </div>
    ${body}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
      <span class="tag dim">${entries.length} MODEL${entries.length===1?'':'S'} RANKED</span>
      <span class="tag dim">${scope.sampleSize} TOTAL RUN${scope.sampleSize===1?'':'S'}</span>
      ${scope.provisional?'<span class="tag amber">PROVISIONAL DATA</span>':''}
      ${entries[0]?`<span class="tag teal">LEADER · ${esc(safeStr(entries[0].model).slice(0,20).toUpperCase())}</span>`:''}
    </div>
  </section>${drilldown}`;
}

function renderModelDrilldown(tabKey,modelId){

  const scope=laneScopeDescriptor(tabKey);

    ?`<div class="export-group"><button type="button" class="export-btn" onclick="exportDrilldownJSON('${esc(tabKey)}','${esc(modelId)}')" title="Export this model's runs as JSON">JSON</button><button type="button" class="export-btn" onclick="exportDrilldownCSV('${esc(tabKey)}','${esc(modelId)}')" title="Export this model's runs as CSV">CSV</button></div>`

function renderComparisonBars(tabKey,title,entries,metricKey='avgOverall'){
  const scope=laneScopeDescriptor(tabKey);
  const dataError=state.tabData?.[tabKey]?.dataError||null;
  const errorBanner=dataError?renderDataErrorState(tabKey,dataError):'';
  if(!entries.length){
    const emptyMsg=dataError
      ? errorGuidance(dataError)
      : scope.kind==='lane'
      ? `No ${scope.tabLabel.toLowerCase()} runs are available for ranking yet. Run this lane or import run history to populate the leaderboard.`
      : scope.kind==='global'
        ? 'No runs are available for ranking across any lane yet. Run a lane or import run history to populate the leaderboard.'
        : 'No comparable data in this view.';
    const emptyTitle=dataError?`${failureReasonLabel(dataError.kind).toUpperCase()} · RANKINGS INCOMPLETE`:`NO RANKABLE RUNS · SCOPE · ${scope.scopeLabel}`;
    return`<section class="panel" style="padding:14px"><div class="section-head"><div><div class="mini-label">GRAPH FIRST</div><h3>${esc(title)}</h3></div><span class="chip dim scope-chip" data-scope-kind="${scope.kind}" title="${esc(scope.familiesLabel)}">SCOPE · ${esc(scope.scopeLabel)}</span></div>${errorBanner}<div class="empty empty-lane"><div class="empty-title">${esc(emptyTitle)}</div><div class="empty-body">${esc(emptyMsg)}</div></div></section>`;
  }
  const top=Math.max(...entries.map((entry)=>Number(entry[metricKey]||0)),1);
  // "BEST" badge is only meaningful when at least one row clears the sample
  // threshold AND the leading row has enough runs to stand on. Below that we
  // render a dim "top-by-n%" tag so the rank is visible but doesn't claim
  // authority it hasn't earned.
  const topEntryRuns=Number(entries[0]?.runs||0);
  const canCrownBest=topEntryRuns>=LEADERBOARD_MIN_N_UI&&!scope.provisional;
  const provisionalBanner=scope.kind==='lane'&&scope.provisional
    ? `<div class="inline-warn" style="color:var(--amber,#d97706);border-color:rgba(217,119,6,.32);background:rgba(217,119,6,.06)">PROVISIONAL · ${scope.sampleSize} run${scope.sampleSize===1?'':'s'} in scope · fewer than ${LEADERBOARD_MIN_N_UI} meet the sample threshold — treat rankings as indicative, not authoritative.</div>`
    : '';
  return`<section class="panel" style="padding:14px">
    <div class="section-head"><div><div class="mini-label">GRAPH FIRST</div><h3>${esc(title)}</h3></div><span class="chip ${scope.kind==='lane'?'teal':'dim'} scope-chip" data-scope-kind="${scope.kind}" title="${esc(scope.familiesLabel)}">SCOPE · ${esc(scope.scopeLabel)}</span></div>
    ${errorBanner}
    ${provisionalBanner}
    <div class="comparison-chart">${entries.map((entry,index)=>{const score=Math.round(Number(entry[metricKey]||0));const width=Math.max(6,Math.round((score/top)*100));const cls=score>=80?'pass':score>=55?'warn':'fail';const tooFewRuns=Number(entry.runs||0)<LEADERBOARD_MIN_N_UI;const bestTag=index===0&&canCrownBest?'<span class="tag teal">BEST</span>':(index===0?'<span class="tag dim" title="Leading, but sample is under the provisional threshold">TOP · n='+Number(entry.runs||0)+'</span>':'');const nTag=tooFewRuns?'<span class="tag dim" title="Under '+LEADERBOARD_MIN_N_UI+' runs — provisional">n='+Number(entry.runs||0)+'</span>':'';return`<div class="comparison-row ${cls}"><div class="comparison-head"><div class="comparison-model" title="${esc(entry.model)}">${esc(entry.model)}</div><div class="comparison-meta">${entry.runs||0}R · ${entry.passRate||0}% pass</div></div><div class="comparison-bar"><div class="comparison-fill" style="width:${width}%"></div></div><div class="comparison-score">${score}%</div><div class="comparison-tags">${bestTag}${nTag}${entry.costAvg>0?`<span class="tag dim">${esc(fmtMoney(entry.costAvg))}</span>`:''}${entry.durationAvg>0?`<span class="tag dim">${esc(fmtMs(entry.durationAvg))}</span>`:''}</div></div>`}).join('')}</div>
  </section>`;
}

function errorGuidance(err){
  const kind=err?.kind||'other';
  if(kind==='rate_limited')return'Luak was rate-limited while loading this view. Cached/local content may be incomplete. Wait a moment, then refresh this lane.';
  if(kind==='auth')return'This request needs a valid session. Sign in again, then refresh the view.';
  if(kind==='network')return'The local API could not be reached. Confirm the server is still running and refresh.';
  if(kind==='timeout')return'The local API did not respond before the timeout. The view may be incomplete; retry after the server settles.';
  return'Luak could not load this view completely. Existing data is preserved, but rankings may be incomplete until refresh succeeds.';
}

function renderDataErrorState(tabKey,err){
